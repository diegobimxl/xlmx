<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XLMX — XL Tool Library</title>
<style>
:root{
  --bg:#030307;--bg2:#07070f;--sf:rgba(255,255,255,.025);--bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.11);
  --tx:#e2e8f0;--mu:#6b7280;--mu2:#9ca3af;
  --gold:#c8a96e;--gold2:rgba(200,169,110,.12);
  --ind:#818cf8;--ind2:rgba(99,102,241,.12);
  --grn:#34d399;--red:#f87171;--pur:#a78bfa;--cya:#22d3ee;--amb:#fbbf24;--eme:#4ade80;--ros:#fb7185;--sky:#60a5fa;--tea:#2dd4bf;--lim:#a3e635;--ora:#fb923c;--sla:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden;}

/* ── grid ── */
body::before{content:"";position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:64px 64px;pointer-events:none;z-index:0;}

/* ── nav ── */
nav{position:sticky;top:0;z-index:100;background:rgba(3,3,7,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 28px;height:52px;}
.logo{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--gold);font-family:"JetBrains Mono",monospace;white-space:nowrap;}
.logo span{color:var(--mu);font-weight:400;}
.nav-stretch{flex:1;}
.nav-search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);
  border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--mu);font-size:13px;transition:all .2s;}
.nav-search:hover{border-color:var(--bd2);color:var(--mu2);}
.nav-search kbd{background:rgba(255,255,255,.06);border:1px solid var(--bd2);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--mu);}
.pro-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;}
.pro-tog{position:relative;width:36px;height:20px;flex-shrink:0;}
.pro-tog input{opacity:0;width:0;height:0;position:absolute;}
.pro-track{position:absolute;inset:0;background:rgba(255,255,255,.08);border:1px solid var(--bd2);border-radius:10px;transition:.2s;}
.pro-track::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;background:var(--mu);border-radius:50%;transition:.2s;}
.pro-tog input:checked+.pro-track{background:var(--gold2);border-color:var(--gold);}
.pro-tog input:checked+.pro-track::after{background:var(--gold);transform:translateX(16px);}
.pro-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu);transition:.2s;}
.pro-tog input:checked~.pro-lbl{color:var(--gold);}
#liveCount{background:var(--ind2);border:1px solid rgba(99,102,241,.3);color:var(--ind);font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px;letter-spacing:.05em;}

/* ── hero ── */
.hero{position:relative;z-index:1;text-align:center;padding:80px 32px 52px;overflow:hidden;}
.hero-blob{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.hero-blob::before{content:"";position:absolute;width:700px;height:480px;
  top:50%;left:40%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(99,102,241,.22) 0%,transparent 65%);filter:blur(70px);}
.hero-blob::after{content:"";position:absolute;width:500px;height:360px;
  top:40%;left:60%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(200,169,110,.15) 0%,transparent 60%);filter:blur(60px);}
.hero h1{font-size:clamp(36px,5.5vw,62px);font-weight:900;letter-spacing:-.04em;line-height:1.05;margin-bottom:24px;position:relative;}
.hero h1 .g{
  background:linear-gradient(135deg,#e8c87e 0%,#c084fc 45%,#818cf8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ── stats ── */
.stats-row{display:flex;justify-content:center;gap:56px;margin-bottom:44px;position:relative;}
.stat-blk{text-align:center;}
.stat-n{font-size:36px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.stat-n.c1{color:var(--gold);}
.stat-n.c2{color:var(--ind);}
.stat-n.c3{color:var(--pur);}
.stat-l{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-top:4px;}

/* ── search ── */
.search-center{max-width:700px;margin:0 auto;position:relative;}
.search-box{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);
  border:1px solid var(--bd2);border-radius:14px;padding:14px 20px;
  transition:border-color .2s,box-shadow .2s;}
.search-box:focus-within{border-color:var(--ind);box-shadow:0 0 0 3px rgba(99,102,241,.12),0 0 40px rgba(99,102,241,.08);}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;font-family:inherit;}
.search-box input::placeholder{color:var(--mu);}
.srch-icon{color:var(--mu);font-size:18px;}
.srch-clear{color:var(--mu);cursor:pointer;font-size:16px;display:none;}
.srch-clear.vis{display:block;}
.random-btn{display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--ind2),rgba(99,102,241,.06));
  border:1px solid rgba(99,102,241,.25);color:var(--ind);
  padding:9px 22px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.04em;margin-top:20px;transition:all .2s;}
.random-btn:hover{border-color:var(--ind);box-shadow:0 0 24px rgba(99,102,241,.2);}

/* ── category section ── */
.cat-section{position:relative;z-index:1;padding:0 32px 12px;}
.cat-section-hdr{display:flex;align-items:center;gap:16px;padding:24px 0 20px;}
.cat-section-hdr h2{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mu);text-transform:uppercase;}
.cat-section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent);}
#catNav{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:20px;}
.cpill{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:9px;border:1px solid;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;font-size:12px;font-weight:600;line-height:1;white-space:nowrap;}
.cpill::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s;background:currentColor;}
.cpill:hover::before{opacity:.05;}
.cpill.active::before{opacity:.08;}
.cicon{font-size:16px;line-height:1;transition:color .2s;flex-shrink:0;}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cpill span.cname{color:inherit;}
.cpill .ccnt{font-size:10px;font-family:"JetBrains Mono",monospace;opacity:.55;margin-left:2px;}

/* ── tool grid ── */
#toolGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px;padding:0 32px 48px;position:relative;z-index:1;}
@keyframes card-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card{
  background:var(--sf);border:1px solid var(--bd);border-top-width:2px;
  border-radius:12px;padding:18px 20px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;will-change:transform;
  animation:card-in .22s ease both;transition:border-color .2s,box-shadow .2s,background .2s;
}
.card:hover{background:rgba(255,255,255,.035);box-shadow:0 6px 28px rgba(0,0,0,.5);}
.card.pro-glow{box-shadow:0 0 14px rgba(200,169,110,.12);}
.card.soon-card{opacity:.38;}
.probadge{display:none;position:absolute;top:10px;right:10px;background:var(--gold2);
  border:1px solid rgba(200,169,110,.4);color:var(--gold);font-size:9px;font-weight:800;
  letter-spacing:.1em;padding:2px 6px;border-radius:4px;}
.pro-glow .probadge{display:block;}
.cat-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.card h3{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:6px;line-height:1.3;}
.card p{font-size:12px;color:var(--mu2);flex:1;line-height:1.5;}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);}
.code-snip{font-family:"JetBrains Mono",monospace;font-size:10px;color:rgba(200,169,110,.4);}
.run-link{font-size:11px;font-weight:700;color:var(--ind);text-decoration:none;letter-spacing:.04em;transition:color .15s;}
.run-link:hover{color:var(--pur);}
.slive{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--grn);text-transform:uppercase;}
.ssoon{font-size:9px;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--mu);}
.empty .eb{font-size:18px;font-weight:700;color:var(--tx);margin-bottom:8px;}
.sep{height:1px;background:var(--bd);margin:0 32px 28px;position:relative;z-index:1;}

/* ── power bar ── */
.power-bar-wrap{padding:0 32px 20px;position:relative;z-index:1;}
#powerLbl{font-size:10px;color:var(--mu);margin-bottom:5px;font-family:"JetBrains Mono",monospace;}
#powerBar{height:2px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
#powerFill{height:100%;width:0;background:linear-gradient(90deg,var(--ind),var(--pur));transition:width .5s;}

/* ── status ── */
#statusWrap{padding:0 32px 20px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
.srow{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;display:flex;align-items:center;gap:8px;font-size:11px;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--grn);flex-shrink:0;}
.sname{color:var(--mu);}
.slat{color:var(--grn);font-family:"JetBrains Mono",monospace;margin-left:8px;}

/* ── console ── */
#consoleWrap{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(3,3,7,.97);border-top:1px solid var(--bd);font-family:"JetBrains Mono",monospace;font-size:11px;}
#cbar{display:flex;align-items:center;gap:10px;padding:6px 16px;cursor:pointer;color:var(--mu);}
.cdot-anim{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
#clog{max-height:100px;overflow-y:auto;padding:2px 0;}
.cl{display:flex;gap:10px;padding:2px 16px;}
.ctag{width:34px;font-size:10px;font-weight:700;text-align:center;flex-shrink:0;}
.ctag.ok{color:var(--grn);}.ctag.warn{color:var(--amb);}.ctag.err{color:var(--red);}.ctag.sys{color:var(--pur);}
.cmod{width:42px;color:var(--mu);font-size:10px;flex-shrink:0;}
.cmsg{color:var(--tx);font-size:10px;}

/* ── cmd palette ── */
#cmdOverlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:flex-start;justify-content:center;padding-top:80px;}
#cmdOverlay.open{display:flex;}
#cmdBox{background:#0a0a12;border:1px solid var(--bd2);border-radius:14px;width:min(680px,90vw);max-height:70vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 0 1px rgba(99,102,241,.08);}
#cmdInput{background:none;border:none;outline:none;color:var(--tx);font-size:16px;font-family:inherit;padding:18px 20px;border-bottom:1px solid var(--bd);}
#cmdRes{overflow-y:auto;max-height:48vh;}
.citem{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.1s;}
.citem:hover,.citem.sel{background:rgba(255,255,255,.04);}
.citem-cat{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.04em;width:80px;flex-shrink:0;text-transform:uppercase;}
.citem-name{font-size:13px;font-weight:600;color:var(--tx);}
.citem-hint{font-size:11px;color:var(--mu);margin-left:auto;}
.cmd-footer{padding:8px 16px;border-top:1px solid var(--bd);display:flex;gap:16px;font-size:11px;color:var(--mu);}
.cmd-footer kbd{background:rgba(255,255,255,.06);border:1px solid var(--bd2);border-radius:3px;padding:1px 5px;font-size:10px;}

/* -- physics arena -- */
#physicsArena{position:relative;width:100%;height:64vh;min-height:420px;overflow:hidden;z-index:1;background:transparent;}
.cat-bubble{position:absolute;left:0;top:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;will-change:transform;border:2px solid;pointer-events:none;box-shadow:0 0 16px rgba(0,0,0,.35);}
.cat-bubble .bic{font-size:28px;line-height:1;pointer-events:none;}
.cat-bubble .bname{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:4px;pointer-events:none;text-align:center;padding:0 6px;line-height:1.2;}
.cat-bubble .bcnt{font-size:8px;opacity:.55;font-family:'JetBrains Mono',monospace;pointer-events:none;margin-top:2px;}
.cat-bubble.is-active{outline:2px solid rgba(255,255,255,.45);outline-offset:4px;}
#catTooltip{position:fixed;pointer-events:none;z-index:9999;background:rgba(3,3,7,.92);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 11px;font-size:12px;font-weight:700;color:#e2e8f0;display:none;letter-spacing:.05em;white-space:nowrap;transform:translate(16px,-50%);}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<nav>
  <span class="logo">XLMX <span>/ UTILITY LIBRARY</span></span>
  <div class="nav-stretch"></div>
  <div class="nav-search" onclick="openCmd()">
    <span class="srch-icon">&#9906;</span>
    <span>Search tools...</span>
    <kbd>&#8984;K</kbd>
  </div>
  <label class="pro-wrap">
    <span class="pro-tog"><input type="checkbox" id="proChk" onchange="togglePro(this.checked)"><span class="pro-track"></span></span>
    <span class="pro-lbl" id="proLbl">PRO</span>
  </label>
  <span id="liveCount">0 LIVE</span>
</nav>

<section class="hero">
  <div class="hero-blob"></div>
  <h1><span class="g">XL</span> Tool Library</h1>
  <div class="stats-row">
    <div class="stat-blk"><div class="stat-n c1" id="statLive">—</div><div class="stat-l">Live Tools</div></div>
    <div class="stat-blk"><div class="stat-n c2" id="statCats">—</div><div class="stat-l">Categories</div></div>
    <div class="stat-blk"><div class="stat-n c3">12</div><div class="stat-l">Pro Tools</div></div>
  </div>
  <button class="random-btn" onclick="goRandom()">&#9889; Random Tool</button>
</section>

<div class="cat-section">
  <div class="cat-section-hdr">
    <h2>Browse by Category</h2>
    <div class="cat-section-line"></div>
    <span style="font-size:10px;color:#475569;letter-spacing:.06em;white-space:nowrap;">drag &middot; throw &middot; click</span>
  </div>
</div>
<div id="physicsArena"></div>
<div id="catTooltip"></div>

<div id="toolGrid"></div>

<div class="power-bar-wrap">
  <div id="powerLbl">EXPLORATION_POWER: 0%</div>
  <div id="powerBar"><div id="powerFill"></div></div>
</div>
<div class="sep"></div>
<div id="statusWrap"></div>
<div style="height:80px"></div>

<div id="consoleWrap">
  <div id="cbar" onclick="toggleConsole()">
    <div class="cdot-anim"></div>
    <span>xlmx_sys > Script Console</span>
    <span style="margin-left:auto;font-size:10px">&#9650; MINIMIZE</span>
  </div>
  <div id="clog"></div>
</div>

<div id="cmdOverlay" onclick="closeCmd(event)">
  <div id="cmdBox">
    <input id="cmdInput" type="text" placeholder="Search tools or jump to category..." oninput="cmdSearch(this.value)" onkeydown="cmdKey(event)">
    <div id="cmdRes"></div>
    <div class="cmd-footer">
      <span><kbd>&#8617;</kbd> open</span>
      <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> navigate</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<script>
window.onerror=function(msg,src,line,col,err){var el=document.getElementById("toolGrid");if(el)el.innerHTML="<div style=\"padding:40px;color:#f87171;font-family:monospace;font-size:12px\">JS ERROR: "+msg+" (line "+line+")</div>";return false;};

  {n:'ADA Ramp Compliance',d:'Slope, width, landing, handrail, and edge protection checks',c:'Architecture',u:'/tools/accessibility-ramp/',s:'live'},
  {n:'Solar Shading',d:'Horizontal overhang depth to shade glazing by season and latitude',c:'Architecture',s:'live',u:'/tools/solar-shading/'},

﻿function renderCats(){
  var arena=document.getElementById('physicsArena');
  if(!arena){return;}
  arena.innerHTML='';
  _physBodies=[];_bubbleEls=[];_bubbleCats=[];
  if(_physEngine){try{Matter.Engine.clear(_physEngine);}catch(e){}}

  var W=arena.offsetWidth||window.innerWidth;
  var H=arena.offsetHeight||420;

  _physEngine=Matter.Engine.create({gravity:{x:0,y:0}});
  var world=_physEngine.world;

  var t=60;
  Matter.World.add(world,[
    Matter.Bodies.rectangle(W/2,-t/2,W+t*2,t,{isStatic:true,restitution:0.82,friction:0,frictionStatic:0,label:'wall'}),
    Matter.Bodies.rectangle(W/2,H+t/2,W+t*2,t,{isStatic:true,restitution:0.82,friction:0,frictionStatic:0,label:'wall'}),
    Matter.Bodies.rectangle(-t/2,H/2,t,H+t*2,{isStatic:true,restitution:0.82,friction:0,frictionStatic:0,label:'wall'}),
    Matter.Bodies.rectangle(W+t/2,H/2,t,H+t*2,{isStatic:true,restitution:0.82,friction:0,frictionStatic:0,label:'wall'})
  ]);

  var cats=['All'].concat(ALL_CATS);
  var validCats=cats.filter(function(c){
    return c==='All'||LIVE.filter(function(t){return t.c===c;}).length>0;
  });

  var _pad=_BR*1.6;
  var _cols=Math.max(3,Math.floor((W-_pad*2)/(_BR*2.5)));
  var _cellW=(W-_pad*2)/_cols;
  var _nRows=Math.ceil(validCats.length/_cols);
  var _cellH=Math.max(_BR*2.4,Math.min((H-_pad*2)/_nRows,_BR*3.4));

  validCats.forEach(function(cat,_gi){
    var _col=_gi%_cols;
    var _row=Math.floor(_gi/_cols);
    var x=_pad+_cellW*(_col+0.5);
    var y=_pad+_cellH*(_row+0.5);
    x=Math.max(_BR+4,Math.min(W-_BR-4,x));
    y=Math.max(_BR+4,Math.min(H-_BR-4,y));

    var body=Matter.Bodies.circle(x,y,_BR,{
      restitution:0.72,friction:0,frictionAir:0.010,frictionStatic:0,label:cat
    });
    Matter.Body.setVelocity(body,{x:(Math.random()-0.5)*0.4,y:(Math.random()-0.5)*0.4});
    Matter.World.add(world,body);
    _physBodies.push(body);
    _bubbleCats.push(cat);

    var col=cat==='All'?{tx:'#e2e8f0',ic:'∞',bg:'rgba(255,255,255,.06)',bd:'rgba(255,255,255,.2)'}:catColor(cat);
    var D=_BR*2;
    var cnt=cat==='All'?LIVE.length:LIVE.filter(function(t){return t.c===cat;}).length;
    var el=document.createElement('div');
    el.className='cat-bubble'+(cat===curCat?' is-active':'');
    el.style.cssText='width:'+D+'px;height:'+D+'px;background:'+(col.bg||'rgba(255,255,255,.06)')+';border-color:'+(col.bd||'rgba(255,255,255,.2)')+';color:'+(col.tx||'#e2e8f0')+';transform:translate('+(x-_BR)+'px,'+(y-_BR)+'px) scale(1);';
    el.innerHTML='<span class="bic">'+(col.ic||'\u25cb')+'</span>'
      +'<span class="bname">'+cat+'</span>'
      +'<span class="bcnt">'+cnt+'</span>';
    arena.appendChild(el);
    _bubbleEls.push(el);
  });

  // === The Meaning of Life — easter egg ===
  (function(){
    var _mx=W*0.68,_my=H*0.42;
    var _mb=Matter.Bodies.circle(_mx,_my,_BR,{
      restitution:0.94,friction:0,frictionAir:0.004,frictionStatic:0,label:'mol'
    });
    Matter.Body.setVelocity(_mb,{x:2.4,y:-2.1});
    Matter.World.add(world,_mb);
    _molIdx=_physBodies.length;
    _physBodies.push(_mb);
    _bubbleCats.push('The Meaning of Life');
    var _mel=document.createElement('div');
    _mel.className='cat-bubble';
    _mel.style.cssText='width:'+(_BR*2)+'px;height:'+(_BR*2)+'px;background:rgba(250,204,21,.10);border-color:rgba(250,204,21,.55);color:#facc15;box-shadow:0 0 18px rgba(250,204,21,.22);';
    _mel.innerHTML='<span class="bic">∞</span><span class="bname" style="font-size:5.5px;line-height:1.2;letter-spacing:0">The Meaning of Life</span><span class="bcnt">42</span>';
    arena.appendChild(_mel);
    _bubbleEls.push(_mel);
  })();

  Matter.Events.on(_physEngine,'collisionStart',function(ev){
    ev.pairs.forEach(function(pair){
      [pair.bodyA,pair.bodyB].forEach(function(b){
        var idx=_physBodies.indexOf(b);
        if(idx<0||idx===_dragIdx)return;
        if(_impactTmr[idx])clearTimeout(_impactTmr[idx]);
        _applyCol(idx,'impact');
        _impactTmr[idx]=setTimeout(function(){delete _impactTmr[idx];},420);
      });
    });
  });

  _arenaEl=arena;
  if(!_eventsAttached){
    document.addEventListener('mousedown',_onDown);
    document.addEventListener('mousemove',_onMove);
    document.addEventListener('mouseup',_onUp);
    _eventsAttached=true;
  }

  if(_rafId)cancelAnimationFrame(_rafId);
  var _lt=0;
  function _loop(ts){
    var dt=ts-_lt||16;_lt=ts;if(dt>80)dt=16;

    if(_dragIdx>=0&&_arenaEl){
      var _r=_arenaEl.getBoundingClientRect();
      var tx=_mX-_r.left,ty=_mY-_r.top;
      Matter.Body.setPosition(_physBodies[_dragIdx],{x:tx,y:ty});
      Matter.Body.setVelocity(_physBodies[_dragIdx],{x:_vX,y:_vY});
    }

    Matter.Engine.update(_physEngine,dt);

    if(_forceMode&&_activeCatIdx>=0&&_activeCatIdx<_physBodies.length){
      var _sb=_physBodies[_activeCatIdx];
      var _selCat=_bubbleCats[_activeCatIdx];
      _physBodies.forEach(function(b,i){
        if(i===_activeCatIdx||b.isStatic||_bubbleCats[i]==='All'||i===_molIdx)return;
        var _aff=catAffinity(_selCat,_bubbleCats[i]);
        var _fdx=_sb.position.x-b.position.x;
        var _fdy=_sb.position.y-b.position.y;
        var _fd=Math.sqrt(_fdx*_fdx+_fdy*_fdy)||1;
        var _fmag=(_aff-0.5)*0.0080;
        Matter.Body.applyForce(b,b.position,{x:(_fdx/_fd)*_fmag*b.mass,y:(_fdy/_fd)*_fmag*b.mass});

function renderStatus(){document.getElementById("statusWrap").innerHTML=STATUS.map(function(s){var ms=Math.floor(Math.random()*12+3);return "<div class='srow'><span class='sdot'></span><span class='sname'>"+s.n+"</span><span class='slat'>"+ms+"ms</span></div>";}).join("");}

function openCmd(){document.getElementById("cmdOverlay").classList.add("open");setTimeout(function(){document.getElementById("cmdInput").focus();},50);cmdSearch("");}
function closeCmd(e){if(!e||e.target===document.getElementById("cmdOverlay")){document.getElementById("cmdOverlay").classList.remove("open");document.getElementById("cmdInput").value="";}}
function cmdSearch(v){var q=v.toLowerCase().trim();var res=q?LIVE.filter(function(t){return t.n.toLowerCase().includes(q)||t.c.toLowerCase().includes(q)||t.d.toLowerCase().includes(q);}):LIVE.slice(0,12);cmdList=res;cmdSel=0;document.getElementById("cmdRes").innerHTML=res.slice(0,10).map(function(t,i){return "<div class='citem"+(i===0?" sel":"")+"' onclick='cmdGo("+singleQ(t.u)+")'>"+"<span class='citem-cat'>"+t.c+"</span>"+"<span class='citem-name'>"+t.n+"</span>"+"<span class='citem-hint'>Run &#8599;</span></div>";}).join("");}

function cmdKey(e){var items=document.querySelectorAll(".citem");if(e.key==="ArrowDown"){cmdSel=Math.min(cmdSel+1,items.length-1);}else if(e.key==="ArrowUp"){cmdSel=Math.max(cmdSel-1,0);}else if(e.key==="Enter"&&cmdList[cmdSel]){cmdGo(cmdList[cmdSel].u);return;}else if(e.key==="Escape"){closeCmd();return;}items.forEach(function(el,i){el.classList.toggle("sel",i===cmdSel);});}
function cmdGo(url){if(url&&url!=="#"){window.open(url,"_blank");closeCmd();}}
document.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();e.stopPropagation();if(document.getElementById("cmdOverlay").classList.contains("open")){closeCmd();}else{openCmd();}}if(e.key==="Escape"){closeCmd();}});
