<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floor Plan Scramble - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#facc15}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Floor Plan Scramble</h1><p class="sub">Leisure — Reassemble Scrambled Room Blocks</p><div class="card"><h3>Floor Plan Scramble</h3><p style="font-size:.85rem;color:var(--mu);margin-bottom:.75rem">Match each room to its correct location in the floor plan.</p><div id="fp"></div></div></div><script>const plans=[{name:'1BR Apartment',rooms:[{name:'Living',x:0,y:0,w:2,h:2,color:'#818cf8'},{name:'Kitchen',x:2,y:0,w:1,h:1,color:'#22d3ee'},{name:'Bath',x:2,y:1,w:1,h:1,color:'#f472b6'},{name:'Bedroom',x:0,y:2,w:2,h:1,color:'#c4b5fd'},{name:'Corridor',x:2,y:2,w:1,h:1,color:'#6b7280'}]},{name:'Office Layout',rooms:[{name:'Open Plan',x:0,y:0,w:3,h:2,color:'#34d399'},{name:'Conf Room',x:3,y:0,w:1,h:1,color:'#fb923c'},{name:'Break Room',x:3,y:1,w:1,h:1,color:'#fbbf24'},{name:'Reception',x:0,y:2,w:2,h:1,color:'#60a5fa'},{name:'Private Office',x:2,y:2,w:2,h:1,color:'#a855f7'}]}];let planIdx=0,selected=null,assignments={};function render(){const plan=plans[planIdx];const rooms=[...plan.rooms].sort(()=>Math.random()-0.5);let html=`<p style="font-weight:600;margin-bottom:.5rem">${plan.name}</p>`;html+='<div style="display:flex;gap:1rem;flex-wrap:wrap">';html+='<div><p style="font-size:.78rem;color:var(--mu);margin-bottom:.3rem">Grid (click to place)</p><div style="display:grid;grid-template-columns:repeat(4,52px);grid-template-rows:repeat(3,52px);gap:3px">';for(let y=0;y<3;y++){for(let x=0;x<4;x++){const key=x+','+y;const assigned=assignments[key];html+=`<div onclick="placeRoom('${key}')" style="width:52px;height:52px;background:${assigned?assigned.color+'33':'rgba(255,255,255,.04)'};border:1px solid ${assigned?assigned.color:'var(--bd)'};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.65rem;text-align:center;cursor:pointer;color:var(--tx)">${assigned?assigned.name:''}</div>`;}}html+='</div></div>';html+='<div><p style="font-size:.78rem;color:var(--mu);margin-bottom:.3rem">Rooms (click to select)</p><div style="display:flex;flex-direction:column;gap:.3rem">';rooms.forEach((r,i)=>{const placed=Object.values(assignments).some(a=>a.name===r.name);html+=`<div onclick="selectRoom(${i})" style="padding:.3rem .6rem;border-radius:5px;background:${r===selected?r.color:placed?r.color+'44':'rgba(255,255,255,.06)'};border:1px solid ${r===selected?r.color:'var(--bd)'};font-size:.8rem;cursor:pointer;opacity:${placed?'.5':'1'}">${r.name}</div>`;});html+='</div></div>';html+='</div>';const correct=plan.rooms.filter(r=>assignments[r.x+','+r.y]&&assignments[r.x+','+r.y].name===r.name).length;html+=`<p class="note" style="margin-top:.75rem">${correct} of ${plan.rooms.length} rooms correctly placed. ${correct===plan.rooms.length?'<span class="pass">Perfect!</span>':''}</p>`;if(correct===plan.rooms.length)html+='<button onclick="planIdx=(planIdx+1)%plans.length;assignments={};selected=null;render()" style="margin-top:.5rem">Next Plan</button>';document.getElementById('fp').innerHTML=html;}const roomsRef=plans[0].rooms;function selectRoom(i){const plan=plans[planIdx];const rooms=[...plan.rooms].sort(()=>0);selected=plan.rooms[i]||null;render();}function placeRoom(key){if(!selected)return;assignments[key]=selected;selected=null;render();}render();</script></body></html>
