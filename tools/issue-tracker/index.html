<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue Tracker - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Issue Tracker</h1><p class="sub">Project Management — Issues with Priority and Resolution</p><div class="card"><h3>Log Issue</h3><div class="g2"><div><label>Issue</label><input type="text" id="iss" placeholder="Structural drawings conflict with MEP"></div><div><label>Priority</label><select id="pri"><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select></div><div><label>Owner</label><input type="text" id="own" placeholder="Adair"></div><div><label>Due Date</label><input type="date" id="due"></div></div><button onclick="add()">Log Issue</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Issue Log</h3><div id="il"><p style="color:var(--mu);font-size:.85rem">No issues logged.</p></div></div></div><script>let issues=[];let id=1;function add(){issues.push({id:id++,iss:document.getElementById('iss').value||'Issue',pri:document.getElementById('pri').value,own:document.getElementById('own').value||'—',due:document.getElementById('due').value,open:true});render();}function clr(){issues=[];id=1;render();}function toggle(i){issues[i].open=!issues[i].open;render();}function render(){if(!issues.length){document.getElementById('il').innerHTML='<p style="color:var(--mu);font-size:.85rem">No issues logged.</p>';return;}const priColor={High:'fail',Medium:'warn',Low:'pass'};let h='<table class="tbl"><tr><th>#</th><th>Issue</th><th>Priority</th><th>Owner</th><th>Due</th><th>Status</th></tr>';issues.forEach((it,i)=>{h+=`<tr style="${!it.open?'opacity:.5':''}"><td>${it.id}</td><td>${it.iss}</td><td class="${priColor[it.pri]}">${it.pri}</td><td>${it.own}</td><td>${it.due||'—'}</td><td><button onclick="toggle(${i})" style="padding:.2rem .6rem;font-size:.75rem;background:${!it.open?'#22c55e':'rgba(255,255,255,.1)'};color:${!it.open?'#000':'var(--tx)'}">${it.open?'Open':'Closed'}</button></td></tr>`;});h+='</table>';document.getElementById('il').innerHTML=h;}</script></body></html>
