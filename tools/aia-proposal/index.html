<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIA Fee Proposal Builder - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#94a3b8}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>AIA Fee Proposal Builder</h1><p class="sub">Legal — Professional Services Fee Structure</p><div class="card"><h3>Project Info</h3><div class="g2"><div><label>Project</label><input type="text" id="pj" placeholder="Mixed-Use Development"></div><div><label>Construction Budget ($)</label><input type="number" id="cb" value="5000000"></div></div></div><div class="card"><h3>Phase Fees</h3><div id="phases"><div class="g3" style="margin-bottom:.5rem"><input placeholder="Phase" class="ph" value="Schematic Design"><input type="number" placeholder="%" class="pct" value="15"><input type="number" placeholder="Hours est." class="hrs" value="120"></div></div><button onclick="addPh()" style="background:rgba(255,255,255,.1);color:var(--tx)">+ Phase</button><button onclick="calc()" style="margin-left:.5rem">Build Proposal</button></div><div id="out"></div></div><script>function addPh(){const d=document.getElementById('phases');const r=document.createElement('div');r.className='g3';r.style.marginBottom='.5rem';r.innerHTML='<input placeholder="Phase" class="ph"><input type="number" placeholder="%" class="pct"><input type="number" placeholder="Hours est." class="hrs">';d.appendChild(r);}function calc(){const pj=document.getElementById('pj').value||'Project';const cb=+document.getElementById('cb').value||0;const phs=[...document.querySelectorAll('.ph')].map(i=>i.value);const pcts=[...document.querySelectorAll('.pct')].map(i=>+i.value||0);const hrss=[...document.querySelectorAll('.hrs')].map(i=>+i.value||0);const totalPct=pcts.reduce((a,b)=>a+b,0);let rows='';phs.forEach((ph,i)=>{const fee=cb*(pcts[i]/100);rows+=`<tr><td>${ph}</td><td>${pcts[i]}%</td><td>$${Math.round(fee).toLocaleString()}</td><td>${hrss[i]} hrs</td></tr>`;});const totalFee=cb*(totalPct/100);document.getElementById('out').innerHTML=`<div class="card"><h3>Fee Proposal — ${pj}</h3><p style="font-size:.85rem;color:var(--mu);margin-bottom:.75rem">Construction Budget: $${cb.toLocaleString()} | Total Fee: $${Math.round(totalFee).toLocaleString()} (${totalPct}%)</p><table class="tbl"><tr><th>Phase</th><th>% of Fee</th><th>Fee</th><th>Est. Hours</th></tr>${rows}</table><p class="note">Fee structure based on percentage of construction cost. Confirm with AIA B101 template.</p></div>`;}</script></body></html>
