<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean pH & Acidification — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#0ea5e9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Ocean pH & Acidification</h1>
  <p class="sub">Oceanography — pH, pCO₂, aragonite saturation calculator</p>
  <div class="card">
    <div class="grid2">
      <div>
        <label>SEA SURFACE pH</label>
        <input type="number" id="ph" value="8.10" step="0.01" min="7" max="9" oninput="calc()">
      </div>
      <div>
        <label>TEMPERATURE (°C)</label>
        <input type="number" id="T" value="20" step="0.5" oninput="calc()">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>ATMOSPHERIC CO₂ (ppm)</label>
        <input type="number" id="co2" value="420" oninput="calc()">
      </div>
      <div>
        <label>SALINITY (PSU)</label>
        <input type="number" id="S" value="35" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">[H⁺] CONCENTRATION</div>
        <div class="r-val" id="H">—</div>
        <div class="r-sub">nmol/kg</div>
      </div>
      <div class="result">
        <div class="r-label">pH CHANGE FROM 1750</div>
        <div class="r-val" id="dpH">—</div>
        <div class="r-sub">pre-industrial: 8.18</div>
      </div>
      <div class="result">
        <div class="r-label">ARAGONITE STATUS</div>
        <div class="r-val" id="arag" style="font-size:16px;">—</div>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function calc(){
  const ph=+document.getElementById('ph').value;
  const T=+document.getElementById('T').value;
  const co2=+document.getElementById('co2').value;
  const S=+document.getElementById('S').value;
  const H=(Math.pow(10,-ph)*1e9).toFixed(2);
  const dpH=(ph-8.18).toFixed(2);
  // Aragonite saturation state simplified: Ω_arag = [Ca2+][CO3 2-] / Ksp_arag
  // Approximate: Ω decreases ~0.5 per 0.1 pH unit drop from 2.5 baseline
  const dph_from_base=ph-8.18;
  const omega_arag=Math.max(0.1,2.5+dph_from_base*5).toFixed(2);
  const arag_status=omega_arag>=2?'Supersaturated ✓':omega_arag>=1?'At saturation ⚠':'Undersaturated ✗';
  document.getElementById('H').textContent=H;
  document.getElementById('dpH').textContent=(dpH>=0?'+':'')+dpH;
  document.getElementById('arag').textContent=arag_status.split(' ')[0];
  const effect=ph<8.0?'Severely acidified — reef dissolution likely':ph<8.05?'Acidified — coral calcification impaired':ph<8.1?'Moderately acidified':'Near pre-industrial level';
  document.getElementById('note').textContent=`Atmospheric CO₂: ${co2} ppm (pre-industrial: ~280 ppm). pH ${ph} → [H⁺] ${H} nmol/kg. Ocean has absorbed ~30% of anthropogenic CO₂ since 1750. Each 0.1 pH drop = 26% more acidic (logarithmic scale). ${effect}. Aragonite Ω≈${omega_arag} (reef building needs Ω>3.0).`;
}
calc();
</script>
</body>
</html>
