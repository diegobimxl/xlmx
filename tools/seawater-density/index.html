<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seawater Density Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#0ea5e9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Seawater Density Calculator</h1>
  <p class="sub">Oceanography — UNESCO EOS-80 simplified density from T, S, pressure</p>
  <div class="card">
    <div class="grid3">
      <div>
        <label>TEMPERATURE (°C)</label>
        <input type="number" id="T" value="20" step="0.5" oninput="calc()">
      </div>
      <div>
        <label>SALINITY (PSU / g/kg)</label>
        <input type="number" id="S" value="35" step="0.1" oninput="calc()">
      </div>
      <div>
        <label>PRESSURE (dbar)</label>
        <input type="number" id="P" value="0" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">DENSITY ρ</div>
        <div class="r-val" id="rho">—</div>
        <div class="r-sub">kg/m³</div>
      </div>
      <div class="result">
        <div class="r-label">SIGMA-T (σₜ)</div>
        <div class="r-val" id="sig">—</div>
        <div class="r-sub">ρ − 1000</div>
      </div>
      <div class="result">
        <div class="r-label">SOUND SPEED</div>
        <div class="r-val" id="ss">—</div>
        <div class="r-sub">m/s</div>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function calc(){
  const T=+document.getElementById('T').value;
  const S=+document.getElementById('S').value;
  const P=+document.getElementById('P').value;
  // UNESCO EOS-80 simplified (Millero & Poisson 1981 truncated)
  const rho0=999.842594+6.793952e-2*T-9.095290e-3*T*T+1.001685e-4*T**3-1.120083e-6*T**4+6.536332e-9*T**5;
  const A=8.24493e-1-4.0899e-3*T+7.6438e-5*T*T-8.2467e-7*T**3+5.3875e-9*T**4;
  const B=-5.72466e-3+1.0227e-4*T-1.6546e-6*T*T;
  const C=4.8314e-4;
  const rhoST=rho0+A*S+B*S**1.5+C*S*S;
  // Pressure correction (simplified)
  const kw=19652.21+148.4206*T-2.327105*T*T+1.360477e-2*T**3-5.155288e-5*T**4;
  const k=kw+(3.239908+1.43713e-3*T+1.16092e-4*T*T-5.77905e-7*T**3)*S+(8.50935e-5-6.12293e-6*T+5.2787e-8*T*T)*S**1.5;
  const rho=rhoST/(1-P/(k+P));
  // Sound speed (Medwin 1975 simplified)
  const ss=1449.2+4.6*T-0.055*T*T+0.00029*T**3+(1.34-0.010*T)*(S-35)+0.016*P;
  document.getElementById('rho').textContent=rho.toFixed(3);
  document.getElementById('sig').textContent=(rho-1000).toFixed(3);
  document.getElementById('ss').textContent=ss.toFixed(1);
  const regime=T<4?'Cold/Dense':T<10?'Sub-polar':T<20?'Temperate':'Tropical/Warm';
  document.getElementById('note').textContent=`${regime} water. T=${T}°C, S=${S} PSU, P=${P} dbar. Average ocean: ρ≈1025 kg/m³, S≈35 PSU, T≈3.5°C. Thermohaline circulation is driven by density gradients. Sound speed ${ss.toFixed(1)} m/s (cf. fresh water ~1480 m/s at 20°C).`;
}
calc();
</script>
</body>
</html>
