<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Working Days Calculator — XLMX</title>
<style>
:root{--bg:#070b0f;--sf:rgba(255,255,255,.03);--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);--tx:#e2e8f0;--mu:#8892a4;--gold:#c8a96e;--gold2:rgba(200,169,110,.15);--red:#ef4444;--grn:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
nav{position:sticky;top:0;z-index:100;background:rgba(7,11,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 28px;height:52px;}
.logo{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--gold);font-family:"JetBrains Mono",monospace;}
.logo span{color:var(--mu);font-weight:400;}
.back{color:var(--mu);font-size:12px;text-decoration:none;margin-left:auto;display:flex;align-items:center;gap:6px;transition:color .15s;}
.back:hover{color:var(--tx);}
.wrap{max-width:820px;margin:0 auto;padding:40px 28px 100px;position:relative;z-index:1;}
h1{font-size:26px;font-weight:800;letter-spacing:-.025em;margin-bottom:6px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:32px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:22px 24px;margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase;margin-bottom:6px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd2);border-radius:8px;padding:10px 14px;color:var(--tx);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,169,110,.1);}
select option{background:#0f1419;}
.btn{background:linear-gradient(135deg,rgba(200,169,110,.15),rgba(200,169,110,.08));border:1px solid rgba(200,169,110,.3);color:var(--gold);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.04em;transition:all .2s;}
.btn:hover{border-color:var(--gold);box-shadow:0 0 16px rgba(200,169,110,.15);}
.btn-sm{padding:6px 14px;font-size:11px;}
.btn-ghost{background:transparent;border:1px solid var(--bd2);color:var(--mu);}
.btn-ghost:hover{border-color:var(--bd2);color:var(--tx);box-shadow:none;}
.btn-danger{border-color:rgba(239,68,68,.3);color:var(--red);background:rgba(239,68,68,.06);}
.btn-danger:hover{border-color:var(--red);box-shadow:none;}
.results{display:none;}
.results.show{display:block;}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.res-item{background:rgba(200,169,110,.06);border:1px solid rgba(200,169,110,.18);border-radius:8px;padding:14px 16px;}
.res-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase;margin-bottom:4px;}
.res-val{font-size:18px;font-weight:800;color:var(--gold);font-family:"JetBrains Mono",monospace;line-height:1.2;}
.res-note{font-size:11px;color:var(--mu);margin-top:3px;}
.res-neg .res-val{color:var(--red);}
.info{background:rgba(255,255,255,.025);border:1px solid var(--bd);border-radius:8px;padding:13px 16px;font-size:12px;color:var(--mu);line-height:1.7;}
.info b{color:var(--tx);font-weight:600;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(255,255,255,.02);}
.tbl .hi{color:var(--gold);font-weight:700;font-family:"JetBrains Mono",monospace;}
.tbl .mu{color:var(--mu);}
.tbl input{padding:6px 10px;font-size:12px;min-width:80px;}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin-bottom:10px;}
.add-row{display:flex;align-items:center;gap:8px;padding:10px 0 4px;}
.chip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;transition:all .15s;border:1px solid var(--bd2);background:var(--sf);color:var(--mu);}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip.r{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--red);}
.chip.a{background:rgba(200,169,110,.15);border-color:rgba(200,169,110,.3);color:var(--gold);}
.chip.c{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:var(--grn);}
.chip.i{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.3);color:#a78bfa;}
.chip.active-r{background:rgba(239,68,68,.25);border-color:var(--red);color:var(--red);}
.chip.active-a{background:rgba(200,169,110,.3);border-color:var(--gold);color:var(--gold);}
.chip.active-c{background:rgba(34,197,94,.2);border-color:var(--grn);color:var(--grn);}
.chip.active-i{background:rgba(167,139,250,.2);border-color:#a78bfa;color:#a78bfa;}
</style>
</head>
<body>
<nav><span class="logo">XLMX <span>/ UTILITY LIBRARY</span></span><a class="back" href="/">&#8592; All Tools</a></nav>
<div class="wrap">
<h1>Working Days Calculator</h1>
<p class="sub">Count working days between dates or find the date after N working days. Add custom holidays.</p>
<div class="card">
  <p class="sec-lbl" style="margin-bottom:14px;">Calculate Working Days Between Two Dates</p>
  <div class="row2">
    <div class="field"><label>Start Date</label><input id="d1" type="date" oninput="calcBetween()"></div>
    <div class="field"><label>End Date</label><input id="d2" type="date" oninput="calcBetween()"></div>
  </div>
</div>
<div class="results" id="res1">
  <div class="card">
    <div class="res-grid" id="r1Grid"></div>
  </div>
</div>
<div class="card" style="margin-top:4px;">
  <p class="sec-lbl" style="margin-bottom:14px;">Find Date After N Working Days</p>
  <div class="row2">
    <div class="field"><label>Start Date</label><input id="d3" type="date" oninput="calcForward()"></div>
    <div class="field"><label>Working Days to Add</label><input id="nDays" type="number" step="1" value="14" oninput="calcForward()"></div>
  </div>
</div>
<div class="results" id="res2">
  <div class="card">
    <div class="res-grid" id="r2Grid"></div>
  </div>
</div>
<div class="card" style="margin-top:4px;">
  <p class="sec-lbl" style="margin-bottom:10px;">Exclude Holidays (optional)</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
    <div style="flex:1;min-width:140px;"><label>Add Holiday</label><input id="holDate" type="date"></div>
    <div style="flex:1;min-width:160px;"><label>Label</label><input id="holLabel" type="text" placeholder="e.g. Thanksgiving"></div>
    <button class="btn btn-sm" onclick="addHol()">+ Add</button>
  </div>
  <div id="holList" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;"></div>
</div>
<script>
var holidays={};
function isWeekend(d){var day=d.getDay();return day===0||day===6;}
function isHoliday(d){return!!holidays[d.toISOString().slice(0,10)];}
function isWorkday(d){return!isWeekend(d)&&!isHoliday(d);}
function countWorkdays(d1,d2){
  var count=0,cur=new Date(d1);
  while(cur<=d2){if(isWorkday(cur))count++;cur.setDate(cur.getDate()+1);}
  return count;
}
function addWorkdays(start,n){
  var cur=new Date(start);var count=0;
  if(n<0){while(count>n){cur.setDate(cur.getDate()-1);if(isWorkday(cur))count--;}return cur;}
  while(count<n){cur.setDate(cur.getDate()+1);if(isWorkday(cur))count++;}
  return cur;
}
function fmtDate(d){return d.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});}
function res(l,v,n){return'<div class="res-item"><div class="res-lbl">'+l+'</div><div class="res-val">'+v+'</div>'+(n?'<div class="res-note">'+n+'</div>':'')+'</div>';}
function calcBetween(){
  var d1=document.getElementById('d1').value;
  var d2=document.getElementById('d2').value;
  if(!d1||!d2){document.getElementById('res1').classList.remove('show');return;}
  var start=new Date(d1+'T12:00:00'),end=new Date(d2+'T12:00:00');
  if(end<start){document.getElementById('res1').classList.remove('show');return;}
  var cal=Math.round((end-start)/86400000)+1;
  var work=countWorkdays(start,end);
  var weeks=(work/5).toFixed(1);
  document.getElementById('r1Grid').innerHTML=
    res('Calendar Days',cal,'including both endpoints')+
    res('Working Days',work,'Mon–Fri, excl. holidays')+
    res('Full Weeks',weeks,'working weeks')+
    res('Weekend Days',cal-work,'');
  document.getElementById('res1').classList.add('show');
}
function calcForward(){
  var d3=document.getElementById('d3').value;
  var n=parseInt(document.getElementById('nDays').value)||0;
  if(!d3||!n){document.getElementById('res2').classList.remove('show');return;}
  var start=new Date(d3+'T12:00:00');
  var result=addWorkdays(start,n);
  document.getElementById('r2Grid').innerHTML=
    res('Target Date',fmtDate(result),n+' working days from start')+
    res('Calendar Days',Math.round((result-start)/86400000),'approx. '+Math.ceil(n/5)+' weeks');
  document.getElementById('res2').classList.add('show');
}
function addHol(){
  var d=document.getElementById('holDate').value;
  var l=document.getElementById('holLabel').value||d;
  if(!d)return;
  holidays[d]=l;
  renderHols();
  document.getElementById('holDate').value='';
  document.getElementById('holLabel').value='';
  calcBetween();calcForward();
}
function removeHol(d){delete holidays[d];renderHols();calcBetween();calcForward();}
function renderHols(){
  var hl=document.getElementById('holList');
  hl.innerHTML=Object.keys(holidays).sort().map(function(d){
    return'<span style="background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--mu);display:inline-flex;align-items:center;gap:6px;">'+d+' '+holidays[d]+'<span style="cursor:pointer;color:var(--red);" onclick="removeHol(\''+d+'\')">&#10005;</span></span>';
  }).join('');
}
// default today
var today=new Date().toISOString().slice(0,10);
document.getElementById('d3').value=today;
</script>
</div>
</body>
</html>
