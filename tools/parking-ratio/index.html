<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking Ratio Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e5e5e5;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:24px 16px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.sub{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:600;color:#8b5cf6;margin-bottom:14px}
label{display:block;font-size:.8rem;color:#aaa;margin-bottom:4px;margin-top:10px}
input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e5e5e5;padding:8px 10px;font-size:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#1a1a1a;border-radius:8px;padding:12px;text-align:center}
.stat .v{font-size:1.2rem;font-weight:700;color:#8b5cf6}
.stat .l{font-size:.75rem;color:#888;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th{text-align:left;color:#888;padding:6px 8px;border-bottom:1px solid #222}
td{padding:6px 8px;border-bottom:1px solid #1a1a1a}
.ok{color:#22c55e}.warn{color:#eab308}.bad{color:#ef4444}
.bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.use-row{background:#1a1a1a;border-radius:8px;padding:12px;margin-bottom:8px}
.use-row .hdr{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
.note{background:#1a1a1a;border-radius:8px;padding:12px;font-size:.82rem;color:#aaa;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<h1>Parking Ratio Calculator</h1>
<p class="sub">ITE-based parking demand, stall counts, and land efficiency</p>

<div class="card">
  <h2>Land Use Mix</h2>
  <div id="useList"></div>
  <button onclick="addUse()" style="background:#1a1a1a;border:1px solid #8b5cf6;color:#8b5cf6;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85rem;margin-top:4px">+ Add Use</button>
</div>

<div class="card">
  <h2>Parking Configuration</h2>
  <div class="row2">
    <div>
      <label>Stall size (SF)</label>
      <select id="stallSize" onchange="calc()">
        <option value="300">300 SF — Compact</option>
        <option value="330" selected>330 SF — Standard</option>
        <option value="360">360 SF — Large/Accessible</option>
      </select>
    </div>
    <div>
      <label>Structure type</label>
      <select id="structType" onchange="calc()">
        <option value="1.0">Surface lot (1:1)</option>
        <option value="3.5" selected>Structured garage (3.5 floors avg)</option>
        <option value="0.6">Underground (efficiency 0.6)</option>
      </select>
    </div>
  </div>
  <div class="row2">
    <div><label>ADA required % (min 2%)</label><input type="number" id="adaPct" value="4" min="2" max="20" oninput="calc()"></div>
    <div><label>EV charging % of stalls</label><input type="number" id="evPct" value="10" min="0" max="100" oninput="calc()"></div>
  </div>
  <label>Context / Location</label>
  <select id="context" onchange="calc()">
    <option value="1.0">Suburban (no transit)</option>
    <option value="0.85" selected>Urban (some transit)</option>
    <option value="0.7">TOD / Dense urban</option>
    <option value="0.5">CBD / High transit</option>
  </select>
</div>

<div class="card">
  <h2>Results</h2>
  <div class="row3">
    <div class="stat"><div class="v" id="r_stalls">--</div><div class="l">Total stalls</div></div>
    <div class="stat"><div class="v" id="r_area">--</div><div class="l">Parking SF</div></div>
    <div class="stat"><div class="v" id="r_ratio">--</div><div class="l">Overall ratio</div></div>
  </div>
  <div class="row3" style="margin-top:8px">
    <div class="stat"><div class="v" id="r_ada">--</div><div class="l">ADA stalls</div></div>
    <div class="stat"><div class="v" id="r_ev">--</div><div class="l">EV stalls</div></div>
    <div class="stat"><div class="v" id="r_rev">--</div><div class="l">Revenue stalls</div></div>
  </div>
  <table style="margin-top:16px" id="useTable">
    <tr><th>Use</th><th>Units</th><th>Code req.</th><th>ITE demand</th><th>Context adj.</th><th>Status</th></tr>
  </table>
  <div class="note" id="note"></div>
</div>

<script>
const USES_DEF={
  'Residential (units)':    {ite:1.2,code:1.5,unit:'units'},
  'Office (1000 SF)':       {ite:2.8,code:4.0,unit:'KSF'},
  'Retail (1000 SF)':       {ite:3.8,code:5.0,unit:'KSF'},
  'Restaurant (seats)':     {ite:0.5,code:0.7,unit:'seats'},
  'Hotel (rooms)':          {ite:0.9,code:1.0,unit:'rooms'},
  'Industrial (1000 SF)':   {ite:0.8,code:1.0,unit:'KSF'},
  'Medical Office (1000 SF)':{ite:4.0,code:5.0,unit:'KSF'},
  'School (students)':      {ite:0.3,code:0.5,unit:'students'},
};
let uses=[];let uid=0;
function addUse(type='Office (1000 SF)',qty=50){
  uses.push({id:uid++,type,qty});render();
}
function removeUse(id){uses=uses.filter(u=>u.id!==id);render();}
function render(){
  let html='';
  uses.forEach(u=>{
    const opts=Object.keys(USES_DEF).map(k=>`<option ${k===u.type?'selected':''} value="${k}">${k}</option>`).join('');
    html+=`<div class="use-row">
      <div class="hdr">
        <select style="flex:1;margin-right:8px" onchange="updateUse(${u.id},'type',this.value)">${opts}</select>
        <button onclick="removeUse(${u.id})" style="background:none;border:1px solid #333;color:#888;border-radius:4px;padding:4px 8px;cursor:pointer">✕</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" value="${u.qty}" min="0" style="width:100px" oninput="updateUse(${u.id},'qty',this.value)">
        <span style="font-size:.78rem;color:#888">${USES_DEF[u.type].unit}</span>
      </div>
    </div>`;
  });
  document.getElementById('useList').innerHTML=html;
  calc();
}
function updateUse(id,field,val){
  const u=uses.find(u=>u.id===id);
  if(u)u[field]=field==='qty'?parseFloat(val)||0:val;
  calc();
}
function calc(){
  const stall=parseInt(document.getElementById('stallSize').value)||330;
  const ctx=parseFloat(document.getElementById('context').value)||1.0;
  const adaPct=parseFloat(document.getElementById('adaPct').value)/100||0.04;
  const evPct=parseFloat(document.getElementById('evPct').value)/100||0.1;
  let totalITE=0,totalCode=0;
  let rows='<tr><th>Use</th><th>Units</th><th>Code req.</th><th>ITE demand</th><th>Context adj.</th><th>Status</th></tr>';
  uses.forEach(u=>{
    const def=USES_DEF[u.type];
    if(!def)return;
    const ite=def.ite*u.qty;
    const code=def.code*u.qty;
    const adj=ite*ctx;
    totalITE+=ite;totalCode+=code;
    const ok=adj>=code*0.5;
    rows+=`<tr>
      <td>${u.type}</td><td>${u.qty} ${def.unit}</td>
      <td>${code.toFixed(0)}</td><td>${ite.toFixed(0)}</td>
      <td>${adj.toFixed(0)}</td>
      <td class="${ok?'ok':'warn'}">${ok?'✓':'⚠ Low'}</td>
    </tr>`;
  });
  document.getElementById('useTable').innerHTML=rows;
  const totalStalls=Math.ceil(totalITE*ctx);
  const ada=Math.ceil(totalStalls*adaPct);
  const ev=Math.ceil(totalStalls*evPct);
  const area=totalStalls*stall;
  const totalQty=uses.reduce((a,u)=>a+u.qty,0);
  const ratio=totalQty>0?(totalStalls/totalQty).toFixed(2):'-';

  document.getElementById('r_stalls').textContent=totalStalls.toLocaleString();
  document.getElementById('r_area').textContent=(area/1000).toFixed(0)+'K SF';
  document.getElementById('r_ratio').textContent=ratio+' /unit';
  document.getElementById('r_ada').textContent=ada;
  document.getElementById('r_ev').textContent=ev;
  document.getElementById('r_rev').textContent=(totalStalls-ada).toLocaleString();
  document.getElementById('note').innerHTML=
    `Code required: <strong>${Math.ceil(totalCode)} stalls</strong>. ITE demand: <strong>${Math.ceil(totalITE)} stalls</strong>. Context factor: ${ctx}×. `+
    `Selected: <strong>${totalStalls} stalls</strong>. `+
    `${totalStalls<Math.ceil(totalCode)?'<span style="color:#ef4444">⚠ Below code minimum — variance or shared parking agreement needed.</span>':'<span style="color:#22c55e">✓ Meets code requirement.</span>'}`;
}
addUse('Office (1000 SF)',50);
addUse('Residential (units)',100);
</script>
</body>
</html>
