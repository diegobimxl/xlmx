<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Contrast Checker - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Color Contrast Checker</h1><p class="sub">Design — WCAG AA/AAA Contrast Ratio Checker</p><div class="card"><h3>Colors</h3><div class="g2"><div><label>Foreground</label><input type="color" id="fg" value="#e2e8f0" style="height:44px;padding:.25rem"></div><div><label>Background</label><input type="color" id="bg" value="#030307" style="height:44px;padding:.25rem"></div></div><button onclick="check()">Check Contrast</button></div><div id="out"></div></div><script>function hexToRgb(h){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:null;}function sRGB(c){const s=c/255;return s<=0.03928?s/12.92:Math.pow((s+0.055)/1.055,2.4);}function lum(c){const r=hexToRgb(c);if(!r)return 0;return 0.2126*sRGB(r.r)+0.7152*sRGB(r.g)+0.0722*sRGB(r.b);}function check(){const fg=document.getElementById('fg').value;const bg=document.getElementById('bg').value;const l1=lum(fg),l2=lum(bg);const ratio=(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);const r=ratio.toFixed(2);const aaLarge=ratio>=3;const aaNormal=ratio>=4.5;const aaaSm=ratio>=7;document.getElementById('out').innerHTML=`<div class="card"><h3>Result</h3><div style="background:${bg};color:${fg};padding:1.5rem;border-radius:8px;margin-bottom:1rem;text-align:center"><p style="font-size:1.5rem;font-weight:700;color:inherit">Sample Text</p><p style="font-size:.88rem;color:inherit">Normal body text sample</p></div><div class="g3"><div class="res"><div class="rl">Ratio</div><div class="rv">${r}:1</div></div><div class="res"><div class="rl">AA Normal (4.5)</div><div class="rv ${aaNormal?'pass':'fail'}">${aaNormal?'PASS':'FAIL'}</div></div><div class="res"><div class="rl">AAA Normal (7)</div><div class="rv ${aaaSm?'pass':'fail'}">${aaaSm?'PASS':'FAIL'}</div></div></div></div>`;}</script></body></html>
