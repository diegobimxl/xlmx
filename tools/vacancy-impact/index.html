<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vacancy Impact Calculator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#c8a96e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Vacancy Impact Calculator</h1><p class="sub">Real Estate & Development — NOI and Value Sensitivity</p><div class="card"><h3>Property</h3><div class="g2"><div><label>Gross Potential Rent ($/yr)</label><input type="number" id="gpr" value="500000"></div><div><label>Operating Expenses ($/yr)</label><input type="number" id="opex" value="120000"></div><div><label>Current Vacancy (%)</label><input type="number" id="v1" value="5"></div><div><label>Scenario Vacancy (%)</label><input type="number" id="v2" value="15"></div><div><label>Cap Rate (%)</label><input type="number" id="cap" value="6" step="0.25"></div></div><button onclick="calc()">Model Impact</button></div><div class="card"><h3>NOI and Value Impact</h3><div id="vr"></div></div></div><script>function fmt(n){return'$'+Math.round(n).toLocaleString();}function calc(){const gpr=+document.getElementById('gpr').value;const opex=+document.getElementById('opex').value;const v1=+document.getElementById('v1').value/100;const v2=+document.getElementById('v2').value/100;const cap=+document.getElementById('cap').value/100;const n1=gpr*(1-v1)-opex;const n2=gpr*(1-v2)-opex;const val1=cap?n1/cap:0;const val2=cap?n2/cap:0;document.getElementById('vr').innerHTML=`<table class="tbl"><tr><th>Metric</th><th>Current (${(v1*100).toFixed(0)}%)</th><th>Scenario (${(v2*100).toFixed(0)}%)</th><th>Delta</th></tr><tr><td>EGI</td><td>${fmt(gpr*(1-v1))}</td><td>${fmt(gpr*(1-v2))}</td><td class="${v2<=v1?'pass':'fail'}">${fmt(gpr*(1-v2)-gpr*(1-v1))}</td></tr><tr><td>NOI</td><td>${fmt(n1)}</td><td>${fmt(n2)}</td><td class="${n2>=n1?'pass':'fail'}">${fmt(n2-n1)}</td></tr><tr><td>Value</td><td>${fmt(val1)}</td><td>${fmt(val2)}</td><td class="${val2>=val1?'pass':'fail'}">${fmt(val2-val1)}</td></tr></table>`;}</script></body></html>
