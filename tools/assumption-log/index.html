<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assumption Log - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#9ca3af}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Assumption Log</h1><p class="sub">General Productivity — Track Assumptions and Validation</p><div class="card"><h3>Add Assumption</h3><div class="g2"><div><label>Assumption</label><input type="text" id="ass" placeholder="Owner will provide survey by week 3"></div><div><label>Owner</label><input type="text" id="own" placeholder="PM"></div><div><label>Category</label><select id="cat"><option>Schedule</option><option>Cost</option><option>Scope</option><option>Technical</option><option>Contract</option></select></div><div><label>Validation Status</label><select id="val"><option value="open">Open</option><option value="confirmed">Confirmed</option><option value="invalid">Invalid</option></select></div></div><button onclick="add()">Add</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Assumption Log</h3><div id="al"><p style="color:var(--mu);font-size:.85rem">No assumptions logged yet.</p></div></div></div><script>let items=[];function add(){items.push({ass:document.getElementById('ass').value||'Assumption',own:document.getElementById('own').value||'—',cat:document.getElementById('cat').value,val:document.getElementById('val').value});render();}function clr(){items=[];render();}const vc={open:'warn',confirmed:'pass',invalid:'fail'};const vl={open:'Open',confirmed:'Confirmed',invalid:'Invalid'};function render(){if(!items.length){document.getElementById('al').innerHTML='<p style="color:var(--mu);font-size:.85rem">No assumptions logged yet.</p>';return;}let h='<table class="tbl"><tr><th>Assumption</th><th>Category</th><th>Owner</th><th>Status</th></tr>';items.forEach((it,i)=>{h+=`<tr><td>${it.ass}</td><td style="font-size:.82rem;color:var(--mu)">${it.cat}</td><td style="font-size:.82rem">${it.own}</td><td><span class="${vc[it.val]}">${vl[it.val]}</span></td></tr>`;});h+='</table>';document.getElementById('al').innerHTML=h;}</script></body></html>
