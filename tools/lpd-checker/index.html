<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPD Compliance Checker — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>LPD Compliance Checker</h1><p class="sub">Engineering — Compare installed LPD against ASHRAE 90.1 allowances</p>
<div class="card">
  <div class="g2">
    <div>
      <label>SPACE TYPE</label>
      <select id="space" onchange="calc()">
        <option value="office">Office (open plan)</option><option value="officeenc">Office (enclosed)</option>
        <option value="conf">Conference / Meeting Room</option><option value="corridor">Corridor / Transition</option>
        <option value="lobby">Lobby / Reception</option><option value="retail">Retail</option>
        <option value="restroom">Restroom</option><option value="parking">Parking Garage</option>
        <option value="storage">Storage</option><option value="stair">Stairwell</option>
      </select>
    </div>
    <div><label>FLOOR AREA (m²)</label><input type="number" id="area" value="500" oninput="calc()"></div>
  </div>
  <label>INSTALLED LUMINAIRE WATTAGE (total W)</label>
  <input type="number" id="watts" value="2500" oninput="calc()">
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">INSTALLED LPD</div><div class="rv" id="inst">—</div><div class="rs">W/m²</div></div>
    <div class="res"><div class="rl">ALLOWED LPD</div><div class="rv" id="allowed">—</div><div class="rs">W/m² (ASHRAE 90.1)</div></div>
    <div class="res"><div class="rl">COMPLIANCE</div><div class="rv" id="status" style="font-size:16px;">—</div></div>
  </div>
  <div class="g2" style="margin-top:12px;">
    <div class="res"><div class="rl">HEADROOM / MARGIN</div><div class="rv" id="margin">—</div><div class="rs">W/m²</div></div>
    <div class="res"><div class="rl">MAX ALLOWED WATTS</div><div class="rv" id="maxw">—</div><div class="rs">total</div></div>
  </div>
  <div class="note" id="note"></div>
</div>
</div><script>// ASHRAE 90.1-2022 LPD in W/m² (converted from W/ft² × 10.764)
const LPD={office:8.07,officeenc:8.61,conf:12.92,corridor:4.84,lobby:15.07,retail:17.22,restroom:8.61,parking:1.52,storage:3.23,stair:4.84};
function calc(){
  const space=document.getElementById('space').value;
  const area=+document.getElementById('area').value;
  const watts=+document.getElementById('watts').value;
  const allowed=LPD[space];
  const inst=(watts/area).toFixed(2);
  const maxw=(allowed*area).toFixed(0);
  const margin=(allowed-parseFloat(inst)).toFixed(2);
  const pass=parseFloat(inst)<=allowed;
  document.getElementById('inst').textContent=inst;
  document.getElementById('allowed').textContent=allowed.toFixed(2);
  document.getElementById('status').textContent=pass?'Compliant ✓':'Exceeds ✗';
  document.getElementById('status').style.color=pass?'var(--acc)':'#f87171';
  document.getElementById('margin').textContent=(margin>=0?'+':'')+margin;
  document.getElementById('maxw').textContent=maxw;
  document.getElementById('note').textContent=`ASHRAE 90.1-2022 space-by-space method. ${document.getElementById('space').options[document.getElementById('space').selectedIndex].text}: ${allowed.toFixed(2)} W/m² max. Installed: ${inst} W/m² (${watts}W ÷ ${area}m²). Max allowed: ${maxw}W. ${pass?'Compliant — '+margin+' W/m² margin.':'Exceeds by '+(−margin)+' W/m² — reduce wattage by '+(watts-parseFloat(maxw)).toFixed(0)+'W.'}`;
}
calc();</script></body></html>
