<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Status Report Generator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Weekly Status Report Generator</h1><p class="sub">Project Management — Structured Status from Key Metrics</p><div class="card"><h3>Project Info</h3><div class="g2"><div><label>Project Name</label><input type="text" id="proj" placeholder="EOMA Mixed-Use"></div><div><label>Report Week</label><input type="date" id="wk"></div></div></div><div class="card"><h3>Status Inputs</h3><div class="g2"><div><label>% Schedule Complete</label><input type="number" id="sched" value="45"></div><div><label>% Budget Spent</label><input type="number" id="bdg" value="42"></div><div><label>Open RFIs</label><input type="number" id="rfi" value="8"></div><div><label>Open Issues</label><input type="number" id="iss" value="3"></div></div><label>Accomplishments this week</label><textarea id="acc" placeholder="- Completed Level 3 BIM coordination&#10;- Issued SD drawings for review"></textarea><label>Planned next week</label><textarea id="plan" placeholder="- Start MEP coordination&#10;- RFI responses due"></textarea><label>Risks / Blockers</label><textarea id="risk" placeholder="- Structural drawings delayed"></textarea><button onclick="gen()">Generate Report</button></div><div id="out"></div></div><script>function gen(){const proj=document.getElementById('proj').value||'Project';const wk=document.getElementById('wk').value||'This week';const sched=+document.getElementById('sched').value;const bdg=+document.getElementById('bdg').value;const rfi=+document.getElementById('rfi').value;const iss=+document.getElementById('iss').value;const acc=document.getElementById('acc').value||'None reported.';const plan=document.getElementById('plan').value||'None reported.';const risk=document.getElementById('risk').value||'No major risks.';const diff=sched-bdg;const schedCls=sched>=bdg?'pass':'warn';const items=txt=>txt.split('
').filter(Boolean).map(l=>`<li style="margin-bottom:.25rem">${l.replace(/^-\s*/,'')}</li>`).join('');document.getElementById('out').innerHTML=`<div class="card"><h3>Weekly Status — ${proj}</h3><p style="font-size:.82rem;color:var(--mu);margin-bottom:.75rem">Week of ${wk}</p><div class="g4"><div class="res"><div class="rl">Schedule</div><div class="rv ${schedCls}">${sched}%</div></div><div class="res"><div class="rl">Budget Spent</div><div class="rv">${bdg}%</div></div><div class="res"><div class="rl">Open RFIs</div><div class="rv ${rfi>10?'warn':'pass'}">${rfi}</div></div><div class="res"><div class="rl">Open Issues</div><div class="rv ${iss>5?'warn':'pass'}">${iss}</div></div></div><p style="font-size:.8rem;color:var(--mu);margin:.75rem 0 .3rem;text-transform:uppercase">Accomplishments</p><ul style="padding-left:1.2rem;font-size:.88rem">${items(acc)}</ul><p style="font-size:.8rem;color:var(--mu);margin:.75rem 0 .3rem;text-transform:uppercase">Next Week</p><ul style="padding-left:1.2rem;font-size:.88rem">${items(plan)}</ul><p style="font-size:.8rem;color:var(--mu);margin:.75rem 0 .3rem;text-transform:uppercase">Risks</p><ul style="padding-left:1.2rem;font-size:.88rem">${items(risk)}</ul></div>`;}</script></body></html>
