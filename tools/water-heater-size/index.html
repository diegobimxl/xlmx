<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Heater Sizing Tool — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Water Heater Sizing Tool</h1><p class="sub">Engineering — Size domestic hot water by occupancy and peak demand</p>
<div class="card">
  <div class="g2">
    <div>
      <label>BUILDING TYPE</label>
      <select id="btype" onchange="setDefaults()">
        <option value="office">Office</option><option value="hotel">Hotel</option>
        <option value="restaurant">Restaurant</option><option value="school">School</option>
        <option value="hospital">Hospital</option><option value="apartment">Multifamily</option>
      </select>
    </div>
    <div><label>NUMBER OF OCCUPANTS / UNITS</label><input type="number" id="occ" value="200" oninput="calc()"></div>
  </div>
  <div class="g3">
    <div><label>INLET TEMP (°F)</label><input type="number" id="Tcold" value="55" oninput="calc()"></div>
    <div><label>STORAGE TEMP (°F)</label><input type="number" id="Thot" value="140" oninput="calc()"></div>
    <div><label>DELIVERY TEMP (°F)</label><input type="number" id="Tdeliv" value="120" oninput="calc()"></div>
  </div>
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">PEAK DEMAND</div><div class="rv" id="peak">—</div><div class="rs">gal/hr</div></div>
    <div class="res"><div class="rl">STORAGE VOLUME</div><div class="rv" id="storage">—</div><div class="rs">gallons</div></div>
    <div class="res"><div class="rl">RECOVERY RATE</div><div class="rv" id="recovery">—</div><div class="rs">gal/hr</div></div>
  </div>
  <div class="g2" style="margin-top:12px;">
    <div class="res"><div class="rl">INPUT BTU/HR</div><div class="rv" id="btu">—</div></div>
    <div class="res"><div class="rl">kW EQUIV.</div><div class="rv" id="kw">—</div></div>
  </div>
  <div class="note" id="note"></div>
</div>
</div><script>// gal/person/hour peak demand, plus storage as % of daily
const TYPES={
  office:{gpd:1.0,peak_hr:0.5,note:'ASHRAE PHWA, office typical'},
  hotel:{gpd:30,peak_hr:0.3,note:'Guest room 30 gpd, peak 30% in 1hr'},
  restaurant:{gpd:3.5,peak_hr:0.7,note:'3.5 gal per meal served (ASPE)'},
  school:{gpd:1.5,peak_hr:0.5,note:'ASHRAE PHWA, educational'},
  hospital:{gpd:25,peak_hr:0.4,note:'Inpatient 25 gpd ASPE'},
  apartment:{gpd:35,peak_hr:0.3,note:'Multifamily 35 gpd/unit'},
};
function setDefaults(){
  const t=TYPES[document.getElementById('btype').value];
  calc();
}
function calc(){
  const bt=document.getElementById('btype').value;
  const occ=+document.getElementById('occ').value;
  const Tc=+document.getElementById('Tcold').value;
  const Th=+document.getElementById('Thot').value;
  const Td=+document.getElementById('Tdeliv').value;
  const t=TYPES[bt];
  const dailyGal=t.gpd*occ;
  const peakGal=(dailyGal*t.peak_hr).toFixed(0);
  const storage=(dailyGal*0.5).toFixed(0); // 50% of daily in storage
  const deltaT=Th-Tc;
  const btu=Math.round(+storage*8.33*deltaT/1); // BTU to heat storage volume once
  const recovBTU=Math.round(+peakGal*8.33*(Td-Tc));
  const kw=(recovBTU/3412).toFixed(1);
  document.getElementById('peak').textContent=peakGal;
  document.getElementById('storage').textContent=storage;
  document.getElementById('recovery').textContent=peakGal;
  document.getElementById('btu').textContent=recovBTU.toLocaleString();
  document.getElementById('kw').textContent=kw;
  document.getElementById('note').textContent=`${t.note}. ${occ} occupants × ${t.gpd} gpd = ${dailyGal.toLocaleString()} gpd daily. Peak demand ${peakGal} gal/hr. Storage: ${storage} gal. Recovery input: ${recovBTU.toLocaleString()} BTU/hr (${kw} kW). ASSE 1069/ASSE 1017 thermostatic mixing valve required at delivery.`;
}
calc();</script></body></html>
