<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Contact Directory - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#9ca3af}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Project Contact Directory</h1><p class="sub">General Productivity — Role, Phone, and Email by Project</p><div class="card"><h3>Add Contact</h3><div class="g2"><div><label>Name</label><input type="text" id="cn" placeholder="Monica Reyna"></div><div><label>Role</label><input type="text" id="cr" placeholder="Project Manager"></div><div><label>Company</label><input type="text" id="cc" placeholder="U-Calli"></div><div><label>Phone</label><input type="tel" id="cp" placeholder="+52 81 1234 5678"></div><div><label>Email</label><input type="email" id="ce" placeholder="monica@ucalli.mx"></div><div><label>Discipline</label><select id="cd"><option>Owner</option><option>Architect</option><option>BIM</option><option>Structural</option><option>MEP</option><option>Contractor</option><option>Legal</option><option>Other</option></select></div></div><button onclick="add()">Add Contact</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Directory</h3><div id="dir"><p style="color:var(--mu);font-size:.85rem">No contacts added yet.</p></div></div></div><script>let contacts=[];function add(){contacts.push({n:document.getElementById('cn').value||'Contact',r:document.getElementById('cr').value||'—',c:document.getElementById('cc').value||'—',p:document.getElementById('cp').value||'—',e:document.getElementById('ce').value||'—',d:document.getElementById('cd').value});render();}function clr(){contacts=[];render();}function render(){if(!contacts.length){document.getElementById('dir').innerHTML='<p style="color:var(--mu);font-size:.85rem">No contacts added yet.</p>';return;}let h='<table class="tbl"><tr><th>Name</th><th>Role</th><th>Co.</th><th>Phone</th><th>Email</th><th>Disc.</th></tr>';contacts.sort((a,b)=>a.d.localeCompare(b.d)).forEach(c=>{h+=`<tr><td><b>${c.n}</b></td><td style="font-size:.82rem">${c.r}</td><td style="font-size:.82rem">${c.c}</td><td style="font-size:.82rem">${c.p}</td><td style="font-size:.82rem">${c.e}</td><td style="font-size:.78rem;color:var(--mu)">${c.d}</td></tr>`;});h+='</table>';document.getElementById('dir').innerHTML=h;}</script></body></html>
