<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scope of Work Generator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#94a3b8}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Scope of Work Generator</h1><p class="sub">Legal — Draft SOW from Project Description</p><div class="card"><h3>Project Details</h3><div class="g2"><div><label>Client Name</label><input type="text" id="cl" placeholder="U-Calli SA de CV"></div><div><label>Project Name</label><input type="text" id="pj" placeholder="Miravalle Tower 2"></div><div><label>Service Type</label><select id="svc"><option>BIM Production</option><option>Development Management</option><option>VDC Coordination</option><option>Project Management</option><option>Architecture</option></select></div><div><label>Deliverable Date</label><input type="date" id="dd"></div></div><label>Deliverables (one per line)</label><textarea id="del" placeholder="LOD 300 Revit model&#10;Coordination issue log&#10;Monthly BIM report"></textarea><label>Exclusions (one per line)</label><textarea id="exc" placeholder="Structural engineering calculations&#10;Site surveys"></textarea><button onclick="gen()">Generate SOW</button></div><div id="out"></div></div><script>function gen(){const cl=document.getElementById('cl').value||'Client';const pj=document.getElementById('pj').value||'Project';const svc=document.getElementById('svc').value;const dd=document.getElementById('dd').value||'TBD';const dels=document.getElementById('del').value.split('
').filter(Boolean);const excs=document.getElementById('exc').value.split('
').filter(Boolean);const delItems=dels.map(d=>`<li style="margin-bottom:.25rem">${d}</li>`).join('');const excItems=excs.map(e=>`<li style="margin-bottom:.25rem">${e}</li>`).join('');document.getElementById('out').innerHTML=`<div class="card"><h3>Scope of Work</h3><p style="font-size:.9rem;margin-bottom:.75rem"><b>${svc} Services</b><br>Client: ${cl} | Project: ${pj}</p><p style="font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem">1. Scope of Services</p><p style="font-size:.88rem;margin-bottom:.75rem">Provider shall deliver ${svc.toLowerCase()} services for the ${pj} project as described herein.</p><p style="font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem">2. Deliverables</p><ul style="padding-left:1.2rem;font-size:.88rem;margin-bottom:.75rem">${delItems||'<li>To be defined</li>'}</ul><p style="font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem">3. Exclusions</p><ul style="padding-left:1.2rem;font-size:.88rem;margin-bottom:.75rem">${excItems||'<li>None stated</li>'}</ul><p style="font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem">4. Schedule</p><p style="font-size:.88rem">Target completion: ${dd}. Timeline subject to timely client input and approvals.</p><p class="note">Review with legal counsel before execution. This is a draft framework only.</p></div>`;}</script></body></html>
