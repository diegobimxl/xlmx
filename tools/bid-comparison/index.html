<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bid Comparison | XLMX</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100vh}.topbar{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px}.topbar a{color:#c8a96e;text-decoration:none;font-size:14px}.topbar h1{font-size:16px;font-weight:600;color:#fff}.container{max-width:1100px;margin:0 auto;padding:24px 16px}.subtitle{color:#888;font-size:13px;margin-bottom:20px}.ctrl-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.ctrl-bar input{background:#1a1a1a;border:1px solid #333;border-radius:4px;padding:7px 10px;color:#e8e8e8;font-size:13px;flex:1;min-width:120px}.ctrl-bar input:focus{outline:none;border-color:#c8a96e}.btn{background:#c8a96e;color:#0d0d0d;border:none;border-radius:4px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}.btn-s{background:transparent;color:#c8a96e;border:1px solid #c8a96e;border-radius:4px;padding:7px 14px;font-size:12px;cursor:pointer}.wrap{overflow-x:auto}table.bid{border-collapse:collapse;font-size:12px;width:100%;min-width:600px}table.bid th{background:#1a1a1a;color:#aaa;padding:8px 10px;text-align:left;border-bottom:1px solid #333;white-space:nowrap}table.bid td{padding:7px 10px;border-bottom:1px solid #1e1e1e;vertical-align:top}table.bid input{background:#0d0d0d;border:1px solid #222;border-radius:3px;padding:4px 6px;color:#e8e8e8;font-size:11px;width:100%}.low{background:#0d2010;color:#5bc97d;font-weight:700}.high{background:#200808;color:#e07b54}.total-row td{background:#1a1a1a;font-weight:600;color:#c8a96e;padding:10px}.card{background:#111;border:1px solid #222;border-radius:8px;padding:20px;margin-bottom:16px}.card h2{font-size:14px;font-weight:600;color:#c8a96e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}.ref{font-size:11px;color:#555;margin-top:8px;font-style:italic}</style></head><body><div class="topbar"><a href="/tools/">&#8592; Tools</a><h1>Bid Comparison & Leveling</h1></div><div class="container"><p class="subtitle">Bid tabulation matrix — compare up to 5 bidders across CSI divisions, highlight low bid, flag omissions, export to CSV</p><div class="card"><h2>Setup</h2><div class="ctrl-bar"><input id="proj_name" type="text" placeholder="Project Name" value="Sample Bid Leveling"><button class="btn" onclick="addRow()">+ Add Scope Item</button><button class="btn-s" onclick="exportCSV()">Export CSV</button><button class="btn-s" onclick="resetTable()">Reset</button></div><div class="ctrl-bar" id="bidder_names"><input id="b0" type="text" placeholder="Bidder 1" value="ABC Construction"><input id="b1" type="text" placeholder="Bidder 2" value="XYZ Builders"><input id="b2" type="text" placeholder="Bidder 3" value="MNO Contractors"><input id="b3" type="text" placeholder="Bidder 4" value="PQR Corp"><input id="b4" type="text" placeholder="Bidder 5"></div></div><div class="card"><h2>Bid Tabulation</h2><div class="wrap"><table class="bid" id="bid_table"><thead id="bid_head"></thead><tbody id="bid_body"></tbody><tfoot id="bid_foot"></tfoot></table></div><p class="ref">Green = low bid per scope. Red = high bid. Blank = no quote / excluded. Totals exclude blanks in per-bidder sum.</p></div></div><script>var SCOPES=["Division 02 - Earthwork","Division 03 - Concrete","Division 04 - Masonry","Division 05 - Metals / Structural Steel","Division 06 - Wood & Plastics","Division 07 - Thermal & Moisture","Division 08 - Openings","Division 09 - Finishes","Division 10 - Specialties","Division 21 - Fire Suppression","Division 22 - Plumbing","Division 23 - HVAC","Division 26 - Electrical","Division 31 - Earthwork","Division 32 - Exterior Improvements","General Conditions","Overhead & Profit","Alternates / Allowances"];var ROWS=[...SCOPES];function getBidders(){return [0,1,2,3,4].map(i=>document.getElementById("b"+i).value||("Bidder "+(i+1)));}function renderTable(){var bs=getBidders();document.getElementById("bid_head").innerHTML='<tr><th>#</th><th>Scope Item / Division</th>'+bs.map(b=>'<th>'+b+'</th>').join("")+"</tr>";var rows=ROWS.map(function(scope,ri){var cells=bs.map(function(b,bi){return '<td><input type="number" id="c_'+ri+"_"+bi+'" placeholder="--" min="0" step="100" onchange="refreshTotals()"></td>';}).join("");return '<tr><td style="color:#555">'+( ri+1)+'</td><td><input type="text" id="s_'+ri+'" value="'+scope+'" style="background:#0d0d0d;border:1px solid #222;border-radius:3px;padding:4px;color:#e8e8e8;font-size:11px;width:100%"></td>'+cells+"</tr>";}).join("");document.getElementById("bid_body").innerHTML=rows;refreshTotals();}function refreshTotals(){var bs=getBidders();var totals=bs.map(()=>0);var counts=bs.map(()=>0);ROWS.forEach(function(s,ri){var rowVals=bs.map(function(b,bi){var el=document.getElementById("c_"+ri+"_"+bi);return el&&el.value?+el.value:null;});var valid=rowVals.filter(v=>v!==null);if(valid.length===0) return;var minV=Math.min(...valid),maxV=Math.max(...valid);rowVals.forEach(function(v,bi){var el=document.getElementById("c_"+ri+"_"+bi);if(!el) return;var td=el.parentElement;td.className=v===null?"":v===minV&&valid.length>1?"low":v===maxV&&valid.length>1?"high":"";if(v!==null){totals[bi]+=v;counts[bi]++;}});});var tfoot='<tr class="total-row"><td></td><td>TOTAL BID</td>'+totals.map(function(t,i){return '<td>'+(counts[i]>0?"$"+t.toLocaleString():"-")+'</td>';}).join("")+"</tr>";document.getElementById("bid_foot").innerHTML=tfoot;}function addRow(){ROWS.push("Custom Scope Item "+( ROWS.length+1));renderTable();}function resetTable(){ROWS=[...SCOPES];renderTable();}function exportCSV(){var bs=getBidders();var proj=document.getElementById("proj_name").value||"BidComp";var lines=["Scope Item,"+bs.join(",")];ROWS.forEach(function(s,ri){var scope=document.getElementById("s_"+ri)?document.getElementById("s_"+ri).value:s;var vals=bs.map(function(b,bi){var el=document.getElementById("c_"+ri+"_"+bi);return el&&el.value?el.value:"";});lines.push('"'+scope+'",'+vals.join(","));});var blob=new Blob([lines.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=proj.replace(/\s+/g,"-")+"-bid-comp.csv";a.click();}window.onload=renderTable;<\/script><\/body><\/html>
