<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punch List Manager - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Punch List Manager</h1><p class="sub">Project Management — Closeout Items by Area and Trade</p><div class="card"><h3>Add Item</h3><div class="g2"><div><label>Item Description</label><input type="text" id="desc" placeholder="Touch-up paint at stair 2"></div><div><label>Area / Location</label><input type="text" id="area" placeholder="Level 3 North"></div><div><label>Trade</label><input type="text" id="trade" placeholder="Paint"></div><div><label>Assignee</label><input type="text" id="own" placeholder="Sub name"></div></div><button onclick="add()">Add Item</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Punch List</h3><div class="g3" style="margin-bottom:.75rem"><div class="res"><div class="rl">Open</div><div class="rv pass" id="op">0</div></div><div class="res"><div class="rl">Complete</div><div class="rv" id="co">0</div></div><div class="res"><div class="rl">Total</div><div class="rv" id="tot">0</div></div></div><div id="list"><p style="color:var(--mu);font-size:.85rem">No items yet.</p></div></div></div><script>let items=[];function add(){items.push({desc:document.getElementById('desc').value||'Item',area:document.getElementById('area').value||'—',trade:document.getElementById('trade').value||'—',own:document.getElementById('own').value||'—',done:false});render();}function clr(){items=[];render();}function toggle(i){items[i].done=!items[i].done;render();}function render(){const open=items.filter(i=>!i.done).length;document.getElementById('op').textContent=open;document.getElementById('co').textContent=items.length-open;document.getElementById('tot').textContent=items.length;if(!items.length){document.getElementById('list').innerHTML='<p style="color:var(--mu);font-size:.85rem">No items yet.</p>';return;}let h='<table class="tbl"><tr><th>Item</th><th>Area</th><th>Trade</th><th>Assignee</th><th>Status</th></tr>';items.forEach((it,i)=>{h+=`<tr style="${it.done?'opacity:.5':''}"><td>${it.desc}</td><td>${it.area}</td><td>${it.trade}</td><td>${it.own}</td><td><button onclick="toggle(${i})" style="padding:.2rem .6rem;font-size:.75rem;background:${it.done?'#22c55e':'rgba(255,255,255,.1)'};color:${it.done?'#000':'var(--tx)'}">${it.done?'Done':'Open'}</button></td></tr>`;});h+='</table>';document.getElementById('list').innerHTML=h;}</script></body></html>
