<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction Schedule Compressor - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#fb923c}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Construction Schedule Compressor</h1><p class="sub">Construction — Critical Path and Fast-Tracking</p><div class="card"><h3>Phase Schedule</h3><div id="phases"><div class="g3" style="margin-bottom:.5rem"><input placeholder="Phase name" class="pn"><input type="number" placeholder="Duration (days)" class="pd"><select class="pp"><option value="">No predecessor</option></select></div></div><button onclick="addRow()" style="background:rgba(255,255,255,.1);color:var(--tx)">+ Add Phase</button><button onclick="calc()" style="margin-left:.5rem">Analyze</button></div><div class="card"><h3>Analysis</h3><div id="res"><p style="color:var(--mu);font-size:.85rem">Add phases and analyze to see compression opportunities.</p></div></div></div><script>function addRow(){const ph=document.getElementById('phases');const sel=document.querySelector('.pp');const opts=sel?sel.innerHTML:'<option value="">No predecessor</option>';const row=document.createElement('div');row.className='g3';row.style.marginBottom='.5rem';row.innerHTML='<input placeholder="Phase name" class="pn"><input type="number" placeholder="Duration (days)" class="pd"><select class="pp">'+opts+'</select>';ph.appendChild(row);updateSelects();}function updateSelects(){const names=[...document.querySelectorAll('.pn')].map(i=>i.value).filter(Boolean);document.querySelectorAll('.pp').forEach((s,idx)=>{const cur=s.value;s.innerHTML='<option value="">No predecessor</option>'+names.map((n,i)=>i<idx?`<option value="${n}"${cur===n?' selected':''}>${n}</option>`:'').join('');});}document.querySelectorAll('.pn').forEach(i=>i.addEventListener('input',updateSelects));function calc(){const rows=[...document.getElementById('phases').children];const phases=rows.map(r=>({name:r.querySelector('.pn').value||'Phase',dur:+r.querySelector('.pd').value||0,pred:r.querySelector('.pp').value}));let html='<table class="tbl"><tr><th>Phase</th><th>Duration</th><th>Predecessor</th><th>Fast-Track Potential</th></tr>';let total=0;phases.forEach(p=>{total+=p.dur;const ft=p.pred?'Overlap start by 20-30%':'Critical — no float';html+=`<tr><td>${p.name}</td><td>${p.dur}d</td><td>${p.pred||'—'}</td><td class="warn">${ft}</td></tr>`;});html+=`</table><p class="note">Total baseline: ${total} days. Fast-tracking overlapping phases could reduce schedule 15-25%.</p>`;document.getElementById('res').innerHTML=html;}</script></body></html>
