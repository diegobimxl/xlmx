<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermal Expansion Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Thermal Expansion Calculator</h1>
  <p class="sub">Materials Science — Linear and volumetric expansion under temperature change</p>
  <div class="card">
    <label>MATERIAL</label>
    <select id="mat" onchange="calc()">
      <option value="custom">Custom (enter α below)</option>
      <option value="steel">Steel (11.7 µm/m·K)</option>
      <option value="aluminum">Aluminum (23.1 µm/m·K)</option>
      <option value="copper">Copper (17.0 µm/m·K)</option>
      <option value="concrete">Concrete (12.0 µm/m·K)</option>
      <option value="glass">Glass (8.5 µm/m·K)</option>
      <option value="pvc">PVC (52.0 µm/m·K)</option>
      <option value="invar">Invar (1.2 µm/m·K)</option>
      <option value="timber">Timber (5.0 µm/m·K)</option>
    </select>
    <label>THERMAL EXPANSION COEFF α (µm/m·K)</label>
    <input type="number" id="alpha" value="11.7" step="0.1" oninput="calc()">
    <div class="grid2">
      <div>
        <label>INITIAL LENGTH / DIMENSION (m)</label>
        <input type="number" id="L0" value="10" step="0.01" oninput="calc()">
      </div>
      <div>
        <label>TEMPERATURE CHANGE ΔT (°C or K)</label>
        <input type="number" id="dT" value="50" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">LINEAR EXPANSION ΔL</div>
        <div class="r-val" id="dL">—</div>
        <div class="r-sub">mm</div>
      </div>
      <div class="result">
        <div class="r-label">FINAL LENGTH</div>
        <div class="r-val" id="Lf">—</div>
        <div class="r-sub">m</div>
      </div>
      <div class="result">
        <div class="r-label">VOLUMETRIC EXPANSION</div>
        <div class="r-val" id="dV">—</div>
        <div class="r-sub">≈ 3α·ΔT·V₀</div>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const ALPHAS={steel:11.7,aluminum:23.1,copper:17.0,concrete:12.0,glass:8.5,pvc:52.0,invar:1.2,timber:5.0,custom:null};
document.getElementById('mat').addEventListener('change',function(){
  const v=ALPHAS[this.value];
  if(v!==null)document.getElementById('alpha').value=v;
  calc();
});
function calc(){
  const a=+document.getElementById('alpha').value*1e-6;
  const L0=+document.getElementById('L0').value;
  const dT=+document.getElementById('dT').value;
  const dL=a*L0*dT;
  const Lf=L0+dL;
  const dVpct=(3*a*dT*100).toFixed(4);
  document.getElementById('dL').textContent=(dL*1000).toFixed(4);
  document.getElementById('Lf').textContent=Lf.toFixed(6);
  document.getElementById('dV').textContent=dVpct+'%';
  const mat=document.getElementById('mat').options[document.getElementById('mat').selectedIndex].text.split(' ')[0];
  document.getElementById('note').textContent=`ΔL = α·L₀·ΔT = ${(a*1e6).toFixed(1)}×10⁻⁶ × ${L0} × ${dT} = ${(dL*1000).toFixed(3)} mm over ${L0} m. For structural joints, add expansion gap ≥ ΔL × 1.5 safety factor = ${(dL*1000*1.5).toFixed(2)} mm.`;
}
calc();
</script>
</body>
</html>
