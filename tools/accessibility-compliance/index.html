<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility Compliance Checklist - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#ef4444}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Accessibility Compliance Checklist</h1><p class="sub">Code Compliance — ADA and IBC Requirements</p><div class="card"><h3>Compliance Review</h3><div id="acc"></div></div></div><script>const checks=[['Entrances','At least one accessible entrance on accessible route'],['Entrances','Entrance door minimum 32" clear width (36" preferred)'],['Entrances','Threshold max 1/2" (1/4" preferred), beveled if over 1/4"'],['Ramps','Ramp slope max 1:12 (8.33%)'],['Ramps','Ramp width min 36" clear'],['Ramps','Landings at top and bottom min 60" x 60"'],['Ramps','Handrails both sides for ramps with rise > 6"'],['Stairs','Stair nosings compliant — non-projecting, contrasting'],['Stairs','Handrails continuous on both sides'],['Restrooms','At least one accessible restroom per floor'],['Restrooms','Accessible stall min 60" wide x 56" deep (60"x60" preferred)'],['Restrooms','Grab bars on side and rear walls of accessible stall'],['Restrooms','Lavatory knee clearance 27" high x 19" deep'],['Parking','Accessible spaces: 1 per 25 up to 100 total'],['Parking','Van accessible space min 11 ft wide with 8 ft access aisle'],['Parking','Accessible spaces closest to accessible entrance'],['Signage','Braille and tactile signage at permanent rooms'],['Signage','Room ID signs mounted 60" AFF to centerline'],['Counters','Service counter max 36" AFF (34" preferred)'],['Elevators','Elevator required if building 3+ stories or > 3000 SF/floor']];let chk={};function render(){const cats=[...new Set(checks.map(c=>c[0]))];let h='';cats.forEach(cat=>{h+=`<p style="font-size:.8rem;text-transform:uppercase;color:var(--acc);margin:.6rem 0 .3rem">${cat}</p>`;checks.filter(c=>c[0]===cat).forEach(c=>{const k=c[1];const v=chk[k]||'none';h+=`<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid var(--bd)"><span style="flex:1;font-size:.86rem;${v==='ok'?'opacity:.5;text-decoration:line-through':''}">${c[1]}</span><button onclick="mark('${k.replace(/'/g,"\\'")}','ok')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='ok'?'#22c55e':'rgba(255,255,255,.08)'};color:${v==='ok'?'#000':'var(--tx)'};margin-top:0">OK</button><button onclick="mark('${k.replace(/'/g,"\\'")}','na')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='na'?'#6b7280':'rgba(255,255,255,.08)'};color:var(--tx);margin-top:0">N/A</button><button onclick="mark('${k.replace(/'/g,"\\'")}','fail')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='fail'?'#ef4444':'rgba(255,255,255,.08)'};color:${v==='fail'?'#fff':'var(--tx)'};margin-top:0">Fail</button></div>`;});});const ok=Object.values(chk).filter(v=>v==='ok').length;const fails=Object.values(chk).filter(v=>v==='fail').length;h+=`<p class="note">${ok} compliant, ${fails} non-compliant of ${checks.length} items reviewed</p>`;document.getElementById('acc').innerHTML=h;}function mark(k,v){chk[k]=chk[k]===v?'none':v;render();}render();</script></body></html>
