<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind Load Reference - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#818cf8}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Wind Load Reference</h1><p class="sub">Calculators — ASCE 7 Simplified Wind Pressure</p><div class="card"><h3>Parameters</h3><div class="g2"><div><label>Basic Wind Speed V (mph)</label><input type="number" id="V" value="115"></div><div><label>Exposure Category</label><select id="exp"><option value="1.0">B — Suburban</option><option value="1.21" selected>C — Open terrain</option><option value="1.47">D — Coastal</option></select></div><div><label>Building Height (ft)</label><input type="number" id="H" value="40"></div><div><label>Importance Factor I</label><select id="I"><option value="0.87">0.87 — Low hazard</option><option value="1.0" selected>1.0 — Standard</option><option value="1.15">1.15 — Substantial hazard</option><option value="1.15">1.15 — Essential</option></select></div></div><button onclick="calc()">Calculate</button></div><div class="card"><h3>Wind Pressures</h3><div class="g3"><div class="res"><div class="rl">Velocity Pressure qz (psf)</div><div class="rv" id="qz">-</div></div><div class="res"><div class="rl">Wall Pressure (psf)</div><div class="rv" id="wp">-</div></div><div class="res"><div class="rl">Roof Pressure (psf)</div><div class="rv" id="rp">-</div></div></div><p class="note">Simplified ASCE 7-16 Method. Use full analysis for structural design.</p></div></div><script>function calc(){const V=+document.getElementById('V').value;const Kz=+document.getElementById('exp').value;const H=+document.getElementById('H').value;const I=+document.getElementById('I').value;const Kd=0.85;const qz=0.00256*Kz*Kd*V*V*I;const wallP=qz*0.8+qz*0.5;const roofP=qz*0.7;document.getElementById('qz').textContent=qz.toFixed(2)+' psf';document.getElementById('wp').textContent=wallP.toFixed(2)+' psf';document.getElementById('rp').textContent=roofP.toFixed(2)+' psf';}</script></body></html>
