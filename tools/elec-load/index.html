<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrical Load Calculator — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Electrical Load Calculator</h1><p class="sub">Engineering — Estimate connected and demand load by use and area</p>
<div class="card">
  <div class="g2">
    <div><label>FLOOR AREA (m²)</label><input type="number" id="area" value="2000" oninput="calc()"></div>
    <div>
      <label>OCCUPANCY TYPE</label>
      <select id="use" onchange="calc()">
        <option value="office">Office</option><option value="retail">Retail</option>
        <option value="restaurant">Restaurant</option><option value="school">School</option>
        <option value="hotel">Hotel</option><option value="hospital">Hospital</option>
      </select>
    </div>
  </div>
  <div class="g2">
    <div><label>LIGHTING LOAD (W/m²)</label><input type="number" id="lpd" value="10" step="0.5" oninput="calc()"></div>
    <div><label>RECEPTACLE / PLUG LOAD (W/m²)</label><input type="number" id="plug" value="15" step="0.5" oninput="calc()"></div>
  </div>
  <div class="g2">
    <div><label>HVAC DEMAND FACTOR (%)</label><input type="number" id="hvac-df" value="80" oninput="calc()"></div>
    <div><label>BUILDING VOLTAGE (V)</label><select id="volt" onchange="calc()"><option value="480">480V 3-phase</option><option value="208" selected>208V 3-phase</option><option value="240">240V single-phase</option></select></div>
  </div>
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">CONNECTED LOAD</div><div class="rv" id="conn">—</div><div class="rs">kVA</div></div>
    <div class="res"><div class="rl">DEMAND LOAD</div><div class="rv" id="demand">—</div><div class="rs">kVA</div></div>
    <div class="res"><div class="rl">SERVICE AMPS</div><div class="rv" id="amps">—</div><div class="rs">A (3-phase)</div></div>
  </div>
  <div id="breakdown" style="margin-top:12px;"></div>
  <div class="note" id="note"></div>
</div>
</div><script>// kVA/m² HVAC baseline by use type
const HVAC={office:0.08,retail:0.12,restaurant:0.25,school:0.09,hotel:0.10,hospital:0.16};
// NEC demand factors for lighting
const LDF={office:0.75,retail:0.75,restaurant:0.75,school:0.75,hotel:0.75,hospital:0.75};
function calc(){
  const area=+document.getElementById('area').value;
  const use=document.getElementById('use').value;
  const lpd=+document.getElementById('lpd').value;
  const plug=+document.getElementById('plug').value;
  const hvacDF=+document.getElementById('hvac-df').value/100;
  const volt=+document.getElementById('volt').value;
  const hvacBase=HVAC[use]*area;
  const light=lpd*area/1000; // kW
  const plugLoad=plug*area/1000;
  const hvacLoad=hvacBase*hvacDF;
  const conn=(light+plugLoad+hvacBase)*1.1; // 10% misc
  const demand=(light*LDF[use]+plugLoad*0.5+hvacLoad)*1.1;
  // Service amps: kVA / (V × √3)
  const amps=(demand*1000/(volt*1.732)).toFixed(0);
  document.getElementById('conn').textContent=conn.toFixed(1);
  document.getElementById('demand').textContent=demand.toFixed(1);
  document.getElementById('amps').textContent=amps;
  document.getElementById('breakdown').innerHTML=`<table class="tbl">
    <tr><th>SYSTEM</th><th style="text-align:right;">CONNECTED (kVA)</th><th style="text-align:right;">DEMAND FACTOR</th><th style="text-align:right;">DEMAND (kVA)</th></tr>
    <tr><td>Lighting</td><td style="text-align:right;">${light.toFixed(1)}</td><td style="text-align:right;">${(LDF[use]*100).toFixed(0)}%</td><td style="text-align:right;">${(light*LDF[use]).toFixed(1)}</td></tr>
    <tr><td>Receptacles / Plug</td><td style="text-align:right;">${plugLoad.toFixed(1)}</td><td style="text-align:right;">50%</td><td style="text-align:right;">${(plugLoad*0.5).toFixed(1)}</td></tr>
    <tr><td>HVAC</td><td style="text-align:right;">${hvacBase.toFixed(1)}</td><td style="text-align:right;">${(hvacDF*100).toFixed(0)}%</td><td style="text-align:right;">${hvacLoad.toFixed(1)}</td></tr>
    </table>`;
  document.getElementById('note').textContent=`Connected: ${conn.toFixed(1)} kVA. Demand: ${demand.toFixed(1)} kVA. Service: ${amps}A at ${volt}V 3-phase. Add 25% spare capacity for future loads. NEC 220 demand factors applied. Verify with electrical engineer — this is a preliminary estimate only.`;
}
calc();</script></body></html>
