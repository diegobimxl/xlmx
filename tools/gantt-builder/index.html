<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milestone Gantt Builder - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Milestone Gantt Builder</h1><p class="sub">Project Management — Visual Timeline with Phase Bars</p><div class="card"><h3>Add Milestone</h3><div class="g2"><div><label>Phase Name</label><input type="text" id="pn" placeholder="Schematic Design"></div><div><label>Duration (weeks)</label><input type="number" id="dur" value="4" min="1"></div></div><button onclick="add()">Add Phase</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button><button onclick="render()" style="margin-left:.5rem">Draw Gantt</button></div><div class="card"><h3>Gantt Chart</h3><div id="gantt"><p style="color:var(--mu);font-size:.85rem">Add phases to generate Gantt.</p></div></div></div><script>let phases=[];function add(){phases.push({n:document.getElementById('pn').value||'Phase',d:+document.getElementById('dur').value||1});render();}function clr(){phases=[];document.getElementById('gantt').innerHTML='<p style="color:var(--mu);font-size:.85rem">Add phases to generate Gantt.</p>';}function render(){if(!phases.length)return;const total=phases.reduce((a,p)=>a+p.d,0);const colors=['#a855f7','#818cf8','#22d3ee','#c4b5fd','#f472b6','#fb923c','#22c55e','#fbbf24'];let h='<div style="font-size:.8rem">';let start=0;phases.forEach((p,i)=>{const pct=(p.d/total*100).toFixed(1);h+=`<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem"><div style="width:140px;font-size:.82rem;text-align:right;color:var(--mu);flex-shrink:0">${p.n}</div><div style="flex:1;background:rgba(255,255,255,.06);border-radius:4px;height:22px;position:relative"><div style="position:absolute;left:${(start/total*100).toFixed(1)}%;width:${pct}%;background:${colors[i%colors.length]};height:100%;border-radius:4px;display:flex;align-items:center;padding-left:.4rem;font-size:.75rem;color:#000;font-weight:600">${p.d}w</div></div></div>`;start+=p.d;});h+=`<p class="note">Total: ${total} weeks (approx. ${(total/4.33).toFixed(1)} months)</p></div>`;document.getElementById('gantt').innerHTML=h;}</script></body></html>
