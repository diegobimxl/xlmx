<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plumbing Fixture Counter — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Plumbing Fixture Counter</h1><p class="sub">Engineering — Minimum fixture counts per IPC by occupancy</p>
<div class="card">
  <div class="g2">
    <div>
      <label>OCCUPANCY TYPE</label>
      <select id="occ" onchange="calc()">
        <option value="office">Business / Office</option><option value="retail">Mercantile / Retail</option>
        <option value="assembly">Assembly (A-2 Restaurant)</option><option value="school">Educational</option>
        <option value="hotel">Hotel / Motel</option><option value="hospital">Healthcare (outpatient)</option>
      </select>
    </div>
    <div><label>OCCUPANT LOAD</label><input type="number" id="load" value="200" oninput="calc()"></div>
  </div>
  <label>MALE / FEMALE SPLIT (%)</label>
  <input type="range" min="30" max="70" value="50" id="split" oninput="document.getElementById('split-lbl').textContent=this.value+'% male';calc()">
  <div style="font-size:12px;color:var(--mu);margin-top:4px;" id="split-lbl">50% male</div>
</div>
<div class="card">
  <div id="results"></div>
  <div class="note" id="note"></div>
</div>
</div><script>// IPC Table 403.1 simplified — [male_WC_ratio, female_WC_ratio, lav_ratio, urinal_ratio]
const RATIOS={
  office:{mwc:50,fwc:50,lav:40,uri:100,note:'IPC Table 403.1 Business'},
  retail:{mwc:500,fwc:500,lav:750,uri:1000,note:'IPC Mercantile'},
  assembly:{mwc:75,fwc:75,lav:200,uri:200,note:'IPC A-2 occupancy'},
  school:{mwc:50,fwc:50,lav:50,uri:100,note:'IPC Educational'},
  hotel:{mwc:100,fwc:100,lav:100,uri:100,note:'Per guest room'},
  hospital:{mwc:25,fwc:25,lav:40,uri:100,note:'IPC Healthcare outpatient'},
};
function calc(){
  const occ=document.getElementById('occ').value;
  const load=+document.getElementById('load').value;
  const splitM=+document.getElementById('split').value/100;
  const splitF=1-splitM;
  const r=RATIOS[occ];
  const male=Math.round(load*splitM);
  const female=Math.round(load*splitF);
  const mwc=Math.max(1,Math.ceil(male/r.mwc));
  const fwc=Math.max(1,Math.ceil(female/r.fwc));
  const mlav=Math.max(1,Math.ceil(male/r.lav));
  const flav=Math.max(1,Math.ceil(female/r.lav));
  const uri=Math.max(1,Math.ceil(male/r.uri));
  document.getElementById('results').innerHTML=`
    <table class="tbl">
      <tr><th>FIXTURE TYPE</th><th style="text-align:center;">MEN'S</th><th style="text-align:center;">WOMEN'S</th><th style="text-align:center;">TOTAL</th></tr>
      <tr><td>Water Closets</td><td style="text-align:center;font-weight:700;color:var(--acc);">${mwc}</td><td style="text-align:center;font-weight:700;color:var(--acc);">${fwc}</td><td style="text-align:center;">${mwc+fwc}</td></tr>
      <tr><td>Lavatories</td><td style="text-align:center;font-weight:700;color:var(--acc);">${mlav}</td><td style="text-align:center;font-weight:700;color:var(--acc);">${flav}</td><td style="text-align:center;">${mlav+flav}</td></tr>
      <tr><td>Urinals (men)</td><td style="text-align:center;font-weight:700;color:var(--acc);">${uri}</td><td style="text-align:center;color:var(--mu);">—</td><td style="text-align:center;">${uri}</td></tr>
      <tr><td>Drinking Fountains</td><td colspan="2" style="text-align:center;font-weight:700;color:var(--acc);">${Math.max(1,Math.ceil(load/100))} (total)</td><td style="text-align:center;">${Math.max(1,Math.ceil(load/100))}</td></tr>
    </table>`;
  document.getElementById('note').textContent=`${r.note}. ${load} occupants (${male} M / ${female} F). Minimum per IPC — local amendments may require more. ADA requires at least one accessible fixture per gender per restroom. Urinals may substitute for up to 67% of male WC count.`;
}
calc();</script></body></html>
