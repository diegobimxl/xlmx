<script>
var TERMS=[
  {n:'ASHRAE 90.1',abbr:'90.1',cat:'energy',def:'ANSI/ASHRAE/IES Standard 90.1 — Energy Standard for Buildings Except Low-Rise Residential. The dominant commercial energy code in the US, adopted (often by reference) by IECC and most state codes. Sets minimum efficiency requirements for envelope, lighting, and mechanical systems.',metric:'Current version: 2022. LEED v4.1 references ASHRAE 90.1-2019.'},
  {n:'Energy Use Intensity',abbr:'EUI',cat:'energy',def:'Total energy consumed in a building over one year divided by its gross floor area. The primary metric for comparing building energy performance across types and sizes. Lower EUI = more efficient. Includes electricity, natural gas, steam, chilled water, and all fuels.',metric:'Units: kBtu/SF/yr (US) or kWh/m²/yr (SI). Typical office: 30-80 kBtu/SF/yr. Passive House: <15 kBtu/SF/yr.'},
  {n:'Coefficient of Performance',abbr:'COP',cat:'hvac',def:'The ratio of useful thermal energy output to the electrical energy input for a heat pump, refrigeration system, or chiller. Higher COP = more efficient. Cooling COP is equivalent to EER/3.412. Heating COP describes a heat pump\'s ratio of heat delivered to electricity used.',metric:'Typical ranges: Standard AC 3.0-3.5 | High-eff split 4.5-6.0 | Ground source HP 4.5-5.5 (cooling).'},
  {n:'Solar Heat Gain Coefficient',abbr:'SHGC',cat:'envelope',def:'A dimensionless number (0 to 1) representing the fraction of incident solar radiation that enters a building through a glazing system, both directly transmitted and absorbed then re-radiated. Lower SHGC = less solar heat admitted. The primary metric for managing cooling loads.',metric:'Hot climates: SHGC ≤ 0.25. Mixed climates: 0.25-0.40. Cold passive solar: 0.40-0.55.'},
  {n:'U-Value / U-Factor',abbr:'U',cat:'envelope',def:'The overall heat transfer coefficient of an assembly — the rate of heat flow per unit area per degree of temperature difference. The inverse of R-value (U = 1/R). NFRC U-values for windows include the frame effect. Used in heat loss/gain calculations and energy code compliance.',metric:'Units: BTU/hr·SF·°F (US) or W/m²·K (SI). Passive House window: U ≤ 0.14 BTU/hr·SF·°F.'},
  {n:'R-Value',abbr:'R',cat:'envelope',def:'Thermal resistance of a building assembly or insulation product — the reciprocal of U-value (R = 1/U). Measures resistance to heat flow through a material. "Clear field" R-value ignores framing; "effective R-value" accounts for thermal bridging at studs, clips, and other elements.',metric:'Units: hr·SF·°F/BTU (US) or m²·K/W (SI). ASHRAE 90.1-2022 Zone 5 roof: min R-38 (CI) or R-49 (attic).'},
  {n:'Visible Light Transmittance',abbr:'VLT',cat:'envelope',def:'The fraction of visible light (380-780 nm) that passes through a glazing system. Higher VLT provides more natural light but can increase glare risk. Often used alongside SHGC to calculate the Light-to-Solar Gain (LSG) ratio — a measure of how well the glass transmits light while blocking heat.',metric:'Good daylighting glazing: VLT > 0.55. High performance: VLT > 0.65. LEED EQc8 view glazing: VLT ≥ 0.27.'},
  {n:'Light-to-Solar Gain Ratio',abbr:'LSG',cat:'envelope',def:'The ratio of Visible Light Transmittance to Solar Heat Gain Coefficient (LSG = VLT / SHGC). Values above 1.4-1.6 indicate "spectrally selective" glazing that transmits more light than heat — desirable in most commercial applications. Coined to evaluate advanced low-e coatings.',metric:'Standard double clear: LSG ≈ 1.1. Spectrally selective: LSG > 1.5. Best available: LSG ≈ 2.8.'},
  {n:'Thermal Bridging',abbr:null,cat:'envelope',def:'The conduction of heat through a material with higher thermal conductivity than the surrounding insulation, creating a "short circuit" in the thermal envelope. Metal studs can reduce effective R-value of a wall by 40-50% vs. clear-field. Linear transmittance (ψ-value) quantifies thermal bridge intensity.',metric:'Metal stud 3-5/8" reduces R-21 cavity to eff. R-8 to R-12. Solution: continuous insulation (CI) exterior.'},
  {n:'Continuous Insulation',abbr:'CI',cat:'envelope',def:'Insulation that is uncompressed and continuous across all structural members including steel framing, installed on the interior or exterior face of structural elements. Required by ASHRAE 90.1 in climate zones 3-8 for metal-framed walls. Eliminates or drastically reduces thermal bridging losses.',metric:'ASHRAE 90.1-2022 Zone 5 metal frame wall: R-13 + R-7.5ci minimum. R-15 + R-5ci alternate.'},
  {n:'Embodied Carbon',abbr:'EC',cat:'carbon',def:'Greenhouse gas emissions associated with materials and construction processes throughout the lifecycle of a building. Modules A1-A3 (cradle-to-gate) cover raw material extraction through manufacturing. A4-A5 add transport and construction. B1-B5 cover in-use and maintenance. C1-D cover end-of-life.',metric:'Units: kgCO2e (CO2 equivalent). A1-A3 benchmark: office concrete ~400 kgCO2e/m² | timber ~180-220 kgCO2e/m².'},
  {n:'Global Warming Potential',abbr:'GWP',cat:'carbon',def:'A measure of how much energy the emissions of 1 metric ton of a gas absorbs over a given time period (typically 100 years), relative to CO2 (GWP = 1). Used to compare different greenhouse gases. Critical metric for refrigerants (HFCs), insulation blowing agents, and materials specified in EPDs.',metric:'CO2: GWP=1. Methane (CH4): GWP=28. N2O: GWP=265. HFC-134a (refrigerant): GWP=1,430. R-32: GWP=675.'},
  {n:'Environmental Product Declaration',abbr:'EPD',cat:'materials',def:'A Type III eco-label for building materials that quantifies environmental impacts (GWP, acidification, eutrophication, ozone depletion, etc.) per functional unit over a defined system boundary. Based on Life Cycle Assessment (LCA). Required by LEED v4 MRc2 (Building Product Disclosure). Product-specific EPDs are more accurate than industry-average data.',metric:'Standard: ISO 14025 + EN 15804 (Europe) or PCR (US). EC3 database aggregates thousands of EPDs.'},
  {n:'EC3 Platform',abbr:'EC3',cat:'carbon',def:'Embodied Carbon in Construction Calculator — a free tool by Building Transparency (funded by Microsoft, Amazon, etc.) for comparing embodied carbon across materials using EPD data. Integrated with structural analysis tools. The de facto industry standard for specifying low-carbon materials. Supports IES, Tally, and other plugins.',metric:'Data coverage: concrete, steel, aluminum, glass, wood products, MEP equipment. API available.'},
  {n:'Whole-Building Life Cycle Assessment',abbr:'WBLCA',cat:'carbon',def:'A comprehensive environmental analysis of a building that accounts for all materials and systems across all lifecycle stages (A-D). Goes beyond A1-A3 to include transportation, construction waste, operational impacts, and end-of-life. Increasingly required for embodied carbon verification in institutional projects.',metric:'LEED v4.1 MRc1: WBLCA can earn up to 3 points for 10-20%+ reduction vs. baseline. ATHENA Impact Estimator is widely used.'},
  {n:'Passive House',abbr:'PH/PHIUS',cat:'certifications',def:'A rigorous energy performance standard for buildings with very low heating/cooling demand achieved through extreme insulation, triple glazing, airtightness, and mechanical ventilation with heat recovery. PHIUS (US) and PHI (Europe/Intl) are the two main certifying bodies with slightly different criteria.',metric:'PHIUS 2021: annual heating demand ≤ 4.75 kBtu/SF/yr. Airtightness: ≤ 0.06 CFM50/SF. PH EUI: <15-25 kBtu/SF/yr.'},
  {n:'LEED',abbr:'LEED',cat:'certifications',def:'Leadership in Energy and Environmental Design — the most widely used green building rating system globally. Administered by the US Green Building Council (USGBC). Projects earn points across categories: Location, Sustainability, Water, Energy, Materials, Indoor Air Quality, Innovation, Regional. Levels: Certified (40), Silver (50), Gold (60), Platinum (80+).',metric:'v4.1 is current. Over 100,000 certified projects globally. Market premium: 3-7% rent premium in major markets.'},
  {n:'WELL Building Standard',abbr:'WELL',cat:'certifications',def:'A performance-based system for measuring, certifying, and monitoring features that impact human health and wellness in buildings. Developed by the International WELL Building Institute (IWBI). Covers Air, Water, Nourishment, Light, Fitness, Comfort, Mind, Sound, Materials, Community, Innovation.',metric:'WELL Certified, Silver, Gold, Platinum. Cost premium: $2-10/SF. Strong correlation with occupant productivity (+11%) and retention.'},
  {n:'BREEAM',abbr:'BREEAM',cat:'certifications',def:'Building Research Establishment Environmental Assessment Method — the UK\'s primary green building certification (equivalent to LEED in the US). Used extensively in UK, Europe, Middle East, and for international investors. Covers Management, Health, Energy, Transport, Water, Materials, Waste, Land Use, Pollution.',metric:'Ratings: Pass, Good, Very Good, Excellent, Outstanding. 575,000+ certified buildings globally.'},
  {n:'Living Building Challenge',abbr:'LBC',cat:'certifications',def:'The most stringent green building standard, requiring buildings to generate all their energy on-site, capture and treat all water, use only Red List-free materials, and contribute positively to their site ecology. Developed by the International Living Future Institute. Only a few hundred certified globally.',metric:'20 imperatives across 7 petals. Net Zero Energy and Net Zero Water are standalone sub-certifications.'},
  {n:'Net Zero Energy',abbr:'NZE',cat:'energy',def:'A building that produces as much energy as it consumes on an annual basis, typically through on-site renewable energy (solar PV, wind). The definition varies: source energy, site energy, cost, carbon. ASHRAE Standard 100 and LEED Zero use source energy accounting. All-electric buildings are the typical pathway.',metric:'DOE definition: site EUI met by on-site renewable generation. DOE NZE commercial portfolio target: 50% reduction by 2030.'},
  {n:'Heating Degree Days',abbr:'HDD',cat:'energy',def:'A measure of how cold a climate is, equal to the sum of degrees by which the average daily temperature falls below a baseline (typically 65°F/18°C) over a year. Used to estimate heating energy demand. Higher HDD = more heating needed. New York: ~4,500 HDD65. Minneapolis: ~8,100 HDD65. Miami: ~200 HDD65.',metric:'HDD65: cumulative days × degrees below 65°F. Used in UA × HDD × 24 / 100,000 heat loss formulas.'},
  {n:'Cooling Degree Days',abbr:'CDD',cat:'energy',def:'A measure of how hot a climate is, equal to the sum of degrees by which the average daily temperature exceeds a baseline (typically 65°F/18°C) over a year. Used to estimate cooling energy demand. Houston: ~2,800 CDD65. Phoenix: ~4,000 CDD65. Chicago: ~400 CDD65.',metric:'CDD65: cumulative days × degrees above 65°F. High CDD drives need for low-SHGC glazing and adequate shading.'},
  {n:'Daylight Factor',abbr:'DF',cat:'passive',def:'The ratio of interior illuminance at a point to the simultaneous unobstructed exterior diffuse horizontal illuminance, expressed as a percentage. A simple measure of daylighting effectiveness under overcast sky conditions. 2% DF is generally considered adequate for task areas; 5%+ is excellent.',metric:'DF = (Aw/Af) × VT × R × correction factor. LEED EQc7 Daylight: 300 lux minimum for 55% of regularly occupied floor area.'},
  {n:'Window-to-Floor Ratio',abbr:'WFR',cat:'passive',def:'The ratio of total window area to total floor area of a space. A simple metric for estimating daylighting potential. Minimum 2% WFR is typically needed for adequate daylight. Code requirements vary; California Title 24 mandates daylighting in certain occupancy types above certain floor area thresholds.',metric:'WFR = Glazing Area / Floor Area. Typical code-minimum office: 2-5% WFR. Well-lit office: 8-15% WFR.'},
  {n:'Window-to-Wall Ratio',abbr:'WWR',cat:'envelope',def:'The ratio of total fenestration area to total gross exterior wall area. A key metric for balancing energy (heat loss/gain) and daylighting. ASHRAE 90.1-2022 limits WWR to 40% for prescriptive compliance (up from 30% in earlier versions). Higher WWR requires lower U-value and SHGC to compensate.',metric:'Typical commercial: 30-50% WWR. Curtain wall high-rise: 60-85% WWR (requires performance path compliance).'},
  {n:'Thermal Mass',abbr:null,cat:'passive',def:'The ability of a material to absorb, store, and release thermal energy. High-mass materials (concrete, masonry, water) can moderate temperature swings by absorbing heat during the day and releasing it at night — reducing peak mechanical loads and shifting load timing. Most effective when the diurnal temperature range exceeds 20°F.',metric:'Concrete: ~30 BTU/SF·°F for 6" slab. Stone: ~35 BTU/SF·°F. Contribution varies with location within thermal envelope.'},
  {n:'Thermal Comfort (ASHRAE 55)',abbr:null,cat:'hvac',def:'ANSI/ASHRAE Standard 55 defines thermal comfort as "that condition of mind that expresses satisfaction with the thermal environment." The primary indices are PMV (Predicted Mean Vote) and PPD (Predicted Percentage Dissatisfied), based on air temperature, radiant temperature, humidity, air speed, clothing (CLO), and activity (MET).',metric:'ASHRAE 55 acceptable: PPD ≤ 20% (PMV between -0.5 and +0.5). WELL Building: PPD ≤ 10%.'},
  {n:'Predicted Mean Vote',abbr:'PMV',cat:'hvac',def:'A thermal comfort index developed by Fanger (ISO 7730) that predicts the mean value of votes by a large group of people on a 7-point thermal sensation scale (-3 cold to +3 hot, 0 = neutral). Calculated from air temp, radiant temp, humidity, air velocity, clothing insulation (CLO), and metabolic rate (MET).',metric:'PMV scale: -3 cold | -2 cool | -1 slightly cool | 0 neutral | +1 slightly warm | +2 warm | +3 hot.'},
  {n:'Predicted Percentage Dissatisfied',abbr:'PPD',cat:'hvac',def:'The percentage of occupants predicted to be dissatisfied with thermal conditions, derived from PMV. Even at PMV=0 (neutral), about 5% are dissatisfied. The ASHRAE 55 acceptable range is PMV ±0.5 (PPD ≤ 10%). PPD increases rapidly as PMV departs from 0.',metric:'PMV=0: PPD≈5%. PMV=±0.5: PPD≈10%. PMV=±1: PPD≈26%. PMV=±2: PPD≈77%.'},
  {n:'Variable Refrigerant Flow',abbr:'VRF/VRV',cat:'hvac',def:'A multi-split heat pump system where the refrigerant flow rate is modulated by inverter-driven compressors to match precise building loads. One outdoor unit serves multiple indoor units (fan coils) with individual zone control. Heat recovery VRF can transfer heat from cooling zones to heating zones simultaneously — key advantage in mixed-occupancy buildings.',metric:'COP (cooling): 4.5-5.5. Heat recovery VRF COP (heating): 3.5-4.5. Part-load efficiency (IPLV): 5.0-6.0 EER.'},
  {n:'Dedicated Outdoor Air System',abbr:'DOAS',cat:'hvac',def:'A separate HVAC system that handles 100% of the ventilation/outdoor air requirement, decoupled from the sensible heating/cooling system. Allows the primary HVAC system (fan coils, chilled beams, radiant) to operate at higher efficiency by handling only sensible loads. Almost always paired with energy recovery ventilation (ERV/HRV).',metric:'DOAS reduces primary system airflow by 40-70% vs. all-air VAV. Standard in Passive House, high-performance commercial.'},
  {n:'Energy Recovery Ventilation',abbr:'ERV',cat:'hvac',def:'A ventilation system that transfers energy (both sensible heat and latent moisture) from exhaust air to incoming fresh air, reducing the energy required to condition the outdoor air. Similar to HRV (Heat Recovery Ventilation) but also transfers moisture, making it better for humid climates.',metric:'Sensible effectiveness: 70-80%. Total effectiveness: 60-75%. Energy savings vs. no recovery: 30-50% of ventilation load.'},
  {n:'Carbon Dioxide Equivalent',abbr:'CO2e',cat:'carbon',def:'A metric that expresses the global warming potential of all greenhouse gases in terms of an equivalent amount of carbon dioxide. Used in carbon footprint calculations, EPDs, and emissions inventories. For buildings, it includes CO2 (combustion), CH4 (fugitive refrigerant, gas leaks), N2O (combustion), and HFCs (refrigerant leaks).',metric:'Used throughout WBLCA, EPDs, carbon budget tools. 1 kgCO2e = 1 kg CO2, or 0.036 kg CH4, or 0.0038 kg N2O.'},
  {n:'Life Cycle Assessment',abbr:'LCA',cat:'materials',def:'A systematic methodology for evaluating the environmental impacts of a product or system through its entire life — from raw material extraction (cradle) through manufacturing, transportation, use, and end-of-life (grave, or cradle-to-gate). Required for LEED v4 MRc1 WBLCA credit and increasingly mandated by public procurement.',metric:'Standard: ISO 14040/14044. Modules A-D per EN 15978. Tools: Tally (Revit), One Click LCA, SimaPro, OpenLCA, ATHENA.'},
  {n:'Thermal Transmittance',abbr:'Ψ (psi)',cat:'envelope',def:'Also called linear transmittance or ψ-value, it quantifies the additional heat flow per unit length of a linear thermal bridge (window frame, wall-slab interface, balcony connection) beyond what is accounted for by U-values of adjacent assemblies. Used in ASHRAE 90.1 Appendix A thermal bridge compliance.',metric:'Units: BTU/hr·ft·°F (US) or W/m·K (SI). Poorly detailed slab edge: ψ ≈ 0.30 W/m·K. Thermal break: ψ ≈ 0.05-0.10 W/m·K.'},
  {n:'Airtightness / Air Leakage',abbr:'ACH50',cat:'envelope',def:'The rate at which air infiltrates and exfiltrates through the building envelope, usually measured by a blower door test at 50 Pascals of pressure difference. Expressed as ACH50 (air changes per hour at 50 Pa) or CFM50/SF. Uncontrolled infiltration can account for 15-30% of building heat loss.',metric:'Typical leaky residential: ACH50 = 7-12. ENERGY STAR: ACH50 ≤ 3. LEED: ACH50 ≤ 2. Passive House: ACH50 ≤ 0.6.'},
  {n:'Photovoltaic',abbr:'PV',cat:'energy',def:'Technology that converts sunlight directly into electricity using semiconductor cells. Building-integrated PV (BIPV) embeds cells into roofing, facades, or glazing. Standard monocrystalline panels are 19-24% efficient. PV is the primary on-site energy source for net zero buildings.',metric:'Typical residential panel: 400W, ~22 SF. Commercial rooftop: $1.50-2.50/W installed (2024). LCOE: $0.03-0.06/kWh over 25 yr life.'},
  {n:'Power Purchase Agreement',abbr:'PPA',cat:'energy',def:'A financial arrangement where a third-party developer installs, owns, and operates a renewable energy system on a customer\'s property. The building owner buys the energy generated at a fixed rate. Eliminates upfront capital cost but the developer owns the system. Off-site PPAs allow large commercial buyers to support grid-scale renewables.',metric:'PPA rates typically $0.06-0.09/kWh for solar (below utility rates in most US markets). 15-25 year contracts typical.'},
  {n:'Section 179D',abbr:'179D',cat:'energy',def:'IRS tax deduction for energy-efficient commercial buildings. The Inflation Reduction Act (2022) significantly expanded it: up to $5/SF for buildings exceeding ASHRAE 90.1 by 50%. Applies to envelope, lighting, and HVAC. Designers of government buildings (schools, federal, state/local) can claim the deduction transferred from the owner.',metric:'Base: $0.50/SF (25%+ better than baseline). Bonus: $2.50-5.00/SF (50%+ better + prevailing wage requirements).'},
  {n:'Section 45L',abbr:'45L',cat:'energy',def:'IRS tax credit for new energy-efficient residential homes. IRA 2022 expanded it: $2,500 per unit for ENERGY STAR certified (multifamily or single family), $5,000 per unit for DOE Zero Energy Ready Homes. Applies to developers and builders. Tax credit, not deduction — direct dollar-for-dollar reduction in tax owed.',metric:'$2,500/unit for ENERGY STAR. $5,000/unit for Zero Energy Ready. Available through 2032.'},
  {n:'ENERGY STAR',abbr:null,cat:'certifications',def:'A voluntary US EPA/DOE program that certifies products (appliances, electronics, windows, HVAC) and buildings that meet energy efficiency criteria. ENERGY STAR buildings score ≥ 75 on the 1-100 EPA Energy Star Score (benchmarked against similar buildings nationwide). Widely required for LEED prerequisites.',metric:'Building score: percentile rank vs. national database. Score ≥ 75 = above average. ≥ 90 = top 10% of buildings.'},
  {n:'DOE Zero Energy Ready Home',abbr:'ZERH',cat:'certifications',def:'A US DOE certification for homes that are so efficient that a renewable energy system could offset all energy use. More stringent than ENERGY STAR. Requires HERS index ≤ 52, mechanical ventilation, duct leakage ≤ 4 CFM25/100SF, and other specs. Qualifies for §45L $5,000/unit tax credit.',metric:'Requires certified HERS rater. Good market differentiator for multifamily developers, especially in low-carbon grid areas.'},
  {n:'Blower Door Test',abbr:null,cat:'envelope',def:'A diagnostic test that measures the airtightness of a building\'s envelope by depressurizing the building to 50 Pa with a fan mounted in a door opening, then measuring airflow required to maintain that pressure. Required for ENERGY STAR, Passive House, and increasingly by code (IECC 2021 for residential).',metric:'Expressed as CFM50 (total leakage) or ACH50 (air changes/hr) or CFM50/SF (normalized). IECC residential: ≤ 3 ACH50 in most zones.'},
  {n:'Thermal Lag',abbr:null,cat:'passive',def:'The time delay between peak outdoor temperature and peak indoor temperature caused by thermal mass. Heavy construction (concrete, masonry) can delay heat transfer by 6-14 hours, shifting peak cooling loads to off-peak hours and potentially eliminating the need for air conditioning in mild-to-moderate climates with large diurnal temperature swings.',metric:'Concrete 8" wall: ~8-10 hr lag. Adobe (12"): ~12-14 hr. Lightweight frame: ~1-2 hr lag. Effective in zones with ΔT night-day > 20°F.'},
  {n:'Stack Effect',abbr:null,cat:'passive',def:'Natural ventilation driven by temperature-induced buoyancy differences between indoor and outdoor air. Warm air rises and exits high in the building, drawing cooler air in from low openings. Most effective in tall buildings, especially during shoulder seasons. Can also cause significant heat loss if not controlled by airtight design.',metric:'Pressure difference = 0.052 × H × (1/T_out - 1/T_in) × 2116 [in inches w.g.]. Critical for atria, stair towers, smoke management.'},
  {n:'Cross Ventilation',abbr:null,cat:'passive',def:'Natural ventilation strategy that uses wind pressure to drive airflow through a building when windows on windward and leeward facades are open. Most effective in single-zone, shallow floor plates (≤ 5× floor-to-ceiling height deep). Requires proper opening sizing (≥ 5% of floor area per ASHRAE 62.1 natural vent exception).',metric:'Effective depth: ≤ 15m (50 ft). Good breeze: provides 2-6 ACH. LEED EQc1 allows natural ventilation for IEQ compliance.'},
  {n:'Green Roof',abbr:null,cat:'passive',def:'A roof system that incorporates a growing medium and vegetation over a waterproof membrane. Extensive green roofs (2-6" substrate) feature sedums/grasses; intensive (6-24"+) support deeper plantings or gardens. Benefits: stormwater retention, thermal insulation, urban heat island mitigation, habitat creation, extended roof membrane life.',metric:'Stormwater retention: 50-75% annual (extensive). R-value addition: R-2 to R-5. Typical weight: 10-30 psf (extensive), 60-150+ psf (intensive).'},
  {n:'Urban Heat Island',abbr:'UHI',cat:'passive',def:'The phenomenon where urban areas experience higher temperatures than surrounding rural areas due to replacement of vegetation with dark, impervious surfaces (asphalt, dark roofing) that absorb solar radiation. Can elevate urban temperatures 2-10°F. Mitigation strategies: cool roofs (high albedo), green roofs, street trees, permeable pavements.',metric:'LEED SSc5 Heat Island Reduction: cool roofs SRI ≥ 82 (low-slope) or ≥ 39 (steep-slope), and/or 50% of site in shade/open grid.'},
  {n:'Solar Reflectance Index',abbr:'SRI',cat:'envelope',def:'A measure of a surface\'s ability to reject solar heat — combining reflectance (proportion of solar energy reflected) and emittance (rate at which absorbed energy is released as thermal radiation) into a single 0-100 index. White = ~100 SRI. Black = ~0 SRI. Used in LEED for cool roof compliance.',metric:'LEED cool roof: low-slope ≥ 82 SRI, steep ≥ 39 SRI. ENERGY STAR cool roof: reflectance ≥ 0.65 (low-slope), ≥ 0.25 (steep slope).'},
  {n:'Net Positive Carbon',abbr:null,cat:'carbon',def:'A building or project that removes more carbon from the atmosphere over its lifecycle than it emits — beyond net zero. Achieved through high embodied carbon efficiency (low-carbon materials, mass timber), on-site renewables generating surplus energy, carbon sequestration through biogenic materials, and offset purchasing.',metric:'Biogenic carbon in mass timber: ~40-80 kgCO2e/m² sequestered. Living Building Challenge requires positive carbon balance.'},
  {n:'Biogenic Carbon',abbr:null,cat:'carbon',def:'Carbon contained in biological materials (wood, biomass). When forests grow, they sequester atmospheric CO2 into biogenic carbon stored in wood. Using mass timber (CLT, Glulam) in buildings "locks" this carbon for the life of the building. Accounting standards (EN 16485, IPCC) vary on when to credit this sequestration.',metric:'1 m³ of CLT sequesters ~250-300 kgCO2e of biogenic carbon. EC3 and most tools treat this as a separate figure from cradle-to-gate GWP.'},
  {n:'Mechanical Ventilation Heat Recovery',abbr:'MVHR',cat:'hvac',def:'European term for Heat Recovery Ventilation (HRV), an air-to-air heat exchanger that recovers heat from outgoing stale air to pre-condition incoming fresh air. Essential component of Passive House design, ensuring indoor air quality while minimizing heat loss. Typical whole-house HRV: 75-90% sensible efficiency.',metric:'Typical MVHR unit: 200-500 m³/hr capacity, 75-90% sensible recovery. Required by PHI standard to maintain IEQ in tight envelopes.'},
  {n:'Carbon Border Adjustment Mechanism',abbr:'CBAM',cat:'carbon',def:'EU regulation (effective 2026) that places a carbon price on imports of certain carbon-intensive products (steel, aluminum, cement, glass) into the EU, to prevent carbon leakage from less regulated producers. Directly impacts embodied carbon of imported construction materials. Will drive demand for low-carbon steel and concrete EPDs globally.',metric:'Phase-in: 2023-2025 (reporting). Enforcement: 2026+. Carbon price linked to EU ETS (~€50-100/tCO2e).'},
  {n:'Internal Rate of Return',abbr:'IRR',cat:'energy',def:'The discount rate at which the net present value (NPV) of an investment\'s cash flows equals zero. The higher the IRR, the more attractive the investment. Used to evaluate sustainability upgrades vs. business-as-usual. A green premium investment with IRR ≥ cost of capital (typically 6-12% for commercial RE) is financially justified.',metric:'Typical green upgrade IRR: HVAC upgrades 8-18% | Envelope upgrades 5-12% | PV 8-14% | Daylighting controls 15-25%.'},
  {n:'Net Present Value',abbr:'NPV',cat:'energy',def:'The difference between the present value of all future cash inflows (energy savings, incentives, residual value) and the present value of all cash outflows (capital cost, maintenance) over an analysis period, at a specified discount rate. Positive NPV = financially worthwhile investment. Standard metric for lifecycle cost analysis.',metric:'NPV = Σ(cash flow_t / (1+r)^t) - Initial Cost. Discount rate: 6-10% typical for commercial buildings. Analysis period: 20-30 yrs.'},
  {n:'Operations and Maintenance',abbr:'O&M',cat:'energy',def:'Ongoing activities to keep a building and its systems performing at design intent. Poor O&M can erode 10-30% of a building\'s energy efficiency gains from commissioning. ASHRAE Guideline 0 and the Building Commissioning Association (BCA) publish O&M best practices. Retro-commissioning (RCx) of existing buildings often yields 10-20% EUI reduction.',metric:'Typical commercial O&M cost: $1.50-4.00/SF/yr. HVAC proportion: 35-50% of O&M budget.'},
  {n:'Retro-Commissioning',abbr:'RCx',cat:'energy',def:'The systematic process of improving the operation and maintenance of an existing building to ensure that systems perform as originally intended, or to a new higher standard. Typically yields 5-15% energy savings for a cost of $0.10-0.30/SF. One of the highest ROI sustainability interventions for existing buildings.',metric:'Median energy savings from RCx: 16% (LBNL). Payback: 1-3 years. LEED EBOM EAp2 requires energy performance verification.'},
  {n:'ASHRAE Climate Zone',abbr:'CZ',cat:'energy',def:'A geographic classification system (ASHRAE Standard 169) dividing the US (and world) into 8 primary zones based on heating degree days (HDD) and cooling degree days (CDD), with subzones for humidity (A=humid, B=dry, C=marine). Determines minimum envelope U-values, SHGC limits, and mechanical efficiency requirements under ASHRAE 90.1 and IECC.',metric:'Zone 1A: Miami (very hot humid) | 3B: Los Angeles (warm dry) | 4A: NYC (mixed humid) | 5A: Chicago (cool humid) | 7: Fairbanks (very cold).'},
  {n:'Condensation Resistance',abbr:'CR',cat:'envelope',def:'An NFRC rating (0-100) indicating how well a window resists the formation of condensation on the interior surface under simulated winter conditions. Higher CR = less condensation risk. A CR of 60+ is typically recommended for climate zones 5-7. Calculated via heat transfer simulation, not physical testing.',metric:'CR < 40: significant condensation risk in zone 5-7. CR 50-60: acceptable for most applications. CR > 70: Passive House level.'},
  {n:'Sound Transmission Class',abbr:'STC',cat:'envelope',def:'A single-number rating describing how well a partition or window attenuates airborne sound (ASTM E90/E413). Higher STC = better sound insulation. Commonly specified for partitions between spaces, windows facing highways/airports, and floor/ceiling assemblies. Laminated glass significantly improves STC vs. same-thickness monolithic glass.',metric:'Residential bedroom partition: STC ≥ 50. Hospital patient room: ≥ 55. Home theater: ≥ 60. Highway window: STC ≥ 45.'},
  {n:'Argon Fill',abbr:null,cat:'envelope',def:'A noble gas used to fill the space between panes in insulated glazing units (IGUs) instead of air. Argon has lower thermal conductivity than air (~60% lower), reducing center-of-glass U-value by 0.02-0.04 BTU/hr·SF·°F. Standard in all high-performance glazing. Gas retention: ~95% after 20 years in properly sealed units.',metric:'Air fill: λ = 0.024 W/m·K. Argon: λ = 0.017 W/m·K. Krypton: λ = 0.009 W/m·K. Xenon: λ = 0.005 W/m·K.'},
  {n:'Krypton Fill',abbr:null,cat:'envelope',def:'A noble gas with significantly lower thermal conductivity than argon, used in ultra-high-performance triple-pane glazing units to achieve U-values below 0.20 BTU/hr·SF·°F. More expensive than argon ($15-25/SF premium). Required for very thin triple pane units where argon-filled gaps are too narrow to be effective.',metric:'Krypton: λ = 0.009 W/m·K (half of argon). Optimal gap for krypton: 8-10 mm. Gap for argon: 12-16 mm.'},
  {n:'Dew Point Temperature',abbr:null,cat:'envelope',def:'The temperature to which air must be cooled (at constant pressure and water content) for water vapor to condense into liquid water. When interior surface temperatures fall below the dew point of the indoor air, condensation forms. Critical for wall assembly design in cold climates — the vapor barrier placement determines where condensation risk occurs.',metric:'Indoor 70°F / 50% RH → dew point ≈ 50°F. Surface below 50°F → condensation. Use WUFI or Moisture-Safe for simulation.'},
  {n:'Vapor Barrier / Retarder',abbr:null,cat:'envelope',def:'A material that controls the diffusion of moisture through a building assembly. Class I (≤ 0.1 perms): polyethylene, glass. Class II (0.1-1 perm): kraft paper. Class III (1-10 perms): latex paint, OSB. Location within the assembly should be determined by climate: exterior for cold climates, interior for hot-humid. Smart vapor retarders respond to humidity.',metric:'Units: Perm (1 perm = 1 grain/hr·ft²·in.Hg). IBC requires vapor barrier in CZ4+ on the warm side of insulation.'},
  {n:'Integrated Design Process',abbr:'IDP',cat:'bim',def:'A collaborative design approach where the whole team (architect, engineers, landscape architect, contractor) works together from project inception to optimize performance holistically. IDP is required for LEED v4 IP credit (2 pts). Key activities: energy modeling in schematic design, passive strategy selection before sizing HVAC, envelope optimization before glazing selection.',metric:'Studies show IDP reduces construction cost 2-4% and energy use 25-40% vs. conventional linear design process.'},
  {n:'BIM Energy Analysis',abbr:null,cat:'bim',def:'The use of Building Information Model data to perform energy simulation, typically via export to EnergyPlus, IES-VE, eQUEST, or Designbuilder. Revit exports gbXML or IFC format for direct import. Key parameters to verify: thermal zone boundaries, HVAC system assignments, glazing SHGC and U-value, space occupancy schedules.',metric:'Revit → gbXML → EnergyPlus pipeline. Plugin options: Insight 360, Sefaira, IES-VE for Revit. Validate model with ASHRAE 90.1 baseline at minimum.'},
  {n:'Green Globe',abbr:null,cat:'certifications',def:'A US/Canadian green building rating system administered by the Green Building Initiative (GBI). Increasingly used for federal and government buildings as an alternative to LEED. Uses a 1-4 globe rating (1000-point scale). Third-party assessor required for certification. Strong emphasis on O&M in existing buildings.',metric:'1000 points total. 1 Globe: 35%. 2 Globes: 55%. 3 Globes: 70%. 4 Globes: 85%. Often recognized alongside LEED for federal procurement.'},
  {n:'Albedo',abbr:null,cat:'passive',def:'The reflectivity of a surface — the fraction of solar radiation reflected rather than absorbed. Values range from 0 (perfect absorber) to 1 (perfect reflector). White paint albedo ≈ 0.80-0.90. Asphalt pavement ≈ 0.05. Bituminous roofing ≈ 0.05-0.10. Increasing surface albedo reduces heat gain and urban heat island effect.',metric:'SRI and albedo are related but not identical. SRI = (reflectance × 0.804 + emittance × 0.196 - 0.059) × 122.5 (approx).'},
  {n:'Heat Island Effect',abbr:'UHI',cat:'passive',def:'Urban areas are warmer than surrounding rural areas due to replacement of vegetation with heat-absorbing surfaces. Urban peaks of 2-10°F higher than rural. Increases building cooling loads, peak electricity demand, smog formation, and heat-related illness. LEED SSc5 addresses this with cool roofs, cool pavements, and shading.',metric:'LBNL estimates UHI adds 5-10% to cooling energy in US cities. Cool roof albedo increase of 0.6 can offset ~1°C urban warming locally.'},
  {n:'Carbon Neutral',abbr:null,cat:'carbon',def:'Achieving net zero greenhouse gas emissions by eliminating emissions from operations and/or offsetting remaining emissions through verified carbon credits, RECs, or carbon removal. The building industry typically means operational carbon neutral for the energy in use phase. Embodied carbon (A1-C4) is increasingly included in full scope definitions.',metric:'Architecture 2030 Challenge: all new buildings carbon neutral by 2030. AIA Framework for Design Excellence sets similar targets.'},
  {n:'Scope 1 / 2 / 3 Emissions',abbr:null,cat:'carbon',def:'A GHG reporting framework (GHG Protocol): Scope 1 = direct emissions from owned sources (boilers, vehicles). Scope 2 = indirect emissions from purchased electricity/heat (market or location-based). Scope 3 = all other indirect emissions (supply chain, embodied carbon in materials, commuting). Most corporate real estate targets include Scope 1 and 2; leading firms add Scope 3.',metric:'For a typical office building: Scope 2 (electricity) = 50-70% of operational emissions. Scope 3 (embodied) = 30-70% of whole-life carbon.'},
  {n:'Low-E Coating',abbr:'Low-E',cat:'envelope',def:'A microscopically thin, transparent metallic oxide coating applied to one or more glass surfaces within an insulated glazing unit. Reduces long-wave infrared radiation transfer between panes (increases emissivity), significantly lowering U-value. Position #2 (second surface from outside) blocks solar gain; position #3 allows more solar heat in for passive solar.',metric:'Hard-coat (pyrolytic) Low-E: more durable, lower performance. Soft-coat (MSVD): higher performance, requires hermetic sealing within IGU.'},
  {n:'Ground Source Heat Pump',abbr:'GSHP',cat:'hvac',def:'A heat pump system that exchanges heat with the ground (or groundwater) rather than the outdoor air. The stable ground temperature (50-60°F) yields higher COP than air-source systems in extreme temperatures. Types: horizontal loop, vertical bore, pond loop, open-well. Qualifies for 30% IRA §48 investment tax credit through 2032.',metric:'Heating COP: 4.5-5.5. Cooling COP: 4.5-5.5. First cost premium over air-source: $15-40/SF. Payback: 8-15 yrs without incentives; 5-10 yrs with 30% ITC.'},
  {n:'Chilled Beam',abbr:'ACB',cat:'hvac',def:'A hydronic terminal device that cools or heats air by passing chilled/heated water through coils embedded in a ceiling-mounted beam. Active chilled beams (ACB) induce room air through primary air jets; passive beams (PCB) rely on natural convection. High-efficiency (no fan in room), silent, excellent for offices, labs, and healthcare.',metric:'Cooling capacity: 200-400 BTU/hr·LF (active). Space savings vs. ductwork: 30-40% reduction in plenum height. Initial cost: 15-20% premium vs. VAV.'},
  {n:'Inflation Reduction Act',abbr:'IRA',cat:'energy',def:'US federal legislation (August 2022) providing ~$370B in clean energy incentives over 10 years. Key building provisions: §48 Commercial Solar/Renewables ITC (30%), §48C Clean Energy Manufacturing, §45L Residential Energy Credit ($2,500-5,000/unit), §179D Energy Efficient Commercial Building Deduction ($0.50-5.00/SF), and direct pay options for nonprofits and local governments.',metric:'§179D bonus rate of $5/SF available through 2032. ITC transferable (can be sold to tax equity investors).'},
  {n:'Air Changes per Hour',abbr:'ACH',cat:'hvac',def:'The number of times per hour that the total volume of air in a space is replaced with outdoor (ventilation) air or recirculated air. Natural ventilation targets 2-6 ACH for comfort. Blower door tests express airtightness as ACH50 (at 50 Pa). ASHRAE 62.1 sets minimum outdoor air rates (OAR) for ventilation, typically expressed as CFM/person + CFM/SF.',metric:'Office min OA: 5 CFM/person + 0.06 CFM/SF (ASHRAE 62.1-2022). Hospital patient rooms: ≥ 2 outside ACH + 6 total ACH minimum.'},
  {n:'Operational Carbon',abbr:null,cat:'carbon',def:'Greenhouse gas emissions associated with the energy used to operate a building over its lifetime — heating, cooling, lighting, plug loads, hot water, elevators, and other services. Typically the larger share of whole-life building carbon in most climates. Decarbonization pathway: reduce EUI + electrify all loads + supply with renewable electricity.',metric:'Typical US commercial building over 60 yr life: 200-400 kgCO2e/m² operational carbon. 100% electric + renewable grid → <30 kgCO2e/m².'}
];
var sortedTerms=TERMS.slice().sort(function(a,b){return a.n.localeCompare(b.n);});
function renderTerms(list){
  var html='';
  list.forEach(function(t){
    var cls='c-'+t.cat;
    html+='<div class="term-card">';
    html+='<div class="term-top">';
    html+='<div><span class="term-name">'+t.n+'</span>'+(t.abbr?'<span class="term-abbr">'+t.abbr+'</span>':'')+'</div>';
    html+='<span class="cat-tag '+cls+'">'+t.cat.replace('certifications','certs').replace('materials','materials')+'</span>';
    html+='</div>';
    html+='<div class="term-def">'+t.def+'</div>';
    if(t.metric)html+='<div class="term-metric">'+t.metric+'</div>';
    html+='</div>';
  });
  document.getElementById('terms-container').innerHTML=html||'';
  document.getElementById('gcnt').textContent=list.length+' terms';
  document.getElementById('no-res').style.display=list.length===0?'block':'none';
}
function filterTerms(){
  var q=document.getElementById('gsrch').value.toLowerCase();
  var cat=document.getElementById('gcat').value;
  var list=sortedTerms.filter(function(t){
    var match=true;
    if(q){var hay=(t.n+' '+(t.abbr||'')+' '+t.def+' '+(t.metric||'')).toLowerCase();match=hay.includes(q);}
    if(cat&&t.cat!==cat)match=false;
    return match;
  });
  renderTerms(list);
}
function buildAlpha(){
  var letters=[...new Set(sortedTerms.map(function(t){return t.n[0].toUpperCase();}))].sort();
  var html='<div class="alpha-nav">';
  letters.forEach(function(l){html+='<a href="#" onclick="filterAlpha(\''+l+'\');return false">'+l+'</a>';});
  html+='<a href="#" onclick="clearAlpha();return false" style="color:#555">All</a></div>';
  document.getElementById('alpha-nav-wrap').innerHTML=html;
}
function filterAlpha(l){document.getElementById('gsrch').value=l;filterTerms();}
function clearAlpha(){document.getElementById('gsrch').value='';document.getElementById('gcat').value='';filterTerms();}
buildAlpha();
renderTerms(sortedTerms);
</script>
</body>
</html>
