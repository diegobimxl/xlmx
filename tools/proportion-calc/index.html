<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proportion Calculator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Proportion Calculator</h1><p class="sub">Design — Classic Proportion Systems for Architecture</p><div class="card"><h3>Base Dimension</h3><div class="g2"><div><label>Width (any unit)</label><input type="number" id="W" value="8"></div><div><label>System</label><select id="sys"><option value="golden">Golden Ratio (1:1.618)</option><option value="root2">Root 2 (1:1.414)</option><option value="root3">Root 3 (1:1.732)</option><option value="corbusier">Le Corbusier (1:1.666)</option><option value="renaissance">Renaissance (2:3)</option></select></div></div><button onclick="calc()">Generate Proportions</button></div><div id="out"></div></div><script>const ratios={golden:1.618,root2:1.4142,root3:1.7321,corbusier:1.666,renaissance:1.5};function calc(){const W=+document.getElementById('W').value;const sys=document.getElementById('sys').value;const r=ratios[sys];const H=(W*r).toFixed(3);const steps=[];for(let i=0;i<6;i++){steps.push((W*Math.pow(r,i)).toFixed(3));}let html=`<div class="card"><h3>Proportional Series</h3><div class="g2"><div class="res"><div class="rl">Width</div><div class="rv">${W}</div></div><div class="res"><div class="rl">Height</div><div class="rv">${H}</div></div></div><p style="font-size:.8rem;color:var(--mu);margin:.75rem 0 .3rem;text-transform:uppercase">Harmonic Series</p><div style="display:flex;flex-wrap:wrap;gap:.4rem">`;steps.forEach((s,i)=>{html+=`<div style="background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:5px;padding:.3rem .6rem;font-size:.88rem">n${i}: ${s}</div>`;});html+='</div></div>';document.getElementById('out').innerHTML=html;}</script></body></html>
