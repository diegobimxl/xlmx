<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molar Mass Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e5e5e5;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:24px 16px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.sub{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:600;color:#ec4899;margin-bottom:14px}
label{display:block;font-size:.8rem;color:#aaa;margin-bottom:4px;margin-top:10px}
input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e5e5e5;padding:8px 10px;font-size:.9rem;font-family:monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formula-display{background:#1a1a1a;border-radius:8px;padding:16px;text-align:center;margin-bottom:12px}
.formula-display .formula{font-size:1.4rem;font-weight:700;color:#ec4899;letter-spacing:.05em}
.formula-display .mass{font-size:2rem;font-weight:800;color:#e5e5e5;margin-top:8px}
.formula-display .unit{font-size:.85rem;color:#888}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th{text-align:left;color:#888;padding:6px 8px;border-bottom:1px solid #222}
td{padding:6px 8px;border-bottom:1px solid #1a1a1a}
.element-chip{display:inline-block;padding:2px 8px;background:#1a1a1a;border:1px solid #ec4899;border-radius:10px;font-size:.8rem;color:#ec4899;margin:2px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.preset{background:#1a1a1a;border:1px solid #333;color:#aaa;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.78rem}
.preset:hover{border-color:#ec4899;color:#ec4899}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#1a1a1a;border-radius:8px;padding:10px;text-align:center}
.stat .v{font-size:1.1rem;font-weight:700;color:#ec4899}
.stat .l{font-size:.72rem;color:#888;margin-top:3px}
</style>
</head>
<body>
<h1>Molar Mass Calculator</h1>
<p class="sub">Molecular weight from chemical formula + stoichiometry conversions</p>

<div class="card">
  <h2>Chemical Formula</h2>
  <label>Enter formula</label>
  <input type="text" id="formula" value="H2O" placeholder="e.g. H2O, NaCl, C6H12O6, Ca(OH)2" oninput="calc()">
  <div class="presets">
    <button class="preset" onclick="setF('H2O')">H₂O</button>
    <button class="preset" onclick="setF('NaCl')">NaCl</button>
    <button class="preset" onclick="setF('CO2')">CO₂</button>
    <button class="preset" onclick="setF('C6H12O6')">Glucose</button>
    <button class="preset" onclick="setF('C2H5OH')">Ethanol</button>
    <button class="preset" onclick="setF('Ca(OH)2')">Ca(OH)₂</button>
    <button class="preset" onclick="setF('H2SO4')">H₂SO₄</button>
    <button class="preset" onclick="setF('CaCO3')">CaCO₃</button>
    <button class="preset" onclick="setF('Fe2O3')">Fe₂O₃</button>
    <button class="preset" onclick="setF('NH3')">NH₃</button>
  </div>
</div>

<div class="card">
  <h2>Result</h2>
  <div class="formula-display">
    <div class="formula" id="fDisplay">H₂O</div>
    <div class="mass" id="massDisplay">--</div>
    <div class="unit">g/mol</div>
  </div>
  <div id="elemTable"></div>
</div>

<div class="card">
  <h2>Conversions</h2>
  <div class="row2">
    <div><label>Amount (grams)</label><input type="number" id="grams" value="18" step="any" oninput="calcConv()"></div>
    <div><label>Amount (moles)</label><input type="number" id="moles" value="1" step="any" oninput="calcConvMol()"></div>
  </div>
  <div class="row3" style="margin-top:10px">
    <div class="stat"><div class="v" id="c_mol">--</div><div class="l">Moles</div></div>
    <div class="stat"><div class="v" id="c_mol2g">--</div><div class="l">Grams (from mol)</div></div>
    <div class="stat"><div class="v" id="c_atoms">--</div><div class="l">Molecules (×10²³)</div></div>
  </div>
</div>

<script>
const ELEMENTS={
  H:1.008,He:4.003,Li:6.941,Be:9.012,B:10.811,C:12.011,N:14.007,O:15.999,F:18.998,Ne:20.180,
  Na:22.990,Mg:24.305,Al:26.982,Si:28.086,P:30.974,S:32.065,Cl:35.453,Ar:39.948,K:39.098,Ca:40.078,
  Sc:44.956,Ti:47.867,V:50.942,Cr:51.996,Mn:54.938,Fe:55.845,Co:58.933,Ni:58.693,Cu:63.546,Zn:65.38,
  Ga:69.723,Ge:72.630,As:74.922,Se:78.971,Br:79.904,Kr:83.798,Rb:85.468,Sr:87.620,Y:88.906,Zr:91.224,
  Ag:107.868,Sn:118.710,I:126.904,Ba:137.327,Au:196.967,Hg:200.592,Pb:207.200,
};
let molarMass=18.015;
function setF(f){document.getElementById('formula').value=f;calc();}
function parseFormula(f){
  // Recursive parser supporting parentheses
  function parse(s,i){
    let result={};
    while(i<s.length){
      if(s[i]==='('){
        const [inner,ni]=parse(s,i+1);
        i=ni+1; // skip ')'
        let numStr='';
        while(i<s.length&&/\d/.test(s[i]))numStr+=s[i++];
        const n=parseInt(numStr)||1;
        for(const el in inner)(result[el]=(result[el]||0)+inner[el]*n);
      }else if(s[i]===')'){return[result,i];}
      else if(/[A-Z]/.test(s[i])){
        let el=s[i++];
        while(i<s.length&&/[a-z]/.test(s[i]))el+=s[i++];
        let numStr='';
        while(i<s.length&&/\d/.test(s[i]))numStr+=s[i++];
        const n=parseInt(numStr)||1;
        result[el]=(result[el]||0)+n;
      }else i++;
    }
    return[result,i];
  }
  const [comp]=parse(f,0);
  return comp;
}
function toSubscript(s){
  return s.replace(/(\d+)/g,n=>[...n].map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join(''));
}
function calc(){
  const f=document.getElementById('formula').value.trim();
  if(!f)return;
  let comp;
  try{comp=parseFormula(f);}catch(e){document.getElementById('massDisplay').textContent='Error';return;}
  let mass=0,rows='<tr><th>Element</th><th>Symbol</th><th>Count</th><th>Atomic Mass</th><th>Contribution</th><th>%</th></tr>';
  const contributions={};
  for(const el in comp){
    const aw=ELEMENTS[el];
    if(!aw){rows+=`<tr><td colspan="6" style="color:#ef4444">Unknown element: ${el}</td></tr>`;continue;}
    contributions[el]=(aw*comp[el]);
    mass+=contributions[el];
  }
  molarMass=mass;
  document.getElementById('fDisplay').textContent=toSubscript(f);
  document.getElementById('massDisplay').textContent=mass.toFixed(4);
  for(const el in comp){
    const aw=ELEMENTS[el];
    if(!aw)continue;
    const pct=(contributions[el]/mass*100).toFixed(2);
    rows+=`<tr>
      <td>${el}</td><td><span class="element-chip">${el}</span></td>
      <td>${comp[el]}</td><td>${aw.toFixed(4)}</td>
      <td>${contributions[el].toFixed(4)}</td><td>${pct}%</td>
    </tr>`;
  }
  rows+=`<tr style="font-weight:700;color:#ec4899"><td colspan="3">Total</td><td></td><td>${mass.toFixed(4)}</td><td>100%</td></tr>`;
  document.getElementById('elemTable').innerHTML=`<table>${rows}</table>`;
  calcConv();
}
function calcConv(){
  const g=parseFloat(document.getElementById('grams').value)||0;
  const mol=g/molarMass;
  document.getElementById('c_mol').textContent=mol.toFixed(6);
  document.getElementById('c_atoms').textContent=(mol*6.022).toFixed(4);
  document.getElementById('moles').value=mol.toFixed(6);
  document.getElementById('c_mol2g').textContent=(mol*molarMass).toFixed(4);
}
function calcConvMol(){
  const mol=parseFloat(document.getElementById('moles').value)||0;
  const g=mol*molarMass;
  document.getElementById('grams').value=g.toFixed(6);
  document.getElementById('c_mol').textContent=mol.toFixed(6);
  document.getElementById('c_mol2g').textContent=g.toFixed(4);
  document.getElementById('c_atoms').textContent=(mol*6.022).toFixed(4);
}
calc();
</script>
</body>
</html>
