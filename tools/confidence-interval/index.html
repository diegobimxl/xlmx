<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confidence Interval Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e5e5e5;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:24px 16px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.sub{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:600;color:#8b5cf6;margin-bottom:14px}
label{display:block;font-size:.8rem;color:#aaa;margin-bottom:4px;margin-top:10px}
input,select,textarea{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e5e5e5;padding:8px 10px;font-size:.9rem}
textarea{resize:vertical;min-height:80px;font-family:monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:8px;background:#1a1a1a;border:1px solid #333;border-radius:6px;text-align:center;cursor:pointer;font-size:.85rem;transition:all .2s}
.tab.active{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.pane{display:none}.pane.active{display:block}
.result-box{background:#1a1a1a;border-radius:10px;padding:20px;text-align:center;margin-top:12px}
.ci-bar{position:relative;height:40px;background:#222;border-radius:6px;margin:16px 0;overflow:visible}
.ci-fill{position:absolute;top:8px;height:24px;background:rgba(139,92,246,.3);border:2px solid #8b5cf6;border-radius:4px;transition:all .4s}
.ci-mid{position:absolute;top:4px;width:3px;height:32px;background:#8b5cf6;border-radius:2px;transform:translateX(-50%)}
.big{font-size:1.6rem;font-weight:800;color:#8b5cf6}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stat{background:#1a1a1a;border-radius:8px;padding:10px;text-align:center;font-size:.82rem}
.stat .v{font-size:1.1rem;font-weight:700;color:#8b5cf6}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th{text-align:left;color:#888;padding:6px 8px;border-bottom:1px solid #222}
td{padding:6px 8px;border-bottom:1px solid #1a1a1a}
</style>
</head>
<body>
<h1>Confidence Interval Calculator</h1>
<p class="sub">CI for means (z/t) and proportions</p>

<div class="card">
  <h2>Input Method</h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('summary')">Summary Stats</div>
    <div class="tab" onclick="switchTab('rawdata')">Raw Data</div>
    <div class="tab" onclick="switchTab('prop')">Proportion</div>
  </div>

  <div class="pane active" id="pane-summary">
    <div class="row2">
      <div><label>Sample mean (x̄)</label><input type="number" id="mean" value="72.4" step="any" oninput="calc()"></div>
      <div><label>Std deviation (s)</label><input type="number" id="sd" value="12.6" step="any" min="0" oninput="calc()"></div>
    </div>
    <label>Sample size (n)</label>
    <input type="number" id="n" value="45" min="2" oninput="calc()">
  </div>

  <div class="pane" id="pane-rawdata">
    <label>Data values (comma or newline separated)</label>
    <textarea id="rawdata" oninput="parseRaw()">68,72,75,69,81,74,70,73,78,66,80,71,76,77,73,69,74,82,68,75</textarea>
  </div>

  <div class="pane" id="pane-prop">
    <div class="row2">
      <div><label>Successes (x)</label><input type="number" id="px" value="37" min="0" oninput="calc()"></div>
      <div><label>Sample size (n)</label><input type="number" id="pn" value="100" min="1" oninput="calc()"></div>
    </div>
    <label>Method</label>
    <select id="pmethod" onchange="calc()">
      <option value="wilson">Wilson (recommended)</option>
      <option value="wald">Wald (normal approx)</option>
    </select>
  </div>

  <label style="margin-top:14px">Confidence level</label>
  <select id="conf" onchange="calc()">
    <option value="0.90">90%</option>
    <option value="0.95" selected>95%</option>
    <option value="0.99">99%</option>
    <option value="0.999">99.9%</option>
  </select>
</div>

<div class="card">
  <h2>Result</h2>
  <div class="result-box">
    <div class="big" id="r_ci">--</div>
    <div style="font-size:.82rem;color:#888;margin-top:4px" id="r_label">CI</div>
    <div class="ci-bar" id="ciBar">
      <div class="ci-fill" id="ciFill"></div>
      <div class="ci-mid" id="ciMid"></div>
    </div>
    <div class="row3">
      <div class="stat"><div class="v" id="r_lo">--</div><div>Lower</div></div>
      <div class="stat"><div class="v" id="r_est">--</div><div>Estimate</div></div>
      <div class="stat"><div class="v" id="r_hi">--</div><div>Upper</div></div>
    </div>
    <div style="font-size:.8rem;color:#888;margin-top:10px" id="r_margin"></div>
  </div>

  <table style="margin-top:16px">
    <tr><th>Level</th><th>Lower</th><th>Upper</th><th>Margin of Error</th></tr>
    <tbody id="ciTable"></tbody>
  </table>
</div>

<script>
let mode='summary';
function switchTab(t){
  mode=t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    const tabs=['summary','rawdata','prop'];
    el.classList.toggle('active',tabs[i]===t);
  });
  document.querySelectorAll('.pane').forEach(el=>el.classList.remove('active'));
  document.getElementById('pane-'+t).classList.add('active');
  if(t==='rawdata')parseRaw();else calc();
}
function parseRaw(){
  const raw=document.getElementById('rawdata').value;
  const vals=raw.split(/[\n,\s]+/).map(Number).filter(v=>!isNaN(v));
  if(vals.length<2)return;
  const n=vals.length;
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
  document.getElementById('mean').value=mean.toFixed(4);
  document.getElementById('sd').value=sd.toFixed(4);
  document.getElementById('n').value=n;
  calc();
}
// t-distribution inverse (approx via Hill 1970)
function tInv(p,df){
  if(df>200)return zInv(p);
  const a=0.5*(1+p);
  // Newton–Raphson is heavy; use lookup table for common values
  const TABLE={1:[6.314,12.706,63.657],2:[2.920,4.303,9.925],3:[2.353,3.182,5.841],
    4:[2.132,2.776,4.604],5:[2.015,2.571,4.032],6:[1.943,2.447,3.707],
    7:[1.895,2.365,3.499],8:[1.860,2.306,3.355],9:[1.833,2.262,3.250],
    10:[1.812,2.228,3.169],15:[1.753,2.131,2.947],20:[1.725,2.086,2.845],
    25:[1.708,2.060,2.787],30:[1.697,2.042,2.750],40:[1.684,2.021,2.704],
    60:[1.671,2.000,2.660],120:[1.658,1.980,2.617]};
  const levels=[0.90,0.95,0.99];
  const li=levels.indexOf(p);
  const keys=Object.keys(TABLE).map(Number).sort((a,b)=>a-b);
  let prev=keys[0];
  for(const k of keys){if(k>=df){const row=TABLE[k]||TABLE[prev];return li>=0?row[li]:row[1];}prev=k;}
  return li>=0?TABLE[120][li]:TABLE[120][1];
}
function zInv(p){
  const ZTABLE={0.90:1.645,0.95:1.960,0.99:2.576,0.999:3.291};
  return ZTABLE[p]||1.960;
}
function calc(){
  const conf=parseFloat(document.getElementById('conf').value)||0.95;
  const levels=[0.90,0.95,0.99,0.999];
  if(mode==='prop'){
    const x=parseFloat(document.getElementById('px').value)||0;
    const n=parseFloat(document.getElementById('pn').value)||1;
    const method=document.getElementById('pmethod').value;
    const p=x/n;
    function propCI(c){
      const z=zInv(c);
      if(method==='wilson'){
        const denom=1+z*z/n;
        const mid=(p+z*z/(2*n))/denom;
        const hw=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/denom;
        return{lo:Math.max(0,mid-hw),hi:Math.min(1,mid+hw),est:p};
      }else{
        const se=Math.sqrt(p*(1-p)/n);
        return{lo:Math.max(0,p-z*se),hi:Math.min(1,p+z*se),est:p};
      }
    }
    const r=propCI(conf);
    showResult(r,conf,true);
    const tbody=document.getElementById('ciTable');
    tbody.innerHTML=levels.map(c=>{
      const ri=propCI(c);
      return`<tr><td>${Math.round(c*100)}%</td><td>${(ri.lo*100).toFixed(2)}%</td><td>${(ri.hi*100).toFixed(2)}%</td><td>±${((ri.hi-ri.lo)/2*100).toFixed(2)}%</td></tr>`;
    }).join('');
  }else{
    const mean=parseFloat(document.getElementById('mean').value)||0;
    const sd=parseFloat(document.getElementById('sd').value)||1;
    const n=parseInt(document.getElementById('n').value)||2;
    const se=sd/Math.sqrt(n);
    function meanCI(c){
      const tc=n<30?tInv(c,n-1):zInv(c);
      const hw=tc*se;
      return{lo:mean-hw,hi:mean+hw,est:mean,hw};
    }
    const r=meanCI(conf);
    showResult(r,conf,false);
    const tbody=document.getElementById('ciTable');
    tbody.innerHTML=levels.map(c=>{
      const ri=meanCI(c);
      return`<tr><td>${Math.round(c*100)}%</td><td>${ri.lo.toFixed(4)}</td><td>${ri.hi.toFixed(4)}</td><td>±${ri.hw.toFixed(4)}</td></tr>`;
    }).join('');
  }
}
function showResult(r,conf,isProp){
  const fmt=v=>isProp?(v*100).toFixed(2)+'%':v.toFixed(4);
  const lo=r.lo,hi=r.hi,est=r.est;
  const hw=isProp?((hi-lo)/2*100).toFixed(2)+' pp':((hi-lo)/2).toFixed(4);
  document.getElementById('r_ci').textContent=`[${fmt(lo)}, ${fmt(hi)}]`;
  document.getElementById('r_label').textContent=`${Math.round(conf*100)}% Confidence Interval`;
  document.getElementById('r_lo').textContent=fmt(lo);
  document.getElementById('r_est').textContent=fmt(est);
  document.getElementById('r_hi').textContent=fmt(hi);
  document.getElementById('r_margin').textContent=`Margin of Error: ±${hw}  |  Width: ${isProp?((hi-lo)*100).toFixed(2)+'pp':((hi-lo)).toFixed(4)}`;
  // bar positioning
  const plo=10,phi=90,pmid=50;
  document.getElementById('ciFill').style.left=plo+'%';
  document.getElementById('ciFill').style.width=(phi-plo)+'%';
  document.getElementById('ciMid').style.left=pmid+'%';
}
calc();
</script>
</body>
</html>
