<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Price Normalizer - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#818cf8}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Unit Price Normalizer</h1><p class="sub">Calculators — Compare Bids Across Different Units</p><div class="card"><h3>Enter Bid Prices</h3><div id="bids"></div><button onclick="addBid()" style="background:rgba(255,255,255,.1);color:var(--tx)">+ Add Bid</button><button onclick="norm()" style="margin-left:.5rem">Normalize</button></div><div class="card"><h3>Target Unit</h3><div class="g2"><div><label>Normalize All To</label><select id="tu"><option value="SF">SF (sq ft)</option><option value="SY">SY (sq yd)</option><option value="LF">LF (lin ft)</option><option value="CY">CY (cu yd)</option><option value="EA">EA (each)</option></select></div></div></div><div id="out"></div></div><script>const conv={SF:{SF:1,SY:1/9,LF:null,CY:null,EA:null},SY:{SF:9,SY:1,LF:null,CY:null,EA:null},LF:{SF:null,SY:null,LF:1,CY:null,EA:null},CY:{SF:null,SY:null,LF:null,CY:1,EA:null},EA:{EA:1}};let bids=[];function addBid(){bids.push({});const d=document.getElementById('bids');const row=document.createElement('div');row.className='g3';row.style.marginBottom='.5rem';const idx=bids.length-1;row.innerHTML=`<input placeholder="Vendor" class="vn"><input type="number" placeholder="Price" class="vp"><select class="vu"><option>SF</option><option>SY</option><option>LF</option><option>CY</option><option>EA</option></select>`;d.appendChild(row);}function norm(){const tu=document.getElementById('tu').value;const rows=[...document.getElementById('bids').children];const data=rows.map(r=>({v:r.querySelector('.vn').value||'Vendor',p:+r.querySelector('.vp').value||0,u:r.querySelector('.vu').value}));let h='<div class="card"><h3>Normalized Prices (per '+tu+')</h3><table class="tbl"><tr><th>Vendor</th><th>Original</th><th>Per '+tu+'</th></tr>';const prices=[];data.forEach(d=>{const f=conv[d.u]?conv[d.u][tu]:null;const norm=f?d.p*f:null;prices.push(norm);h+=`<tr><td>${d.v}</td><td>$${d.p}/${d.u}</td><td>${norm!==null?'$'+norm.toFixed(2)+'/'+tu:'N/A'}</td></tr>`;});const valid=prices.filter(p=>p!==null);const low=Math.min(...valid);h+=`</table><p class="note">Lowest normalized: $${low.toFixed(2)}/${tu}</p></div>`;document.getElementById('out').innerHTML=h;}</script></body></html>
