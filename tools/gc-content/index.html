<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNA GC Content — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#34d399;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
textarea{font-family:monospace;font-size:13px;resize:vertical;}
input:focus,textarea:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:22px;font-weight:700;color:var(--acc);}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.seq-out{font-family:monospace;font-size:12px;word-break:break-all;color:#a7f3d0;background:rgba(0,0,0,.3);padding:10px;border-radius:6px;margin-top:6px;max-height:80px;overflow-y:auto;}
.g4-warn{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:10px;font-size:12px;color:#f87171;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← XLMX Tools</a>
  <h1>DNA GC Content Analyzer</h1>
  <p class="sub">Category: Genetics — Nucleotide composition, Tm, complement sequences</p>

  <div class="card">
    <label>NUCLEOTIDE SEQUENCE (paste or type, any case, spaces/numbers ignored)</label>
    <textarea id="seq" rows="5" oninput="analyze()" placeholder="e.g. ATCGATCGATCGATCG or paste a FASTA sequence...">ATCGATCGTAGCTAGCGATCGATCGATCG</textarea>
  </div>

  <div class="card">
    <div class="grid4">
      <div class="result" style="margin-top:0">
        <div class="r-label">LENGTH</div>
        <div class="r-val" id="len">—</div>
        <div style="color:var(--mu);font-size:11px">nt</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">G</div>
        <div class="r-val" id="g_cnt">—</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">C</div>
        <div class="r-val" id="c_cnt">—</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">A</div>
        <div class="r-val" id="a_cnt">—</div>
      </div>
    </div>
    <div class="grid4" style="margin-top:8px">
      <div class="result" style="margin-top:0">
        <div class="r-label">T</div>
        <div class="r-val" id="t_cnt">—</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">GC %</div>
        <div class="r-val" id="gc_pct">—</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">AT %</div>
        <div class="r-val" id="at_pct">—</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">OTHER</div>
        <div class="r-val" id="other_cnt">—</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grid2">
      <div class="result" style="margin-top:0">
        <div class="r-label">Tm ESTIMATE</div>
        <div class="r-val" id="tm">—</div>
        <div style="color:var(--mu);font-size:11px">°C</div>
      </div>
      <div class="result" style="margin-top:0">
        <div class="r-label">Tm FORMULA USED</div>
        <div class="r-val" id="tm_method" style="font-size:14px">—</div>
      </div>
    </div>
    <div id="g4_warn" style="display:none" class="g4-warn"></div>
  </div>

  <div class="card">
    <label>5'→3' INPUT SEQUENCE</label>
    <div class="seq-out" id="seq_display">—</div>
    <label>3'→5' COMPLEMENT</label>
    <div class="seq-out" id="complement">—</div>
    <label>5'→3' REVERSE COMPLEMENT</label>
    <div class="seq-out" id="rev_comp">—</div>
  </div>
</div>
<script>
const comp={A:'T',T:'A',G:'C',C:'G',N:'N'};
function analyze(){
  const raw=document.getElementById('seq').value.replace(/[^a-zA-Z]/g,'').toUpperCase();
  const G=raw.split('').filter(c=>c==='G').length;
  const C=raw.split('').filter(c=>c==='C').length;
  const A=raw.split('').filter(c=>c==='A').length;
  const T=raw.split('').filter(c=>c==='T').length;
  const n=raw.length;
  const other=n-G-C-A-T;
  const gc_pct=n>0?((G+C)/n*100):0;
  const at_pct=n>0?((A+T)/n*100):0;
  document.getElementById('len').textContent=n;
  document.getElementById('g_cnt').textContent=G;
  document.getElementById('c_cnt').textContent=C;
  document.getElementById('a_cnt').textContent=A;
  document.getElementById('t_cnt').textContent=T;
  document.getElementById('other_cnt').textContent=other;
  document.getElementById('gc_pct').textContent=gc_pct.toFixed(1)+'%';
  document.getElementById('at_pct').textContent=at_pct.toFixed(1)+'%';
  let tm, method;
  if(n<14){
    tm=2*(A+T)+4*(G+C);
    method='2(A+T)+4(G+C) rule';
  } else {
    tm=81.5+16.6*Math.log10(0.05)+0.41*gc_pct-675/n;
    method='Marmur-Schildkraut (50mM Na⁺)';
  }
  document.getElementById('tm').textContent=tm.toFixed(1);
  document.getElementById('tm_method').textContent=method;
  const compSeq=raw.split('').map(c=>comp[c]||'N').join('');
  const revComp=compSeq.split('').reverse().join('');
  document.getElementById('seq_display').textContent=raw||'—';
  document.getElementById('complement').textContent=compSeq||'—';
  document.getElementById('rev_comp').textContent=revComp||'—';
  const g4=raw.match(/G{4,}/g);
  const g4div=document.getElementById('g4_warn');
  if(g4&&g4.length>0){
    g4div.style.display='block';
    g4div.textContent=`G-quadruplex risk: ${g4.length} run(s) of 4+ consecutive G found (${g4.join(', ')}). May form secondary G4 structures.`;
  } else {
    g4div.style.display='none';
  }
}
analyze();
</script>
</body>
</html>
