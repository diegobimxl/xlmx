<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debt Service Calculator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#c8a96e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Debt Service Calculator</h1><p class="sub">Real Estate & Development — Loan Amortization</p><div class="card"><h3>Loan Parameters</h3><div class="g3"><div><label>Loan Amount ($)</label><input type="number" id="loan" value="700000"></div><div><label>Annual Rate (%)</label><input type="number" id="rate" value="6.5" step="0.1"></div><div><label>Term (years)</label><input type="number" id="term" value="30"></div></div><div class="g2"><div><label>IO Period (years)</label><input type="number" id="io" value="0" min="0"></div><div><label>Payments/Year</label><select id="freq"><option value="12">Monthly</option><option value="4">Quarterly</option><option value="1">Annual</option></select></div></div><button onclick="calc()">Calculate</button></div><div class="card"><h3>Results</h3><div class="g3"><div class="res"><div class="rl">Payment</div><div class="rv" id="pmt">-</div></div><div class="res"><div class="rl">Annual DS</div><div class="rv" id="ads">-</div></div><div class="res"><div class="rl">Total Interest</div><div class="rv" id="tint">-</div></div></div></div></div><script>function fmt(n){return '$'+Math.round(n).toLocaleString();}function calc(){const P=parseFloat(document.getElementById('loan').value);const r=parseFloat(document.getElementById('rate').value)/100;const n=parseInt(document.getElementById('term').value);const io=parseInt(document.getElementById('io').value);const freq=parseInt(document.getElementById('freq').value);const rp=r/freq;const np=n*freq;const pmt=rp===0?P/np:P*rp*Math.pow(1+rp,np)/(Math.pow(1+rp,np)-1);const ioPmt=P*rp;const display=io>0?ioPmt:pmt;const ads=display*freq;const total=io>0?(ioPmt*io*freq)+(pmt*(n-io)*freq):pmt*np;document.getElementById('pmt').textContent=fmt(display);document.getElementById('ads').textContent=fmt(ads);document.getElementById('tint').textContent=fmt(total-P);}</script></body></html>
