<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concrete Mix Design | XLMX</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100vh}.topbar{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px}.topbar a{color:#c8a96e;text-decoration:none;font-size:14px}.topbar h1{font-size:16px;font-weight:600;color:#fff}.container{max-width:900px;margin:0 auto;padding:24px 16px}.subtitle{color:#888;font-size:13px;margin-bottom:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}.card{background:#111;border:1px solid #222;border-radius:8px;padding:20px}.card h2{font-size:14px;font-weight:600;color:#c8a96e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}label{display:block;font-size:12px;color:#aaa;margin-bottom:4px;margin-top:12px}label:first-of-type{margin-top:0}input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:4px;padding:8px 10px;color:#e8e8e8;font-size:13px}input:focus,select:focus{outline:none;border-color:#c8a96e}.btn{background:#c8a96e;color:#0d0d0d;border:none;border-radius:4px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e1e1e;font-size:13px}.result-row:last-child{border-bottom:none}.result-val{color:#c8a96e;font-weight:600}.shdr{font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}.pbar{height:18px;border-radius:3px;margin-bottom:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#0d0d0d}.ref{font-size:11px;color:#555;margin-top:8px;font-style:italic}.iwarn{background:#1a1500;border:1px solid #3a3000;border-radius:4px;padding:10px;font-size:12px;color:#c8a96e;margin-top:12px}</style></head><body><div class="topbar"><a href="/tools/">&#8592; Tools</a><h1>Concrete Mix Design</h1></div><div class="container"><p class="subtitle">ACI 211.1 absolute volume method - proportion cement, water, fine and coarse aggregate per strength class</p><div class="grid2"><div class="card"><h2>Design Parameters</h2><label>Required f'c (psi)</label><select id="fc_sel"><option value="3000">3,000 psi</option><option value="4000" selected>4,000 psi</option><option value="5000">5,000 psi</option><option value="6000">6,000 psi</option><option value="8000">8,000 psi</option></select><label>Exposure Condition</label><select id="exp_sel"><option value="mild" selected>Mild (interior)</option><option value="moderate">Moderate (F-T cycles)</option><option value="severe">Severe (deicers/seawater)</option></select><label>Max Aggregate Size (in)</label><select id="agg_sel"><option value="0.375">3/8"</option><option value="0.5">1/2"</option><option value="0.75" selected>3/4"</option><option value="1">1"</option><option value="1.5">1.5"</option></select><label>Slump (in)</label><select id="slump_sel"><option value="2">2" stiff</option><option value="3">3" medium</option><option value="4" selected>4" plastic</option><option value="6">6" fluid/pumped</option></select><label>Coarse Agg Dry-Rodded Unit Wt (pcf)</label><input id="aggwt" type="number" value="100" step="1"><label>Fine Agg Fineness Modulus</label><input id="FM" type="number" value="2.8" step="0.1"><label>Batch Size (CY)</label><input id="batch" type="number" value="1" step="0.5"><button class="btn" onclick="calcMix()">Calculate Mix</button></div><div class="card"><h2>Mix Proportions</h2><div id="mix_out"><p style="color:#555;font-size:13px">Enter parameters and calculate.</p></div><p class="ref">ACI 211.1 absolute volume. W/C from Table 6.3.4. Air from Table 6.3.3. f'cr = f'c + 1340 psi.</p></div></div></div><script>var WC={3000:0.68,4000:0.57,5000:0.48,6000:0.41,8000:0.33};var WE={mild:0.70,moderate:0.50,severe:0.45};var WTR={"2":{"0.375":340,"0.5":325,"0.75":305,"1":295,"1.5":275},"3":{"0.375":350,"0.5":335,"0.75":315,"1":300,"1.5":285},"4":{"0.375":365,"0.5":350,"0.75":330,"1":315,"1.5":300},"6":{"0.375":385,"0.5":370,"0.75":350,"1":335,"1.5":315}};var AIR={mild:{"0.375":3,"0.5":2.5,"0.75":2,"1":1.5,"1.5":1},moderate:{"0.375":6,"0.5":5.5,"0.75":5,"1":4.5,"1.5":4},severe:{"0.375":7.5,"0.5":7,"0.75":6,"1":6,"1.5":5.5}};var VCA={"2.4":{"0.375":0.50,"0.5":0.59,"0.75":0.66,"1":0.71,"1.5":0.76},"2.6":{"0.375":0.48,"0.5":0.57,"0.75":0.64,"1":0.69,"1.5":0.74},"2.8":{"0.375":0.46,"0.5":0.55,"0.75":0.62,"1":0.67,"1.5":0.72},"3.0":{"0.375":0.44,"0.5":0.53,"0.75":0.60,"1":0.65,"1.5":0.70}};function nFM(v){var k=[2.4,2.6,2.8,3.0];return k.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a).toFixed(1);}function row(l,v,u){return '<div class="result-row"><span>'+l+'</span><span class="result-val">'+v+' <small style="color:#888">'+u+'</small></span></div>';}function calcMix(){var fc=+document.getElementById("fc_sel").value;var exp=document.getElementById("exp_sel").value;var agg=document.getElementById("agg_sel").value;var sl=document.getElementById("slump_sel").value;var aw=+document.getElementById("aggwt").value;var FM=+document.getElementById("FM").value;var ba=+document.getElementById("batch").value;var fcr=fc+1340;var wcS=WC[fc]||0.50; var wcE=WE[exp]; var wc=Math.min(wcS,wcE);var air=(AIR[exp][agg]||3)/100;var water=WTR[sl][agg]||315;var cem=water/wc;var fk=nFM(FM); var vcaf=VCA[fk][agg]||0.62;var vtCA=vcaf*27; var wtCA=vtCA*aw;var vCem=cem/(3.15*62.4); var vWtr=water/62.4; var vAir=air*27;var vCA=wtCA/(2.68*62.4); var vFin=27-vCem-vWtr-vAir-vCA;var wtFin=vFin*2.65*62.4; var uw=(cem+water+wtCA+wtFin)/27;var html=row("Target f'cr",fcr.toFixed(0),"psi")+row("W/C ratio",wc.toFixed(3),"")+row("Air content",(air*100).toFixed(1),"%")+row("Unit weight",uw.toFixed(0),"pcf");html+='<div class="shdr">Materials per '+ba+' CY</div>';html+=row("Cement",(cem*ba).toFixed(0),"lbs")+row("Water",(water*ba).toFixed(0),"lbs")+row("Coarse Agg",(wtCA*ba).toFixed(0),"lbs")+row("Fine Agg",(wtFin*ba).toFixed(0),"lbs")+row("Total",(uw*27*ba).toFixed(0),"lbs");var tot=cem+water+wtCA+wtFin;var its=[["Cement",cem,"#c8a96e"],["Water",water,"#4e7bd4"],["Coarse",wtCA,"#5bc97d"],["Fine",wtFin,"#e07b54"]];html+='<div class="shdr">Proportions by Weight</div>';its.forEach(function(it){var p=it[1]/tot*100;html+='<div style="font-size:11px;color:#aaa;margin-bottom:2px">'+it[0]+' '+p.toFixed(1)+'%</div><div class="pbar" style="width:'+p.toFixed(0)+'%;min-width:4px;background:'+it[2]+'">'+( p>8?it[0]:"" )+'</div>';});html+='<div class="iwarn">ACI 211.1 preliminary mix. Trial batches required. Adjust for SG, absorption, and free moisture.</div>';document.getElementById("mix_out").innerHTML=html;}<\/script><\/body><\/html>
