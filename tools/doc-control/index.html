<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Control Log - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Document Control Log</h1><p class="sub">Project Management — Drawing Revisions and Distribution</p><div class="card"><h3>Add Document</h3><div class="g2"><div><label>Doc Number</label><input type="text" id="dn" placeholder="A-101"></div><div><label>Title</label><input type="text" id="dt" placeholder="Floor Plan - Level 1"></div><div><label>Revision</label><input type="text" id="rev" value="0"></div><div><label>Issue Date</label><input type="date" id="dt2"></div><div><label>Issued By</label><input type="text" id="by" placeholder="BIM XL"></div><div><label>Status</label><select id="st"><option>For Construction</option><option>For Review</option><option>Issued for Bid</option><option>As-Built</option><option>Superseded</option></select></div></div><button onclick="add()">Add Doc</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Document Register</h3><div id="dr"><p style="color:var(--mu);font-size:.85rem">No documents logged.</p></div></div></div><script>let docs=[];function add(){docs.push({dn:document.getElementById('dn').value||'—',dt:document.getElementById('dt').value||'—',rev:document.getElementById('rev').value||'0',date:document.getElementById('dt2').value||'—',by:document.getElementById('by').value||'—',st:document.getElementById('st').value});render();}function clr(){docs=[];render();}function render(){if(!docs.length){document.getElementById('dr').innerHTML='<p style="color:var(--mu);font-size:.85rem">No documents logged.</p>';return;}let h='<table class="tbl"><tr><th>Doc No.</th><th>Title</th><th>Rev</th><th>Date</th><th>By</th><th>Status</th></tr>';docs.forEach(d=>{const sc=d.st==='Superseded'?'opacity:.4':'';h+=`<tr style="${sc}"><td>${d.dn}</td><td>${d.dt}</td><td>${d.rev}</td><td>${d.date}</td><td>${d.by}</td><td style="font-size:.8rem">${d.st}</td></tr>`;});h+='</table>';document.getElementById('dr').innerHTML=h;}</script></body></html>
