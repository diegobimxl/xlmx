<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gunning Fog Index — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f97316;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
btn,button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Gunning Fog Index</h1>
  <p class="sub">Journalism — Readability and complexity scorer</p>
  <div class="card">
    <label>PASTE TEXT SAMPLE (100–300 words recommended)</label>
    <textarea id="txt" rows="8" placeholder="Paste article or press release here..." oninput="calc()"></textarea>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">FOG INDEX</div>
        <div class="r-val" id="fog">—</div>
      </div>
      <div class="result">
        <div class="r-label">GRADE LEVEL</div>
        <div class="r-val" id="grade">—</div>
      </div>
      <div class="result">
        <div class="r-label">WORD COUNT</div>
        <div class="r-val" id="wc">—</div>
      </div>
    </div>
    <div class="result" style="margin-top:12px;">
      <div class="r-label">COMPLEX WORDS (3+ syllables, sample)</div>
      <div id="complex" style="font-size:13px;color:var(--acc);line-height:1.8;margin-top:4px;"></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function syllables(w){
  w=w.toLowerCase().replace(/[^a-z]/g,'');
  if(w.length<=3)return 1;
  const m=w.match(/[aeiouy]{1,2}/g);
  let n=m?m.length:1;
  if(w.endsWith('e')&&w.length>3)n--;
  return Math.max(1,n);
}
function calc(){
  const txt=document.getElementById('txt').value.trim();
  if(txt.length<20){
    ['fog','grade','wc'].forEach(id=>document.getElementById(id).textContent='—');
    return;
  }
  const sentences=(txt.match(/[.!?]+/g)||[]).length||1;
  const words=txt.split(/\s+/).filter(w=>w.length>0);
  const wc=words.length;
  const complex=words.filter(w=>syllables(w)>=3&&!/(?:tion|ing|ed|es)$/.test(w.toLowerCase())||syllables(w)>=4);
  const fog=0.4*((wc/sentences)+(100*complex.length/wc));
  const gl=Math.min(20,Math.round(fog));
  document.getElementById('fog').textContent=fog.toFixed(1);
  document.getElementById('grade').textContent='~'+gl;
  document.getElementById('wc').textContent=wc;
  const ex=[...new Set(complex.map(w=>w.toLowerCase().replace(/[^a-z]/g,'')))].slice(0,12).join(', ');
  document.getElementById('complex').textContent=ex||'None found';
  const levels=fog<6?'Very Easy (comic books)':fog<8?'Easy (popular fiction)':fog<10?'Ideal (newspapers)':fog<12?'Acceptable (high school)':fog<14?'Difficult (college)':fog<17?'Very Difficult (academic)':'Extremely Dense (specialist)';
  document.getElementById('note').textContent=`Fog index ${fog.toFixed(1)} = ${levels}. Target for mass-market journalism: 8–10. ${complex.length} complex words in ${wc} total (${((complex.length/wc)*100).toFixed(1)}%). Avg sentence length: ${(wc/sentences).toFixed(1)} words.`;
}
</script>
</body>
</html>
