<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Minutes Generator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Meeting Minutes Generator</h1><p class="sub">Project Management — Structured Minutes with Action Items</p><div class="card"><h3>Meeting Info</h3><div class="g2"><div><label>Project</label><input type="text" id="proj" placeholder="Miravalle T2"></div><div><label>Date</label><input type="date" id="dt"></div><div><label>Attendees (comma separated)</label><input type="text" id="att" placeholder="Diego, Valeria, Adair"></div><div><label>Facilitator</label><input type="text" id="fac" placeholder="Diego R."></div></div></div><div class="card"><h3>Discussion Items</h3><textarea id="disc" placeholder="1. BIM coordination status&#10;2. RFI backlog review&#10;3. Schedule updates"></textarea></div><div class="card"><h3>Action Items</h3><div id="actions"><div class="g3" style="margin-bottom:.5rem"><input placeholder="Action" class="ai"><input placeholder="Owner" class="ao"><input type="date" class="ad"></div></div><button onclick="addAction()" style="background:rgba(255,255,255,.1);color:var(--tx)">+ Add Action</button><button onclick="gen()" style="margin-left:.5rem">Generate Minutes</button></div><div id="out"></div></div><script>function addAction(){const d=document.getElementById('actions');const r=document.createElement('div');r.className='g3';r.style.marginBottom='.5rem';r.innerHTML='<input placeholder="Action" class="ai"><input placeholder="Owner" class="ao"><input type="date" class="ad">';d.appendChild(r);}function gen(){const proj=document.getElementById('proj').value||'Project';const dt=document.getElementById('dt').value||new Date().toISOString().slice(0,10);const att=document.getElementById('att').value||'—';const fac=document.getElementById('fac').value||'—';const disc=document.getElementById('disc').value||'';const ais=[...document.querySelectorAll('.ai')];const aos=[...document.querySelectorAll('.ao')];const ads=[...document.querySelectorAll('.ad')];let aiRows='';ais.forEach((a,i)=>{if(a.value)aiRows+=`<tr><td>${a.value}</td><td>${aos[i]?.value||'—'}</td><td>${ads[i]?.value||'TBD'}</td></tr>`;});const items=disc.split('
').filter(Boolean).map(l=>`<li style="margin-bottom:.3rem">${l.replace(/^\d+\.\s*/,'')}</li>`).join('');document.getElementById('out').innerHTML=`<div class="card"><h3>Minutes</h3><p style="margin-bottom:.5rem"><b>Project:</b> ${proj} &nbsp;|&nbsp; <b>Date:</b> ${dt} &nbsp;|&nbsp; <b>Facilitator:</b> ${fac}</p><p style="margin-bottom:.5rem"><b>Attendees:</b> ${att}</p><hr style="border-color:var(--bd);margin:.75rem 0"><p style="font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem">Discussion</p><ul style="padding-left:1.2rem;font-size:.9rem">${items}</ul><p style="font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:.75rem 0 .4rem">Action Items</p><table class="tbl"><tr><th>Action</th><th>Owner</th><th>Due</th></tr>${aiRows||'<tr><td colspan=3 style="color:var(--mu)">None recorded</td></tr>'}</table></div>`;}</script></body></html>
