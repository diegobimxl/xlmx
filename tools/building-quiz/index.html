<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Blindspot Quiz - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#facc15}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Building Blindspot Quiz</h1><p class="sub">Leisure — Guess Famous Buildings from Descriptions</p><div class="card"><h3>Building Quiz</h3><div id="qz"></div></div></div><script>const qs=[{q:"This 828m tower in Dubai held the world record for tallest building.",a:"Burj Khalifa",opts:["Burj Khalifa","CN Tower","Shanghai Tower","One World Trade"]},{q:"Zaha Hadid's first major building — the fire station at a furniture company campus in Germany.",a:"Vitra Fire Station",opts:["MAXXI Museum","Vitra Fire Station","Heydar Aliyev","Rosenthal Center"]},{q:"Tadao Ando's masterpiece: a church in Osaka where the altar is framed by a concrete cross of light.",a:"Church of Light",opts:["Church of Light","Chichu Museum","Chapel on Water","4x4 House"]},{q:"The inverted ziggurat by Frank Lloyd Wright in New York City.",a:"Guggenheim NYC",opts:["Guggenheim NYC","Fallingwater","Johnson Wax","Price Tower"]},{q:"Jorn Utzon's iconic shells overlooking Sydney Harbour, completed in 1973.",a:"Sydney Opera House",opts:["Sydney Opera House","Myer Centre","Capitol Theatre","Darling Harbour"]},{q:"Renzo Piano and Richard Rogers' inside-out building in Paris with exposed ducts.",a:"Centre Pompidou",opts:["Centre Pompidou","Louvre Pyramid","Tour Montparnasse","Grande Arche"]},{q:"The tilting tower in Pisa, Italy — an accidental architectural icon.",a:"Tower of Pisa",opts:["Tower of Pisa","Campanile di Giotto","Duomo Santa Maria","San Miniato"]},{q:"Le Corbusier's housing block — a 'radiant city' built as a single self-contained building.",a:"Unite d'Habitation",opts:["Unite d'Habitation","Villa Savoye","Ronchamp","Chandigarh"]}];let idx=0,score=0,answered=false;function render(){const q=qs[idx];let html=`<p style="font-size:.82rem;color:var(--mu);margin-bottom:.5rem">Question ${idx+1} of ${qs.length} | Score: ${score}</p><p style="font-size:.95rem;margin-bottom:.75rem">${q.q}</p><div style="display:flex;flex-direction:column;gap:.4rem">`;q.opts.forEach(o=>{html+=`<button onclick="ans('${o.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}',this)" style="text-align:left;background:rgba(255,255,255,.06);color:var(--tx);border-radius:6px;padding:.5rem .75rem;font-weight:400">${o}</button>`;});html+=`</div>`;document.getElementById('qz').innerHTML=html;}function ans(chosen,correct,btn){if(answered)return;answered=true;if(chosen===correct){score++;btn.style.background='#22c55e';btn.style.color='#000';}else{btn.style.background='#ef4444';btn.style.color='#fff';document.querySelectorAll('#qz button').forEach(b=>{if(b.textContent===correct){b.style.background='#22c55e';b.style.color='#000';}});}setTimeout(()=>{idx++;answered=false;if(idx<qs.length)render();else document.getElementById('qz').innerHTML=`<p style="text-align:center;font-size:1.2rem;font-weight:700">Final Score: ${score} / ${qs.length}</p><button onclick="idx=0;score=0;render()" style="margin:auto;display:block;margin-top:.75rem">Play Again</button>`;},1200);}render();</script></body></html>
