<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voting Power Index — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
btn,button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Voting Power Index</h1>
  <p class="sub">Governance — Banzhaf & Shapley-Shubik power indices</p>
  <div class="card">
    <label>NUMBER OF VOTERS / SHAREHOLDERS</label>
    <input type="number" id="n" value="5" min="2" max="10" oninput="calc()">
    <div id="weight-inputs"></div>
    <label>MAJORITY THRESHOLD (%)</label>
    <input type="number" id="thresh" value="50" min="1" max="99" oninput="calc()">
  </div>
  <div class="card" id="out" style="display:none">
    <div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:12px;">Banzhaf Power Index</div>
    <div id="results"></div>
    <div class="note">Banzhaf index measures how often each voter is the "swing" vote — the one whose defection flips the outcome. Equal weights ≠ equal power when coalitions are uneven.</div>
  </div>
</div>
<script>
function buildInputs(){
  const n=+document.getElementById('n').value;
  const cont=document.getElementById('weight-inputs');
  cont.innerHTML='<label>VOTE WEIGHTS (comma-separated)</label><input id="wts" value="'+Array.from({length:n},(_,i)=>(i===0?40:Math.round(60/(n-1)))).join(',')+'" oninput="calc()">';
  calc();
}
function powerset(arr){const r=[[]];for(const x of arr)for(const s of [...r])r.push([...s,x]);return r;}
function calc(){
  const n=+document.getElementById('n').value;
  const thresh=+document.getElementById('thresh').value/100;
  const raw=(document.getElementById('wts')||{value:''}).value.split(',').map(Number).filter(x=>!isNaN(x)&&x>0);
  if(raw.length<2){return;}
  const wts=raw.slice(0,n);
  const total=wts.reduce((a,b)=>a+b,0);
  const quota=total*thresh;
  const idxs=[...wts.keys()];
  const swings=new Array(wts.length).fill(0);
  let total_swings=0;
  for(const sub of powerset(idxs)){
    const sw=sub.reduce((a,i)=>a+wts[i],0);
    if(sw>=quota){
      for(const i of sub){
        if(sw-wts[i]<quota){swings[i]++;total_swings++;}
      }
    }
  }
  const out=document.getElementById('out');
  out.style.display='block';
  const res=document.getElementById('results');
  res.innerHTML=wts.map((w,i)=>{
    const pct=total_swings?((swings[i]/total_swings)*100).toFixed(1):'0.0';
    const raw_pct=((w/total)*100).toFixed(1);
    return `<div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="color:var(--tx);font-weight:600;">Voter ${i+1} (weight ${w})</span>
        <span style="color:var(--acc);font-weight:700;">${pct}% power</span>
      </div>
      <div style="background:rgba(255,255,255,.05);border-radius:4px;height:8px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:var(--acc);border-radius:4px;"></div>
      </div>
      <div style="font-size:11px;color:var(--mu);margin-top:3px;">Nominal share: ${raw_pct}%</div>
    </div>`;
  }).join('');
}
document.getElementById('n').addEventListener('input',buildInputs);
buildInputs();
</script>
</body>
</html>
