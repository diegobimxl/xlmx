<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture Word Search - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#facc15}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Architecture Word Search</h1><p class="sub">Leisure — Hidden Terms from Architecture and Design</p><div class="card"><h3>Architecture Word Search</h3><div id="ws"></div><div id="found" style="margin-top:.75rem;font-size:.85rem;color:var(--mu)"></div></div></div><script>const WORDS=['REVIT','FACADE','ATRIUM','CORNICE','PARAPET','SOFFIT','PILASTER','DATUM','MODULE','PLENUM'];const SIZE=12;let grid=[],found=new Set(),cells=[];function make(){grid=Array.from({length:SIZE},()=>Array(SIZE).fill(''));const placed=[];WORDS.forEach(w=>{let ok=false;for(let t=0;t<200&&!ok;t++){const dir=Math.random()<0.5?[0,1]:[1,0];const r=Math.floor(Math.random()*(SIZE-w.length*dir[0]));const c=Math.floor(Math.random()*(SIZE-w.length*dir[1]));let can=true;for(let i=0;i<w.length;i++){const ch=grid[r+i*dir[0]][c+i*dir[1]];if(ch&&ch!==w[i]){can=false;break;}}if(can){for(let i=0;i<w.length;i++)grid[r+i*dir[0]][c+i*dir[1]]=w[i];placed.push({w,r,c,dir});ok=true;}}});for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])grid[r][c]='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.floor(Math.random()*26));return placed;}function render(placed){const ws=document.getElementById('ws');ws.innerHTML='';const tbl=document.createElement('div');tbl.style.cssText='display:grid;grid-template-columns:repeat('+SIZE+',1fr);gap:2px;margin-bottom:.75rem;max-width:360px';grid.forEach((row,r)=>row.forEach((ch,c)=>{const cell=document.createElement('div');cell.textContent=ch;cell.style.cssText='width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;cursor:pointer;border-radius:4px;background:rgba(255,255,255,.04);color:var(--tx)';cell.dataset.r=r;cell.dataset.c=c;cells.push(cell);tbl.appendChild(cell);}));ws.appendChild(tbl);const wlist=document.createElement('div');wlist.style.cssText='display:flex;flex-wrap:wrap;gap:.4rem';WORDS.forEach(w=>{const tag=document.createElement('span');tag.id='w-'+w;tag.textContent=w;tag.style.cssText='font-size:.78rem;padding:.2rem .5rem;border-radius:4px;background:rgba(255,255,255,.06);color:var(--mu)';wlist.appendChild(tag);});ws.appendChild(wlist);}function init(){found=new Set();cells=[];const placed=make();render(placed);}function checkWord(r,c,placed){placed.forEach(p=>{let match=true;for(let i=0;i<p.w.length;i++){if(r===(p.r+i*p.dir[0])&&c===(p.c+i*p.dir[1]))return;}});}init();</script></body></html>
