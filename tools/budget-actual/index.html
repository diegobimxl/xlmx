<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget vs Actual Tracker - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Budget vs Actual Tracker</h1><p class="sub">Project Management — Cost Codes with Variance</p><div class="card"><h3>Add Cost Code</h3><div class="g2"><div><label>Cost Code / Description</label><input type="text" id="cc" placeholder="03000 - Concrete"></div><div><label>Budget ($)</label><input type="number" id="bud" value="0"></div><div><label>Committed ($)</label><input type="number" id="com" value="0"></div><div><label>Actual to Date ($)</label><input type="number" id="act" value="0"></div></div><button onclick="add()">Add Line</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Budget Summary</h3><div id="bs"><p style="color:var(--mu);font-size:.85rem">No cost codes added yet.</p></div></div></div><script>let lines=[];function add(){lines.push({cc:document.getElementById('cc').value||'Cost Code',bud:+document.getElementById('bud').value||0,com:+document.getElementById('com').value||0,act:+document.getElementById('act').value||0});render();}function clr(){lines=[];render();}function render(){if(!lines.length){document.getElementById('bs').innerHTML='<p style="color:var(--mu);font-size:.85rem">No cost codes added yet.</p>';return;}const fmt=n=>'$'+Math.round(n).toLocaleString();let h='<table class="tbl"><tr><th>Code</th><th>Budget</th><th>Committed</th><th>Actual</th><th>Variance</th><th>Status</th></tr>';let tb=0,tc=0,ta=0;lines.forEach(l=>{const v=l.bud-l.act;const pct=l.bud?((l.act/l.bud)*100).toFixed(0):0;const cls=v>=0?'pass':'fail';tb+=l.bud;tc+=l.com;ta+=l.act;h+=`<tr><td style="font-size:.82rem">${l.cc}</td><td>${fmt(l.bud)}</td><td>${fmt(l.com)}</td><td>${fmt(l.act)}</td><td class="${cls}">${fmt(v)}</td><td style="font-size:.78rem;color:var(--mu)">${pct}% spent</td></tr>`;});const tv=tb-ta;h+=`<tr style="font-weight:600"><td>TOTAL</td><td>${fmt(tb)}</td><td>${fmt(tc)}</td><td>${fmt(ta)}</td><td class="${tv>=0?'pass':'fail'}">${fmt(tv)}</td><td style="font-size:.78rem">${tb?(ta/tb*100).toFixed(0):0}% spent</td></tr></table>`;document.getElementById('bs').innerHTML=h;}</script></body></html>
