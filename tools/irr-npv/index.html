<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRR / NPV Calculator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22c55e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>IRR / NPV Calculator</h1><p class="sub">Finance — Annual Cash Flow Analysis</p><div class="card"><h3>Cash Flows</h3><label>Year 0 (enter as negative)</label><input type="number" id="y0" value="-500000"><label>Annual Cash Flows — comma separated</label><input type="text" id="cfs" value="80000,90000,100000,110000,600000"><label>Discount Rate (%)</label><input type="number" id="dr" value="10" step="0.5"><button onclick="calc()">Calculate</button></div><div class="card"><h3>Results</h3><div class="g4"><div class="res"><div class="rl">IRR</div><div class="rv" id="irr">-</div></div><div class="res"><div class="rl">NPV</div><div class="rv" id="npv">-</div></div><div class="res"><div class="rl">Equity Multiple</div><div class="rv" id="em">-</div></div><div class="res"><div class="rl">Payback</div><div class="rv" id="pb">-</div></div></div></div></div><script>function fmt(n){return'$'+Math.round(n).toLocaleString();}function calc(){const y0=+document.getElementById('y0').value||0;const cfsArr=document.getElementById('cfs').value.split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v));const flows=[y0,...cfsArr];const dr=+document.getElementById('dr').value/100;const npv=flows.reduce((s,c,t)=>s+c/Math.pow(1+dr,t),0);let r=0.1;for(let i=0;i<300;i++){let f=0,d=0;flows.forEach((c,t)=>{f+=c/Math.pow(1+r,t);d-=t*c/Math.pow(1+r,t+1);});const nr=r-f/d;if(Math.abs(nr-r)<1e-9)break;r=nr;}const tot=cfsArr.reduce((a,b)=>a+b,0);const inv=Math.abs(y0);const em=inv?tot/inv:0;let cum=y0,pb='N/A';for(let i=1;i<flows.length;i++){const prev=cum;cum+=flows[i];if(prev<0&&cum>=0){pb=(i-1+Math.abs(prev)/flows[i]).toFixed(1)+' yr';break;}}document.getElementById('irr').textContent=(r*100).toFixed(2)+'%';document.getElementById('npv').textContent=fmt(npv);document.getElementById('npv').className='rv '+(npv>=0?'pass':'fail');document.getElementById('em').textContent=em.toFixed(2)+'x';document.getElementById('pb').textContent=pb;}</script></body></html>
