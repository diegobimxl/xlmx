<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRR & NPV Calculator | XLMX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px}
.back{color:#c8a96e;text-decoration:none;font-size:13px}.topbar h1{font-size:15px;font-weight:600;color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
.desc{color:#888;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.box{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:20px;margin-bottom:14px}
.box h2{font-size:11px;font-weight:600;color:#c8a96e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:11px}label{font-size:11px;color:#888;display:block;margin-bottom:3px}
input,select{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;color:#e8e8e8;font-size:13px;padding:8px 10px;width:100%}
input:focus,select:focus{outline:none;border-color:#c8a96e}
.btn{background:#c8a96e;color:#000;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.btn:hover{background:#d4b87a}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:12px}
.klabel{font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase}
.kval{font-size:18px;font-weight:700;color:#c8a96e}
.kval.grn{color:#34d399}.kval.red{color:#f87171}.kval.sky{color:#60a5fa}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 8px;font-size:10px;color:#888;border-bottom:1px solid #222;text-transform:uppercase;font-weight:500}
td{padding:5px 8px;border-bottom:1px solid #161616;font-size:12px}
tr:hover td{background:#151515}
.note{font-size:11px;color:#666;margin-top:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="topbar"><a href="/tools/" class="back">&#8592; Tools</a><h1>IRR & NPV Calculator</h1></div>
<div class="wrap">
<p class="desc">Internal Rate of Return and Net Present Value for real estate and capital investments.</p>
<div class="grid">
<div>
<div class="box"><h2>Cash Flows</h2>
<div class="field"><label>Initial Investment ($) — negative outflow</label><input id="cf0" type="number" placeholder="-500000"></div>
<div class="field"><label>Year 1 Cash Flow ($)</label><input id="cf1" type="number" placeholder="40000"></div>
<div class="field"><label>Year 2 Cash Flow ($)</label><input id="cf2" type="number" placeholder="42000"></div>
<div class="field"><label>Year 3 Cash Flow ($)</label><input id="cf3" type="number" placeholder="44000"></div>
<div class="field"><label>Year 4 Cash Flow ($)</label><input id="cf4" type="number" placeholder="46000"></div>
<div class="field"><label>Year 5 Cash Flow ($) — include sale proceeds</label><input id="cf5" type="number" placeholder="650000"></div>
<div class="field"><label>Discount Rate / Hurdle Rate (%)</label><input id="disc" type="number" placeholder="8" value="8"></div>
<button class="btn" onclick="calc()">Calculate IRR & NPV</button>
</div></div>
<div>
<div class="box"><h2>Results</h2>
<div class="kpi" id="kpi"><p style="color:#555;font-size:12px">Enter cash flows and calculate.</p></div>
<div id="detail" style="margin-top:12px"></div>
</div></div></div>
<script>
function fm(n){return(n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})}
function npv(rate,cfs){return cfs.reduce(function(acc,cf,i){return acc+cf/Math.pow(1+rate,i)},0)}
function irr(cfs){
var lo=-0.99,hi=10,mid,n=0;
while(n++<200){mid=(lo+hi)/2;if(npv(mid,cfs)>0)lo=mid;else hi=mid;if(hi-lo<0.0000001)break;}
return mid;
}
function calc(){
var cfs=[
+document.getElementById("cf0").value||0,
+document.getElementById("cf1").value||0,
+document.getElementById("cf2").value||0,
+document.getElementById("cf3").value||0,
+document.getElementById("cf4").value||0,
+document.getElementById("cf5").value||0
];
var disc=+document.getElementById("disc").value/100||0.08;
var irrVal=irr(cfs)*100;
var npvVal=npv(disc,cfs);
var moic=cfs.slice(1).reduce(function(a,b){return a+b},0)/Math.abs(cfs[0]||1);
document.getElementById("kpi").innerHTML=
'<div class="kcard" style="border-color:'+(irrVal>disc*100?"#34d399":"#f87171")+'"><div class="klabel">IRR</div><div class="kval '+(irrVal>disc*100?"grn":"red")+'">'+irrVal.toFixed(2)+'%</div></div>'+
'<div class="kcard" style="border-color:'+(npvVal>0?"#34d399":"#f87171")+'"><div class="klabel">NPV @ '+((disc*100).toFixed(1))+'%</div><div class="kval '+(npvVal>0?"grn":"red")+'">'+fm(npvVal)+'</div></div>'+
'<div class="kcard"><div class="klabel">MOIC</div><div class="kval sky">'+moic.toFixed(2)+'×</div></div>'+
'<div class="kcard"><div class="klabel">Hurdle Met?</div><div class="kval '+(irrVal>disc*100?"grn":"red")+'">'+(irrVal>disc*100?"Yes":"No")+'</div></div>';
var rows=cfs.map(function(cf,i){
var pv=cf/Math.pow(1+disc,i);
return'<tr><td>'+(i===0?"Initial":("Year "+i))+'</td><td style="text-align:right;color:'+(cf>=0?"#34d399":"#f87171")+'">'+fm(cf)+'</td><td style="text-align:right;color:#60a5fa">'+fm(pv)+'</td></tr>';
}).join("");
document.getElementById("detail").innerHTML='<table><thead><tr><th>Period</th><th style="text-align:right">Cash Flow</th><th style="text-align:right">PV @ Hurdle</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
</script></div></body></html>
