<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Log - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#9ca3af}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Decision Log</h1><p class="sub">General Productivity — Key Decisions with Rationale</p><div class="card"><h3>Record Decision</h3><div class="g2"><div><label>Decision</label><input type="text" id="dec" placeholder="Use ACC as project CDE"></div><div><label>Date</label><input type="date" id="dt"></div><div><label>Decision Maker</label><input type="text" id="dm" placeholder="Diego R."></div><div><label>Impact</label><select id="imp"><option>High</option><option>Medium</option><option>Low</option></select></div></div><label>Rationale</label><input type="text" id="rat" placeholder="Single source of truth across all disciplines"><button onclick="add()">Record</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Decision Log</h3><div id="dl"><p style="color:var(--mu);font-size:.85rem">No decisions recorded yet.</p></div></div></div><script>let decs=[];let id=1;function add(){decs.push({id:id++,dec:document.getElementById('dec').value||'Decision',dt:document.getElementById('dt').value,dm:document.getElementById('dm').value||'—',imp:document.getElementById('imp').value,rat:document.getElementById('rat').value||'—'});render();}function clr(){decs=[];id=1;render();}const ic={High:'fail',Medium:'warn',Low:'pass'};function render(){if(!decs.length){document.getElementById('dl').innerHTML='<p style="color:var(--mu);font-size:.85rem">No decisions recorded yet.</p>';return;}let h='<table class="tbl"><tr><th>#</th><th>Decision</th><th>Date</th><th>By</th><th>Impact</th><th>Rationale</th></tr>';decs.forEach(d=>{h+=`<tr><td>${d.id}</td><td>${d.dec}</td><td style="font-size:.82rem">${d.dt||'—'}</td><td style="font-size:.82rem">${d.dm}</td><td class="${ic[d.imp]}">${d.imp}</td><td style="font-size:.82rem;color:var(--mu)">${d.rat}</td></tr>`;});h+='</table>';document.getElementById('dl').innerHTML=h;}</script></body></html>
