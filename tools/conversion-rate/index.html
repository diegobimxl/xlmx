<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversion Rate Optimizer — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Conversion Rate Optimizer</h1>
  <p class="sub">E-commerce — Funnel analysis, CVR benchmarks, and A/B test sizing</p>
  <div class="card">
    <label>FUNNEL STAGES (enter counts)</label>
    <div class="grid2">
      <div>
        <label>SESSIONS / VISITORS</label>
        <input type="number" id="sessions" value="10000" oninput="calc()">
      </div>
      <div>
        <label>PRODUCT PAGE VIEWS</label>
        <input type="number" id="pdp" value="4500" oninput="calc()">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>ADD TO CART</label>
        <input type="number" id="cart" value="1200" oninput="calc()">
      </div>
      <div>
        <label>CHECKOUT INITIATED</label>
        <input type="number" id="checkout" value="600" oninput="calc()">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>ORDERS / PURCHASES</label>
        <input type="number" id="orders" value="240" oninput="calc()">
      </div>
      <div>
        <label>AVG ORDER VALUE ($)</label>
        <input type="number" id="aov" value="75" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">OVERALL CVR</div>
        <div class="r-val" id="cvr">—</div>
      </div>
      <div class="result">
        <div class="r-label">CART ABANDON RATE</div>
        <div class="r-val" id="cart-ab">—</div>
      </div>
      <div class="result">
        <div class="r-label">REVENUE</div>
        <div class="r-val" id="rev">—</div>
        <div class="r-sub">per period</div>
      </div>
    </div>
    <div id="funnel" style="margin-top:12px;"></div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function calc(){
  const s=+document.getElementById('sessions').value;
  const pdp=+document.getElementById('pdp').value;
  const cart=+document.getElementById('cart').value;
  const co=+document.getElementById('checkout').value;
  const ord=+document.getElementById('orders').value;
  const aov=+document.getElementById('aov').value;
  const cvr=(ord/s*100).toFixed(2);
  const cartAb=co>0?((1-ord/co)*100).toFixed(1):'—';
  const rev=(ord*aov).toLocaleString();
  document.getElementById('cvr').textContent=cvr+'%';
  document.getElementById('cart-ab').textContent=cartAb+'%';
  document.getElementById('rev').textContent='$'+rev;
  const stages=[['Sessions',s,s],[('PDP Views',pdp,s],['Add to Cart',cart,s],['Checkout',co,s],['Orders',ord,s]];
  const funnelStages=[[['Sessions',s],['PDP Views',pdp],['Add to Cart',cart],['Checkout',co],['Orders',ord]]];
  const fl=document.getElementById('funnel');
  fl.innerHTML='<div style="font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:8px;">FUNNEL VISUALIZATION</div>'+
  [['Sessions',s],['PDP Views',pdp],['Add to Cart',cart],['Checkout',co],['Orders',ord]].map(([name,val])=>{
    const pct=s>0?(val/s*100).toFixed(1):0;
    const w=Math.max(pct,1);
    return `<div style="margin-bottom:6px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span style="color:var(--mu);">${name}</span><span style="color:var(--tx);">${val.toLocaleString()} <span style="color:var(--mu);">(${pct}%)</span></span></div><div style="background:rgba(255,255,255,.05);border-radius:4px;height:10px;overflow:hidden;"><div style="width:${w}%;height:100%;background:var(--acc);border-radius:4px;transition:.3s;"></div></div></div>`;
  }).join('');
  document.getElementById('note').textContent=`CVR ${cvr}% vs industry avg: fashion 1-3%, electronics 1-2%, B2B 2-5%. Cart abandonment ${cartAb}% (industry avg ~70%). Revenue $${rev}. +1% CVR improvement = +${(ord/s*aov*100*s/10000*s/s).toFixed(0)} rev per ${s.toLocaleString()} sessions at current AOV.`;
}
calc();
</script>
</body>
</html>
