<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRR Estimator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#c8a96e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>IRR Estimator</h1><p class="sub">Real Estate & Development — Multi-Year Cash Flow IRR</p><div class="card"><h3>Cash Flows</h3><div class="g2"><div><label>Initial Investment ($)</label><input type="number" id="inv" value="1000000" step="10000"></div><div><label>Hold Period (years)</label><input type="number" id="hold" value="5" min="1" max="20"></div></div><label>Annual Cash Flows — comma separated</label><input type="text" id="cfs" value="80000,85000,90000,95000,1200000" placeholder="Year 1, Year 2..."><button onclick="calc()">Calculate IRR</button></div><div class="card"><h3>Results</h3><div class="g3"><div class="res"><div class="rl">IRR</div><div class="rv" id="irr">-</div></div><div class="res"><div class="rl">Equity Multiple</div><div class="rv" id="em">-</div></div><div class="res"><div class="rl">Total Return</div><div class="rv" id="tr">-</div></div></div><p class="note">IRR solved via Newton-Raphson on NPV=0.</p></div></div><script>function calc(){const inv=parseFloat(document.getElementById('inv').value);const cfsRaw=document.getElementById('cfs').value.split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v));const flows=[-inv,...cfsRaw];let r=0.1;for(let i=0;i<300;i++){let npv=0,dnpv=0;flows.forEach((c,t)=>{npv+=c/Math.pow(1+r,t);dnpv+=(-t*c)/Math.pow(1+r,t+1);});const nr=r-npv/dnpv;if(Math.abs(nr-r)<1e-8){r=nr;break;}r=nr;}const tot=cfsRaw.reduce((a,b)=>a+b,0);document.getElementById('irr').textContent=isNaN(r)?'N/A':(r*100).toFixed(2)+'%';document.getElementById('em').textContent=(tot/inv).toFixed(2)+'x';document.getElementById('tr').textContent=((tot-inv)/inv*100).toFixed(1)+'%';}</script></body></html>
