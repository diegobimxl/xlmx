<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syllable Counter — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;}
.sb{flex:1;min-width:80px;}
.sv{font-size:22px;font-weight:700;color:var(--acc);}
.sl{font-size:11px;color:var(--mu);}
textarea{min-height:120px;resize:vertical;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">&#8592; All Tools</a>
  <h1>Syllable Counter</h1>
  <p class="sub">Linguistics — English syllable count with word-level breakdown</p>

  <div class="card">
    <label style="margin-top:0;">TEXT INPUT</label>
    <textarea id="txt" placeholder="Paste or type your text here..." oninput="calc()">The quick brown fox jumps over the lazy dog. Extraordinary circumstances require immediate attention and professional consideration.</textarea>
  </div>

  <div class="card">
    <div class="stat-row">
      <div class="sb"><div class="sv" id="s-syl">0</div><div class="sl">Total Syllables</div></div>
      <div class="sb"><div class="sv" id="s-words">0</div><div class="sl">Words</div></div>
      <div class="sb"><div class="sv" id="s-sents">0</div><div class="sl">Sentences</div></div>
      <div class="sb"><div class="sv" id="s-avg">0.0</div><div class="sl">Avg Syl/Word</div></div>
    </div>
  </div>

  <div class="card">
    <div style="color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:10px;">TOP 10 LONGEST WORDS BY SYLLABLE COUNT</div>
    <table class="tbl" id="top10">
      <thead><tr><th>#</th><th>Word</th><th>Syllables</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <div style="color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:10px;">FIRST 20 WORDS — SYLLABLE BREAKDOWN</div>
    <table class="tbl" id="breakdown">
      <thead><tr><th>Word</th><th>Syllables</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
function countSyllables(word){
  word=word.toLowerCase().replace(/[^a-z]/g,'');
  if(!word) return 0;
  if(word.length<=2) return 1;
  // Simplified algorithm
  word=word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'');
  word=word.replace(/^y/,'');
  const m=word.match(/[aeiouy]{1,2}/g);
  return m?m.length:1;
}

function calc(){
  const txt=document.getElementById('txt').value;
  const words=txt.match(/\b[a-zA-Z]+\b/g)||[];
  const sents=(txt.match(/[.!?]+/g)||[]).length||1;

  const wordData=words.map(w=>({word:w,syl:countSyllables(w)}));
  const totalSyl=wordData.reduce((a,b)=>a+b.syl,0);
  const avgSyl=words.length?totalSyl/words.length:0;

  document.getElementById('s-syl').textContent=totalSyl;
  document.getElementById('s-words').textContent=words.length;
  document.getElementById('s-sents').textContent=sents;
  document.getElementById('s-avg').textContent=avgSyl.toFixed(2);

  // Top 10
  const sorted=[...wordData].sort((a,b)=>b.syl-a.syl);
  const unique=[];
  const seen=new Set();
  sorted.forEach(w=>{if(!seen.has(w.word.toLowerCase())){seen.add(w.word.toLowerCase());unique.push(w);}});
  const top10=unique.slice(0,10);
  document.querySelector('#top10 tbody').innerHTML=top10.map((w,i)=>
    `<tr><td style="color:var(--mu);">${i+1}</td><td style="color:var(--acc);font-weight:600;">${w.word}</td><td>${w.syl}</td></tr>`
  ).join('');

  // First 20
  const first20=wordData.slice(0,20);
  document.querySelector('#breakdown tbody').innerHTML=first20.map(w=>
    `<tr><td>${w.word}</td><td style="color:var(--acc);">${w.syl}</td></tr>`
  ).join('');
}
calc();
</script>
</body>
</html>
