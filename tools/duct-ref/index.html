<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duct Size Reference — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Duct Size Reference</h1><p class="sub">Engineering — Quick duct sizing by CFM with equal friction method</p>
<div class="card">
  <div class="g2">
    <div><label>AIRFLOW (CFM)</label><input type="number" id="cfm" value="1200" oninput="calc()"></div>
    <div>
      <label>DUCT TYPE</label>
      <select id="dtype" onchange="calc()">
        <option value="supply">Supply (0.08 in.w.g./100ft)</option>
        <option value="return">Return (0.05 in.w.g./100ft)</option>
        <option value="exhaust">Exhaust (0.08 in.w.g./100ft)</option>
      </select>
    </div>
  </div>
  <div class="g2">
    <div><label>FRICTION RATE (in.w.g./100ft)</label><input type="number" id="fr" value="0.08" step="0.01" oninput="calc()"></div>
    <div><label>MAX VELOCITY (FPM)</label><input type="number" id="maxv" value="1200" oninput="calc()"></div>
  </div>
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">ROUND DIA.</div><div class="rv" id="round">—</div><div class="rs">inches</div></div>
    <div class="res"><div class="rl">VELOCITY</div><div class="rv" id="vel">—</div><div class="rs">FPM</div></div>
    <div class="res"><div class="rl">VELOCITY STATUS</div><div class="rv" id="vel-stat" style="font-size:15px;">—</div></div>
  </div>
  <div style="margin-top:12px;font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px;">RECTANGULAR EQUIVALENTS (approx.)</div>
  <div id="rect-options"></div>
  <div class="note" id="note"></div>
</div>
</div><script>function calc(){
  const cfm=+document.getElementById('cfm').value;
  const fr=+document.getElementById('fr').value;
  const maxV=+document.getElementById('maxv').value;
  // Equal friction: D = 1.128 × (CFM / (FR_Pa × ...)  — simplified Darcy-Weisbach approximation
  // Using ASHRAE chart approximation: D_in = 4.973 × (CFM^0.45 / FR^0.25)
  const dia=4.973*Math.pow(cfm,0.45)/Math.pow(fr,0.25);
  const area=Math.PI*(dia/2/12)**2; // sq ft
  const vel=cfm/area;
  const diaRound=Math.ceil(dia/0.5)*0.5;
  document.getElementById('round').textContent=diaRound.toFixed(1)+'"';
  document.getElementById('vel').textContent=vel.toFixed(0);
  const ok=vel<=maxV;
  document.getElementById('vel-stat').textContent=ok?'OK ✓':'High ✗';
  document.getElementById('vel-stat').style.color=ok?'var(--acc)':'#f87171';
  // Rectangular equivalents (same hydraulic diameter)
  const rects=[];
  const widths=[6,8,10,12,14,16,18,20];
  widths.forEach(w=>{
    const h_num=0.25*(dia**1.25*dia**0.25)/(w**0.625);
    const h=dia*dia/w; // simplified: Deq=1.3(ab)^0.625/(a+b)^0.25
    if(h>=4&&h<=48)rects.push([w,Math.ceil(h)]);
  });
  document.getElementById('rect-options').innerHTML='<div class="g4">'+
    rects.slice(0,8).map(([w,h])=>`<div style="background:rgba(255,255,255,.04);border-radius:6px;padding:8px;text-align:center;"><span style="font-weight:700;color:var(--acc);">${w}"×${h}"</span></div>`).join('')+'</div>';
  document.getElementById('note').textContent=`CFM: ${cfm}. Friction rate: ${fr} in.w.g./100ft. Round duct: ${diaRound}"Ø, velocity: ${vel.toFixed(0)} FPM. Max recommended: supply 1200, return 1000, exhaust 1200 FPM (low-velocity design). Noise criterion: keep below 900 FPM at diffusers.`;
}
calc();</script></body></html>
