<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F&B Cost Controller — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#fb923c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
btn,button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>F&B Cost Controller</h1>
  <p class="sub">Hospitality — Food & beverage cost percentage and menu pricing</p>
  <div class="card">
    <div class="grid2">
      <div>
        <label>FOOD COST ($)</label>
        <input type="number" id="fc" value="3.50" step="0.01" oninput="calc()">
      </div>
      <div>
        <label>MENU PRICE ($)</label>
        <input type="number" id="mp" value="14.00" step="0.01" oninput="calc()">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>LABOR COST PER DISH ($)</label>
        <input type="number" id="lc" value="1.20" step="0.01" oninput="calc()">
      </div>
      <div>
        <label>TARGET FOOD COST %</label>
        <input type="number" id="tgt" value="30" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">FOOD COST %</div>
        <div class="r-val" id="fcp">—</div>
      </div>
      <div class="result">
        <div class="r-label">PRIME COST %</div>
        <div class="r-val" id="pcp">—</div>
        <div class="r-sub">food + labor</div>
      </div>
      <div class="result">
        <div class="r-label">GROSS MARGIN</div>
        <div class="r-val" id="gm">—</div>
      </div>
    </div>
    <div class="result" style="margin-top:12px;">
      <div class="r-label">SUGGESTED PRICE AT TARGET</div>
      <div class="r-val" id="sp">—</div>
      <div class="r-sub">to hit your target food cost %</div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function calc(){
  const fc=+document.getElementById('fc').value;
  const mp=+document.getElementById('mp').value;
  const lc=+document.getElementById('lc').value;
  const tgt=+document.getElementById('tgt').value;
  if(!mp||!fc){return;}
  const fcp=(fc/mp*100).toFixed(1);
  const pcp=((fc+lc)/mp*100).toFixed(1);
  const gm=((mp-fc)/mp*100).toFixed(1);
  const sp=(fc/(tgt/100)).toFixed(2);
  document.getElementById('fcp').textContent=fcp+'%';
  document.getElementById('pcp').textContent=pcp+'%';
  document.getElementById('gm').textContent=gm+'%';
  document.getElementById('sp').textContent='$'+sp;
  const status=parseFloat(fcp)<=tgt?'✓ On target':'⚠ Above target — raise price or reduce cost';
  document.getElementById('note').textContent=`Food cost ${fcp}% vs target ${tgt}%. ${status}. Industry benchmark: food 28–35%, prime cost under 65%.`;
}
calc();
</script>
</body>
</html>
