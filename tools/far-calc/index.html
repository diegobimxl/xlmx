<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAR & Zoning Calculator | XLMX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px}
.back{color:#c8a96e;text-decoration:none;font-size:13px}.topbar h1{font-size:15px;font-weight:600;color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
.desc{color:#888;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.box{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:20px;margin-bottom:14px}
.box h2{font-size:11px;font-weight:600;color:#c8a96e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:11px}label{font-size:11px;color:#888;display:block;margin-bottom:3px}
input,select{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;color:#e8e8e8;font-size:13px;padding:8px 10px;width:100%}
input:focus,select:focus{outline:none;border-color:#c8a96e}
.btn{background:#c8a96e;color:#000;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.btn:hover{background:#d4b87a}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:12px}
.klabel{font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase}
.kval{font-size:18px;font-weight:700;color:#c8a96e}
.kval.grn{color:#34d399}.kval.red{color:#f87171}.kval.sky{color:#60a5fa}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 8px;font-size:10px;color:#888;border-bottom:1px solid #222;text-transform:uppercase;font-weight:500}
td{padding:5px 8px;border-bottom:1px solid #161616;font-size:12px}
tr:hover td{background:#151515}
.note{font-size:11px;color:#666;margin-top:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="topbar"><a href="/tools/" class="back">&#8592; Tools</a><h1>FAR & Zoning Calculator</h1></div>
<div class="wrap">
<p class="desc">Floor Area Ratio: maximum buildable area, setback envelope, and efficiency analysis.</p>
<div class="grid">
<div>
<div class="box"><h2>Site</h2>
<div class="field"><label>Lot Area (sq ft)</label><input id="lot" type="number" placeholder="20000"></div>
<div class="field"><label>Allowed FAR</label><input id="far" type="number" placeholder="3.0" step="0.5"></div>
<div class="field"><label>Max Height (ft)</label><input id="ht" type="number" placeholder="75"></div>
<div class="field"><label>Floor-to-Floor Height (ft)</label><input id="ff" type="number" placeholder="14" value="14"></div>
</div>
<div class="box"><h2>Setbacks</h2>
<div class="field"><label>Front Setback (ft)</label><input id="sf" type="number" placeholder="10" value="10"></div>
<div class="field"><label>Rear Setback (ft)</label><input id="sr" type="number" placeholder="20" value="20"></div>
<div class="field"><label>Side Setbacks combined (ft)</label><input id="ss" type="number" placeholder="20" value="20"></div>
<div class="field"><label>Lot Depth (ft)</label><input id="depth" type="number" placeholder="200"></div>
<div class="field"><label>Lot Width (ft)</label><input id="width" type="number" placeholder="100"></div>
</div>
<div class="box"><h2>Proposed Building</h2>
<div class="field"><label>Proposed GFA (sq ft)</label><input id="gfa" type="number" placeholder="48000"></div>
<button class="btn" onclick="calc()">Calculate</button>
</div></div>
<div>
<div class="box"><h2>Results</h2>
<div class="kpi" id="kpi"><p style="color:#555;font-size:12px">Enter inputs and calculate.</p></div>
<div id="verdict" style="margin-top:12px"></div>
</div></div></div>
<script>
function fc(n){return n.toLocaleString("en-US",{maximumFractionDigits:0})}
function calc(){
var lot=+document.getElementById("lot").value||0;
var farAllow=+document.getElementById("far").value||0;
var ht=+document.getElementById("ht").value||0;
var ff=+document.getElementById("ff").value||14;
var sf=+document.getElementById("sf").value||0;
var sr=+document.getElementById("sr").value||0;
var ss=+document.getElementById("ss").value||0;
var depth=+document.getElementById("depth").value||0;
var width=+document.getElementById("width").value||0;
var gfa=+document.getElementById("gfa").value||0;
var maxGFA=lot*farAllow;
var maxFloors=Math.floor(ht/ff);
var bldgW=Math.max(0,width-ss);
var bldgD=Math.max(0,depth-sf-sr);
var footprint=bldgW*bldgD;
var farProp=gfa/lot;
var ok=farProp<=farAllow;
document.getElementById("kpi").innerHTML=
'<div class="kcard"><div class="klabel">Max GFA (FAR)</div><div class="kval sky">'+fc(maxGFA)+' sf</div></div>'+
'<div class="kcard"><div class="klabel">Max Floors</div><div class="kval">'+maxFloors+' fl</div></div>'+
'<div class="kcard"><div class="klabel">Max Footprint</div><div class="kval sky">'+fc(footprint)+' sf</div></div>'+
'<div class="kcard"><div class="klabel">Proposed FAR</div><div class="kval '+(ok?"grn":"red")+'">'+farProp.toFixed(2)+'</div></div>'+
'<div class="kcard"><div class="klabel">FAR Used</div><div class="kval '+(ok?"grn":"red")+'">'+((farProp/farAllow*100)||0).toFixed(1)+'%</div></div>'+
(gfa?'<div class="kcard" style="border-color:'+(ok?"#34d399":"#f87171")+'"><div class="klabel">Compliant?</div><div class="kval '+(ok?"grn":"red")+'">'+(ok?"Yes":"No — over by "+fc(gfa-maxGFA)+" sf")+'</div></div>':'');
}
</script></div></body></html>
