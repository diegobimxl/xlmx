<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Measurement Challenge - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#facc15}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Measurement Challenge</h1><p class="sub">Leisure — Test Your Spatial Intuition</p><div class="card"><h3>Measurement Challenge</h3><p class="note" style="margin-bottom:.75rem">Estimate the dimension — how good is your spatial intuition?</p><div id="mc"></div></div></div><script>const challenges=[{q:"A standard interior door height",a:2.032,unit:"m",hint:"Think ceiling height then subtract",range:[1.8,2.4]},{q:"Width of a standard US parking space",a:2.74,unit:"m",hint:"Enough for a typical car plus door swing",range:[2.3,3.5]},{q:"Floor-to-floor height in a typical office building",a:4.0,unit:"m",hint:"Structural slab + MEP zone + finished ceiling",range:[3.0,5.5]},{q:"Width of a single lane of highway traffic",a:3.65,unit:"m",hint:"AASHTO standard — enough for a semi-truck",range:[3.0,4.5]},{q:"Height of a standard classroom ceiling (AFF)",a:3.0,unit:"m",hint:"IBC minimum is lower — typical is higher",range:[2.4,4.0]},{q:"Width of a standard US letter sheet of paper",a:0.216,unit:"m",hint:"8.5 inches — convert to metric",range:[0.15,0.35]},{q:"Height of a typical 4-story residential building",a:12.5,unit:"m",hint:"About 3m per floor plus slab thickness",range:[8,18]},{q:"Span of a standard residential staircase width",a:0.914,unit:"m",hint:"IBC minimum — typically 36 inches",range:[0.6,1.5]}];let idx=0,score=0;function render(){const c=challenges[idx];document.getElementById('mc').innerHTML=`<p style="font-size:.9rem;margin-bottom:.75rem">${c.q}</p><div class="g2" style="align-items:end"><div><label>Your estimate (${c.unit})</label><input type="number" id="guess" step="0.01" placeholder="0.00"></div></div><button onclick="check()">Submit Guess</button><p style="font-size:.82rem;color:var(--mu);margin-top:.5rem">Question ${idx+1} of ${challenges.length} | Score: ${score}</p>`;}function check(){const g=+document.getElementById('guess').value;const c=challenges[idx];const pct=Math.abs(g-c.a)/c.a*100;const pts=pct<5?3:pct<15?2:pct<30?1:0;score+=pts;idx++;const msg=pts===3?'Excellent!':pts===2?'Good!':pts===1?'Close':' Off-target';document.getElementById('mc').innerHTML=`<p style="font-size:.95rem;margin-bottom:.5rem">Answer: <b>${c.a} ${c.unit}</b> — You guessed ${g} ${c.unit} (${pct.toFixed(0)}% off)</p><p class="${pts>1?'pass':'warn'}">${msg} +${pts} pts</p><p style="font-size:.82rem;color:var(--mu);margin-top:.4rem">${c.hint}</p>${idx<challenges.length?'<button onclick="render()" style="margin-top:.75rem">Next Question</button>':`<p style="font-weight:700;margin-top:.75rem">Final Score: ${score} / ${challenges.length*3}</p><button onclick="idx=0;score=0;render()" style="margin-top:.5rem">Play Again</button>`}`;}render();</script></body></html>
