<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Young's Modulus Reference — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
button{background:var(--acc);color:#000;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;color:var(--mu);font-size:10px;letter-spacing:.05em;padding:7px 8px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap;}
.tbl th:hover{color:var(--acc);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;}
.tbl tr:hover td{background:rgba(255,255,255,.03);}
.tbl tr.selected td{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.2);}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:20px;font-weight:700;color:var(--acc);}
.detail-box{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:14px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Back</a>
  <h1>Young's Modulus Reference</h1>
  <p class="sub">Engineering materials database — click any row for details and applications</p>

  <div class="card" style="padding:12px 16px;">
    <input type="text" id="search" placeholder="Search materials..." oninput="renderTable()" style="margin:0;">
  </div>

  <div class="card" style="padding:0;overflow-x:auto;">
    <table class="tbl" id="matTable">
      <thead>
        <tr>
          <th onclick="sortBy('name')">Material</th>
          <th onclick="sortBy('E')">E (GPa)</th>
          <th onclick="sortBy('yield')">Yield (MPa)</th>
          <th onclick="sortBy('uts')">UTS (MPa)</th>
          <th onclick="sortBy('den')">ρ (g/cm³)</th>
          <th onclick="sortBy('spec')">E/ρ (GPa·cm³/g)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="detail"></div>

  <div class="card">
    <div style="font-size:12px;font-weight:600;color:var(--mu);letter-spacing:.05em;margin-bottom:12px;">STRESS / STRAIN CALCULATOR</div>
    <div class="grid4">
      <div>
        <label>Select Material</label>
        <select id="calcMat" onchange="fillE()">
          <option value="">— pick —</option>
        </select>
      </div>
      <div>
        <label>E (GPa)</label>
        <input type="number" id="calcE" value="200" step="0.1">
      </div>
      <div>
        <label>Cross-Section (mm²)</label>
        <input type="number" id="calcA" value="100" step="1">
      </div>
      <div>
        <label>Applied Force (N)</label>
        <input type="number" id="calcF" value="50000" step="100">
      </div>
    </div>
    <div class="grid3" style="margin-top:10px;">
      <div>
        <label>Gauge Length (mm)</label>
        <input type="number" id="calcL" value="1000" step="1">
      </div>
      <div></div>
      <div style="margin-top:18px;"><button onclick="calcStress()">Calculate</button></div>
    </div>
    <div id="stressResult" style="margin-top:14px;"></div>
  </div>
</div>

<script>
const MATS = [
  {name:"Structural Steel",      E:200,  yield:250,  uts:400,  den:7.85, apps:"Beams, columns, bridges, frames"},
  {name:"Stainless Steel 316",   E:193,  yield:290,  uts:580,  den:8.0,  apps:"Corrosive environments, food equipment, medical devices"},
  {name:"Aluminum 6061-T6",      E:69,   yield:276,  uts:310,  den:2.70, apps:"Aerospace structures, automotive, bicycle frames"},
  {name:"Titanium Ti-6Al-4V",    E:114,  yield:880,  uts:950,  den:4.43, apps:"Aerospace, biomedical implants, high-perf motorsport"},
  {name:"Copper C110",           E:117,  yield:70,   uts:220,  den:8.96, apps:"Electrical conductors, heat exchangers, plumbing"},
  {name:"Brass C260",            E:97,   yield:200,  uts:350,  den:8.50, apps:"Fasteners, fittings, musical instruments"},
  {name:"Gray Cast Iron",        E:100,  yield:215,  uts:290,  den:7.20, apps:"Engine blocks, brake rotors, machine bases"},
  {name:"Borosilicate Glass",    E:64,   yield:null, uts:50,   den:2.23, apps:"Lab glassware, optical components, cookware"},
  {name:"CFRP (0° Unidirectional)",E:135,yield:null, uts:1500, den:1.55, apps:"Aerospace skins, racing car chassis, wind blades"},
  {name:"GFRP (E-glass epoxy)", E:45,   yield:null, uts:400,  den:1.90, apps:"Boat hulls, sports equipment, pipes"},
  {name:"HDPE",                  E:0.8,  yield:26,   uts:30,   den:0.95, apps:"Pipes, containers, cutting boards"},
  {name:"Nylon PA66",            E:2.7,  yield:70,   uts:80,   den:1.14, apps:"Gears, bushings, cable ties"},
  {name:"Concrete (30 MPa)",     E:30,   yield:null, uts:30,   den:2.40, apps:"Structural slabs, foundations, columns"},
  {name:"Wood — Douglas Fir",    E:13,   yield:null, uts:50,   den:0.50, apps:"Timber framing, flooring, furniture"},
  {name:"Cortical Bone",         E:17,   yield:null, uts:170,  den:1.90, apps:"Biomedical reference, implant design"},
  {name:"Diamond",               E:1050, yield:null, uts:2800, den:3.51, apps:"Cutting tools, abrasives, optical windows"},
  {name:"Silicon",               E:130,  yield:null, uts:7000, den:2.33, apps:"Semiconductors, MEMS, solar cells"},
  {name:"Beryllium",             E:287,  yield:240,  uts:370,  den:1.85, apps:"Aerospace mirrors, X-ray windows, nuclear moderators"},
  {name:"Inconel 718",           E:200,  yield:1100, uts:1380, den:8.19, apps:"Jet engines, turbines, high-temp pressure vessels"},
  {name:"PEEK",                  E:3.6,  yield:91,   uts:100,  den:1.32, apps:"Surgical implants, aerospace brackets, semiconductor fixtures"},
].map(m=>({...m, spec: m.den>0?+(m.E/m.den).toFixed(1):0}));

let sortKey='E', sortDir=-1, selectedIdx=null;

function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}renderTable();}

function renderTable(){
  const s=document.getElementById('search').value.toLowerCase();
  let rows=MATS.filter(m=>m.name.toLowerCase().includes(s));
  rows.sort((a,b)=>{
    if(sortKey==='name')return sortDir*(a.name.localeCompare(b.name));
    const av=a[sortKey]??-Infinity, bv=b[sortKey]??-Infinity;
    return sortDir*(av-bv);
  });
  let html='';
  rows.forEach((m,i)=>{
    html+=`<tr onclick="showDetail(${MATS.indexOf(m)})" class="${selectedIdx===MATS.indexOf(m)?'selected':''}">
      <td style="font-weight:500;">${m.name}</td>
      <td style="color:var(--acc);">${m.E}</td>
      <td>${m.yield??'—'}</td>
      <td>${m.uts??'—'}</td>
      <td>${m.den}</td>
      <td>${m.spec}</td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML=html;
}

function showDetail(idx){
  selectedIdx=idx;
  const m=MATS[idx];
  document.getElementById('detail').innerHTML=`
    <div class="detail-box">
      <div style="font-weight:700;font-size:15px;margin-bottom:8px;color:var(--acc);">${m.name}</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px;">
        <div><div class="r-label">E (GPa)</div><div class="r-val">${m.E}</div></div>
        <div><div class="r-label">Yield (MPa)</div><div class="r-val">${m.yield??'—'}</div></div>
        <div><div class="r-label">UTS (MPa)</div><div class="r-val">${m.uts??'—'}</div></div>
        <div><div class="r-label">ρ (g/cm³)</div><div class="r-val">${m.den}</div></div>
        <div><div class="r-label">Spec. Stiffness</div><div class="r-val">${m.spec}</div></div>
      </div>
      <div style="font-size:12px;color:var(--mu);">Applications: ${m.apps}</div>
    </div>`;
  document.getElementById('calcMat').value=idx;
  fillE();
  renderTable();
}

function fillE(){
  const idx=document.getElementById('calcMat').value;
  if(idx==='')return;
  document.getElementById('calcE').value=MATS[idx].E;
}

function calcStress(){
  const E=parseFloat(document.getElementById('calcE').value)||0;
  const A=parseFloat(document.getElementById('calcA').value)||1;
  const F=parseFloat(document.getElementById('calcF').value)||0;
  const L=parseFloat(document.getElementById('calcL').value)||1;
  const sigma=F/A;
  const strain=sigma/(E*1e3);
  const dL=strain*L;
  const pct=((sigma/(E*1e3))*100);
  document.getElementById('stressResult').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;">
      <div class="card" style="padding:12px;"><div class="r-label">STRESS</div><div class="r-val">${sigma.toFixed(1)} MPa</div></div>
      <div class="card" style="padding:12px;"><div class="r-label">STRAIN</div><div class="r-val">${strain.toExponential(3)}</div></div>
      <div class="card" style="padding:12px;"><div class="r-label">ELONGATION</div><div class="r-val">${dL.toFixed(3)} mm</div></div>
      <div class="card" style="padding:12px;"><div class="r-label">ε %</div><div class="r-val">${pct.toFixed(4)}%</div></div>
    </div>`;
}

// Populate select
const sel=document.getElementById('calcMat');
MATS.forEach((m,i)=>{
  const o=document.createElement('option');
  o.value=i;o.textContent=m.name;
  sel.appendChild(o);
});
renderTable();
</script>
</body>
</html>
