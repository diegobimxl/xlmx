<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stratigraphy Recorder — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
btn,button{background:var(--acc);color:#000;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;}
button.sec{background:rgba(255,255,255,.07);color:var(--tx);}
button.danger{background:rgba(239,68,68,.2);color:#f87171;}
canvas{display:block;margin:0 auto;}
.harris{font-family:monospace;font-size:12px;white-space:pre;color:var(--mu);line-height:1.6;}
textarea.harris-out{background:rgba(0,0,0,.3);color:#86efac;font-family:monospace;font-size:12px;height:160px;resize:vertical;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="/tools/">← Tools</a>
<h1>Stratigraphy Recorder</h1>
<p class="sub">Category: Archeology — Log excavation layers, visualize the section, export Harris Matrix and CSV.</p>

<div class="card">
  <h2 style="font-size:15px;font-weight:600;margin-bottom:4px;">Add Layer</h2>
  <div class="grid2">
    <div>
      <label>Unit Name</label>
      <input id="unit" placeholder="e.g. Trench 1A">
    </div>
    <div>
      <label>Munsell Color Code</label>
      <input id="munsell" placeholder="e.g. 10YR 4/3">
    </div>
  </div>
  <div class="grid3">
    <div>
      <label>Depth From (cm)</label>
      <input id="dfrom" type="number" placeholder="0">
    </div>
    <div>
      <label>Depth To (cm)</label>
      <input id="dto" type="number" placeholder="20">
    </div>
    <div>
      <label>Texture</label>
      <select id="texture">
        <option value="clay">Clay</option>
        <option value="silt">Silt</option>
        <option value="sand">Sand</option>
        <option value="gravel">Gravel</option>
        <option value="loam">Loam</option>
        <option value="peat">Peat</option>
      </select>
    </div>
  </div>
  <div>
    <label>Interpretation</label>
    <select id="interp">
      <option value="natural deposit">Natural Deposit</option>
      <option value="cultural layer">Cultural Layer</option>
      <option value="fill">Fill</option>
      <option value="disturbance">Disturbance</option>
      <option value="interface">Interface / Cut</option>
    </select>
  </div>
  <div>
    <label>Finds Description</label>
    <textarea id="finds" rows="2" placeholder="Sherds, lithics, ecofacts…"></textarea>
  </div>
  <button onclick="addLayer()">Add Layer</button>
</div>

<div class="card" id="tableCard" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h2 style="font-size:15px;font-weight:600;">Layer Table</h2>
    <div style="display:flex;gap:8px;">
      <button class="sec" onclick="exportCSV()" style="margin-top:0;padding:6px 14px;">Export CSV</button>
      <button class="sec" onclick="exportHarris()" style="margin-top:0;padding:6px 14px;">Harris Matrix</button>
      <button class="danger" onclick="clearAll()" style="margin-top:0;padding:6px 14px;">Clear All</button>
    </div>
  </div>
  <div style="overflow-x:auto;">
    <table class="tbl" id="layerTable">
      <thead><tr>
        <th>#</th><th>Unit</th><th>Depth (cm)</th><th>Munsell</th><th>Texture</th><th>Interpretation</th><th>Finds</th><th></th>
      </tr></thead>
      <tbody id="layerBody"></tbody>
    </table>
  </div>
</div>

<div class="card" id="vizCard" style="display:none;">
  <h2 style="font-size:15px;font-weight:600;margin-bottom:12px;">Stratigraphic Section</h2>
  <canvas id="sectionCanvas" width="640" height="400"></canvas>
</div>

<div class="card" id="harrisCard" style="display:none;">
  <h2 style="font-size:15px;font-weight:600;margin-bottom:8px;">Harris Matrix (text)</h2>
  <textarea class="harris-out" id="harrisOut" readonly></textarea>
</div>

</div>
<script>
let layers = [];
let layerCount = 0;

const munsellColors = {
  "10YR 2/1":"#1a1207","10YR 3/2":"#3d2b1f","10YR 4/3":"#7a5c40","10YR 5/4":"#a87a50",
  "10YR 6/3":"#c4a882","10YR 7/2":"#d6c5ab","7.5YR 4/4":"#8f5e30","7.5YR 5/6":"#b86c1a",
  "2.5Y 4/2":"#7a7260","2.5Y 5/3":"#a09070","5YR 4/4":"#8a4a3a","5YR 5/6":"#b55030",
};

function munsellToColor(code){
  if(munsellColors[code]) return munsellColors[code];
  // fallback gradient based on value notation
  const match = code.match(/(\d+\.?\d*)[YR\s]+(\d+)\/(\d+)/i);
  if(match){
    const v = parseInt(match[2]);
    const c = parseInt(match[3]);
    const l = Math.round((v/10)*200);
    const r = Math.min(255, l + c*8);
    const g = Math.round(l * 0.85);
    const b = Math.round(l * 0.65);
    return `rgb(${r},${g},${b})`;
  }
  return "#6b5a3e";
}

function addLayer(){
  const unit = document.getElementById('unit').value.trim() || 'Unit';
  const munsell = document.getElementById('munsell').value.trim() || '10YR 4/3';
  const dfrom = parseFloat(document.getElementById('dfrom').value) || 0;
  const dto = parseFloat(document.getElementById('dto').value) || 10;
  const texture = document.getElementById('texture').value;
  const interp = document.getElementById('interp').value;
  const finds = document.getElementById('finds').value.trim();

  if(dto <= dfrom){ alert('Depth To must be greater than Depth From'); return; }

  layerCount++;
  layers.push({id:layerCount, unit, munsell, dfrom, dto, texture, interp, finds});
  layers.sort((a,b)=>a.dfrom-b.dfrom);

  renderTable();
  drawSection();
  document.getElementById('tableCard').style.display='';
  document.getElementById('vizCard').style.display='';

  document.getElementById('dfrom').value = dto;
  document.getElementById('dto').value = dto + 10;
  document.getElementById('finds').value = '';
}

function renderTable(){
  const tbody = document.getElementById('layerBody');
  tbody.innerHTML = '';
  layers.forEach((l,i)=>{
    const colorDot = `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${munsellToColor(l.munsell)};vertical-align:middle;margin-right:5px;"></span>`;
    const interpColor = {
      'natural deposit':'#22c55e','cultural layer':'#d97706','fill':'#3b82f6',
      'disturbance':'#ef4444','interface':'#a855f7'
    }[l.interp] || '#6b7280';
    const badge = `<span class="badge" style="background:${interpColor}20;color:${interpColor};">${l.interp}</span>`;
    tbody.innerHTML += `<tr>
      <td style="color:var(--mu)">${i+1}</td>
      <td>${l.unit}</td>
      <td>${l.dfrom}–${l.dto}</td>
      <td>${colorDot}${l.munsell}</td>
      <td>${l.texture}</td>
      <td>${badge}</td>
      <td style="font-size:12px;color:var(--mu);max-width:120px;">${l.finds||'—'}</td>
      <td><button class="danger" onclick="removeLayer(${l.id})" style="margin-top:0;padding:3px 8px;font-size:11px;">×</button></td>
    </tr>`;
  });
}

function removeLayer(id){
  layers = layers.filter(l=>l.id!==id);
  renderTable();
  drawSection();
  if(layers.length===0){
    document.getElementById('tableCard').style.display='none';
    document.getElementById('vizCard').style.display='none';
    document.getElementById('harrisCard').style.display='none';
  }
}

function drawSection(){
  const canvas = document.getElementById('sectionCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  if(layers.length===0) return;

  const maxDepth = Math.max(...layers.map(l=>l.dto));
  const leftPad = 60, rightPad = 160, topPad = 20, botPad = 20;
  const drawH = H - topPad - botPad;
  const drawW = W - leftPad - rightPad;

  // background
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(leftPad, topPad, drawW, drawH);

  layers.forEach(l=>{
    const y1 = topPad + (l.dfrom/maxDepth)*drawH;
    const y2 = topPad + (l.dto/maxDepth)*drawH;
    ctx.fillStyle = munsellToColor(l.munsell);
    ctx.fillRect(leftPad, y1, drawW, y2-y1);

    // border
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(leftPad, y1, drawW, y2-y1);

    // texture pattern overlay
    if(l.texture==='sand'){
      ctx.fillStyle = 'rgba(255,220,100,0.08)';
      for(let px=leftPad+4;px<leftPad+drawW-4;px+=8){
        for(let py=y1+4;py<y2-4;py+=8){
          ctx.beginPath();ctx.arc(px,py,1,0,Math.PI*2);ctx.fill();
        }
      }
    } else if(l.texture==='gravel'){
      ctx.fillStyle='rgba(180,180,180,0.12)';
      for(let px=leftPad+6;px<leftPad+drawW-6;px+=14){
        for(let py=y1+6;py<y2-6;py+=10){
          ctx.beginPath();ctx.ellipse(px,py,4,3,0.5,0,Math.PI*2);ctx.fill();
        }
      }
    }

    // label
    const midY = (y1+y2)/2;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(leftPad+drawW+2, midY-10, rightPad-6, 20);
    ctx.fillStyle='#e2e8f0';
    ctx.font='11px Inter,system-ui,sans-serif';
    ctx.fillText(`${l.munsell}`, leftPad+drawW+6, midY+4);
  });

  // depth axis
  ctx.fillStyle='#6b7280';
  ctx.font='11px Inter,system-ui,sans-serif';
  const steps = 5;
  for(let i=0;i<=steps;i++){
    const d = Math.round((maxDepth/steps)*i);
    const y = topPad + (d/maxDepth)*drawH;
    ctx.fillText(d+'cm', 4, y+4);
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(leftPad,y);ctx.lineTo(leftPad+drawW,y);ctx.stroke();
  }

  // border
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  ctx.lineWidth=1;
  ctx.strokeRect(leftPad,topPad,drawW,drawH);
}

function exportHarris(){
  let out = 'HARRIS MATRIX — Stratigraphic Relationships\n';
  out += '='.repeat(50)+'\n\n';
  const sorted = [...layers].sort((a,b)=>a.dfrom-b.dfrom);
  sorted.forEach((l,i)=>{
    out += `[${String(i+1).padStart(3,'0')}] ${l.unit} | ${l.dfrom}–${l.dto}cm | ${l.interp.toUpperCase()}\n`;
    if(i<sorted.length-1){
      out += `       ABOVE\n`;
      out += `         ↓\n`;
    }
  });
  out += '\nSTRATIGRAPHIC SEQUENCE (top → bottom):\n';
  sorted.forEach((l,i)=>{
    out += `  ${i+1}. ${l.unit} (${l.dfrom}–${l.dto}cm) — ${l.interp}\n`;
    if(i<sorted.length-1) out += `     └─ overlies →\n`;
  });
  document.getElementById('harrisOut').value = out;
  document.getElementById('harrisCard').style.display='';
}

function exportCSV(){
  let csv = 'Layer,Unit,Depth_From_cm,Depth_To_cm,Munsell,Texture,Interpretation,Finds\n';
  layers.forEach((l,i)=>{
    const finds = l.finds.replace(/"/g,'""');
    csv += `${i+1},"${l.unit}",${l.dfrom},${l.dto},"${l.munsell}","${l.texture}","${l.interp}","${finds}"\n`;
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stratigraphy_layers.csv';
  a.click();
}

function clearAll(){
  if(!confirm('Clear all layers?')) return;
  layers=[];layerCount=0;
  renderTable();
  drawSection();
  document.getElementById('tableCard').style.display='none';
  document.getElementById('vizCard').style.display='none';
  document.getElementById('harrisCard').style.display='none';
}
</script>
</body>
</html>
