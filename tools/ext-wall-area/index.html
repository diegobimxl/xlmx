<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exterior Wall Area Calculator — XLMX</title><style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a78bfa;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Exterior Wall Area Calculator</h1><p class="sub">Architecture — Facade area by elevation with opening deductions</p><div class="card">
  <div id="elevations"></div>
  <button onclick="addElev()" style="background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--bd);">+ Add Elevation</button>
  <label style="margin-top:16px;">WINDOW-TO-WALL RATIO TARGET (%)</label>
  <input type="number" id="wwr-target" value="40" min="1" max="95" oninput="calc()">
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">GROSS FACADE</div><div class="rv" id="gross">—</div><div class="rs">m²</div></div>
    <div class="res"><div class="rl">OPAQUE (WALL)</div><div class="rv" id="opaque">—</div><div class="rs">m²</div></div>
    <div class="res"><div class="rl">OPENINGS (GLASS)</div><div class="rv" id="glass">—</div><div class="rs">m²</div></div>
  </div>
  <div class="g2" style="margin-top:12px;">
    <div class="res"><div class="rl">ACTUAL WWR</div><div class="rv" id="wwr">—</div></div>
    <div class="res"><div class="rl">WWR STATUS</div><div class="rv" id="wwr-status" style="font-size:16px;">—</div></div>
  </div>
  <div class="note" id="note"></div>
</div></div>
<script>let elevs=[
  {n:'North',w:40,h:18,openings:180},
  {n:'South',w:40,h:18,openings:280},
  {n:'East',w:25,h:18,openings:100},
  {n:'West',w:25,h:18,openings:80},
];
function addElev(){elevs.push({n:'New Elev',w:30,h:15,openings:100});renderElevs();}
function renderElevs(){
  document.getElementById('elevations').innerHTML=`<table class="tbl">
    <tr><th>ELEVATION</th><th style="text-align:right;">WIDTH (m)</th><th style="text-align:right;">HEIGHT (m)</th><th style="text-align:right;">OPENINGS (m²)</th><th style="text-align:right;">GROSS (m²)</th><th style="text-align:right;">WWR</th></tr>
    ${elevs.map((e,i)=>{
      const gross=e.w*e.h;
      const wwr=(e.openings/gross*100).toFixed(1);
      return `<tr>
        <td><input value="${e.n}" oninput="elevs[${i}].n=this.value" style="padding:5px 8px;width:80px;"></td>
        <td style="text-align:right;"><input type="number" value="${e.w}" oninput="elevs[${i}].w=+this.value;calc()" style="padding:5px 8px;width:65px;text-align:right;"></td>
        <td style="text-align:right;"><input type="number" value="${e.h}" oninput="elevs[${i}].h=+this.value;calc()" style="padding:5px 8px;width:65px;text-align:right;"></td>
        <td style="text-align:right;"><input type="number" value="${e.openings}" oninput="elevs[${i}].openings=+this.value;calc()" style="padding:5px 8px;width:75px;text-align:right;"></td>
        <td style="text-align:right;color:var(--mu);">${gross.toFixed(0)}</td>
        <td style="text-align:right;color:var(--acc);">${wwr}%</td>
      </tr>`;
    }).join('')}</table>`;
  calc();
}
function calc(){
  const tgt=+document.getElementById('wwr-target').value||40;
  const gross=elevs.reduce((a,e)=>a+e.w*e.h,0);
  const openings=elevs.reduce((a,e)=>a+e.openings,0);
  const opaque=gross-openings;
  const wwr=(openings/gross*100).toFixed(1);
  const diff=parseFloat(wwr)-tgt;
  const status=Math.abs(diff)<=3?'On Target ✓':diff>0?'Over Target ▲':'Under Target ▼';
  document.getElementById('gross').textContent=gross.toFixed(0);
  document.getElementById('opaque').textContent=opaque.toFixed(0);
  document.getElementById('glass').textContent=openings.toFixed(0);
  document.getElementById('wwr').textContent=wwr+'%';
  document.getElementById('wwr-status').textContent=status.split(' ')[0]+' '+status.split(' ')[1];
  document.getElementById('note').textContent=`Total facade: ${gross.toFixed(0)} m². WWR: ${wwr}% vs target ${tgt}%. ASHRAE 90.1 limit: 40% per orientation. High WWR improves daylight but increases thermal loads. ${diff>5?'Consider frit, fins, or overhangs to reduce solar gain.':'WWR within target range.'}`;
}
renderElevs();</script></body></html>
