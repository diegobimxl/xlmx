<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CVSS v3.1 Score Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.badge{display:inline-block;padding:6px 18px;border-radius:20px;font-size:14px;font-weight:700;}
.vector-str{font-family:monospace;font-size:12px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:6px;padding:10px 14px;word-break:break-all;margin-top:12px;color:#22d3ee;}
select option{background:#1a1a2e;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">&#8592; All Tools</a>
  <h1>CVSS v3.1 Score Calculator</h1>
  <p class="sub">Cybersecurity — Common Vulnerability Scoring System Base Score</p>

  <div class="card">
    <div style="color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:4px;">EXPLOITABILITY METRICS</div>
    <div class="grid2">
      <div>
        <label>ATTACK VECTOR (AV)</label>
        <select id="AV" onchange="calc()">
          <option value="N">Network (N)</option>
          <option value="A">Adjacent (A)</option>
          <option value="L">Local (L)</option>
          <option value="P">Physical (P)</option>
        </select>
      </div>
      <div>
        <label>ATTACK COMPLEXITY (AC)</label>
        <select id="AC" onchange="calc()">
          <option value="L">Low (L)</option>
          <option value="H">High (H)</option>
        </select>
      </div>
      <div>
        <label>PRIVILEGES REQUIRED (PR)</label>
        <select id="PR" onchange="calc()">
          <option value="N">None (N)</option>
          <option value="L">Low (L)</option>
          <option value="H">High (H)</option>
        </select>
      </div>
      <div>
        <label>USER INTERACTION (UI)</label>
        <select id="UI" onchange="calc()">
          <option value="N">None (N)</option>
          <option value="R">Required (R)</option>
        </select>
      </div>
    </div>

    <div style="color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-top:20px;margin-bottom:4px;">IMPACT METRICS</div>
    <div class="grid2">
      <div>
        <label>SCOPE (S)</label>
        <select id="S" onchange="calc()">
          <option value="U">Unchanged (U)</option>
          <option value="C">Changed (C)</option>
        </select>
      </div>
      <div></div>
      <div>
        <label>CONFIDENTIALITY (C)</label>
        <select id="C" onchange="calc()">
          <option value="N">None (N)</option>
          <option value="L">Low (L)</option>
          <option value="H" selected>High (H)</option>
        </select>
      </div>
      <div>
        <label>INTEGRITY (I)</label>
        <select id="I" onchange="calc()">
          <option value="N">None (N)</option>
          <option value="L">Low (L)</option>
          <option value="H" selected>High (H)</option>
        </select>
      </div>
      <div>
        <label>AVAILABILITY (A)</label>
        <select id="A" onchange="calc()">
          <option value="N">None (N)</option>
          <option value="L">Low (L)</option>
          <option value="H" selected>High (H)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
      <div>
        <div class="r-label">BASE SCORE</div>
        <div class="r-val" id="score">—</div>
      </div>
      <div>
        <div class="r-label">SEVERITY</div>
        <div id="badge" style="margin-top:6px;">—</div>
      </div>
    </div>
    <div class="r-label" style="margin-top:16px;">VECTOR STRING</div>
    <div class="vector-str" id="vector">—</div>
  </div>

  <div class="card">
    <div style="color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:10px;">SEVERITY SCALE</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr>
        <th style="text-align:left;color:var(--mu);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--bd);">Range</th>
        <th style="text-align:left;color:var(--mu);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--bd);">Severity</th>
      </tr></thead>
      <tbody>
        <tr><td style="padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);">0.0</td><td style="padding:7px 8px;color:var(--mu);">None</td></tr>
        <tr><td style="padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);">0.1 – 3.9</td><td style="padding:7px 8px;color:#22d3ee;">Low</td></tr>
        <tr><td style="padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);">4.0 – 6.9</td><td style="padding:7px 8px;color:#f97316;">Medium</td></tr>
        <tr><td style="padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);">7.0 – 8.9</td><td style="padding:7px 8px;color:#ef4444;">High</td></tr>
        <tr><td style="padding:7px 8px;">9.0 – 10.0</td><td style="padding:7px 8px;color:#dc2626;font-weight:700;">Critical</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
// CVSS v3.1 numeric values
const AV_v={N:0.85,A:0.62,L:0.55,P:0.2};
const AC_v={L:0.77,H:0.44};
const PR_vU={N:0.85,L:0.62,H:0.27};
const PR_vC={N:0.85,L:0.68,H:0.50};
const UI_v={N:0.85,R:0.62};
const CIA_v={N:0,L:0.22,H:0.56};

function roundUp(x){
  const v=Math.round(x*100000);
  if(v%10000===0) return v/100000;
  return (Math.floor(v/10000)+1)/10;
}

function calc(){
  const av=document.getElementById('AV').value;
  const ac=document.getElementById('AC').value;
  const pr=document.getElementById('PR').value;
  const ui=document.getElementById('UI').value;
  const s=document.getElementById('S').value;
  const c=document.getElementById('C').value;
  const ii=document.getElementById('I').value;
  const a=document.getElementById('A').value;

  const PR_v=s==='C'?PR_vC:PR_vU;

  const ISS=1-(1-CIA_v[c])*(1-CIA_v[ii])*(1-CIA_v[a]);
  let Impact;
  if(s==='U') Impact=6.42*ISS;
  else Impact=7.52*(ISS-0.029)-3.25*Math.pow(ISS-0.02,15);

  const Exploitability=8.22*AV_v[av]*AC_v[ac]*PR_v[pr]*UI_v[ui];

  let score;
  if(Impact<=0){score=0;}
  else if(s==='U'){score=roundUp(Math.min(Impact+Exploitability,10));}
  else{score=roundUp(Math.min(1.08*(Impact+Exploitability),10));}

  document.getElementById('score').textContent=score.toFixed(1);

  let sev,col;
  if(score===0){sev='None';col='var(--mu)';}
  else if(score<4){sev='Low';col='#22d3ee';}
  else if(score<7){sev='Medium';col='#f97316';}
  else if(score<9){sev='High';col='#ef4444';}
  else{sev='Critical';col='#dc2626';}

  document.getElementById('badge').innerHTML=`<span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}44;">${sev}</span>`;
  document.getElementById('score').style.color=col;

  const vec=`CVSS:3.1/AV:${av}/AC:${ac}/PR:${pr}/UI:${ui}/S:${s}/C:${c}/I:${ii}/A:${a}`;
  document.getElementById('vector').textContent=vec;
}
calc();
</script>
</body>
</html>
