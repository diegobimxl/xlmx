<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Area Planner — XLMX</title><style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a78bfa;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Program Area Planner</h1><p class="sub">Architecture — Build a space program with categories and area totals</p><div class="card">
  <div class="g2">
    <div><label>PROJECT NAME</label><input id="projname" value="New Project"></div>
    <div><label>UNIT</label><select id="unit" onchange="calc()"><option value="m2">m²</option><option value="sf">SF</option></select></div>
  </div>
</div>
<div class="card">
  <div id="program"></div>
  <button onclick="addRow()" style="background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--bd);margin-top:8px;">+ Add Space</button>
  <button onclick="addCat()" style="background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--bd);margin-top:8px;margin-left:8px;">+ New Category</button>
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">TOTAL NET AREA</div><div class="rv" id="total-net">—</div></div>
    <div class="res"><div class="rl">GROSS (×1.25)</div><div class="rv" id="total-gross">—</div></div>
    <div class="res"><div class="rl">CATEGORIES</div><div class="rv" id="num-cats">—</div></div>
  </div>
  <div id="cat-summary" style="margin-top:12px;"></div>
</div></div>
<script>let program=[
  {cat:'Public',n:'Entry Lobby',qty:1,area:80},
  {cat:'Public',n:'Reception',qty:1,area:25},
  {cat:'Work',n:'Open Office',qty:1,area:300},
  {cat:'Work',n:'Private Offices',qty:6,area:18},
  {cat:'Meeting',n:'Large Conference',qty:2,area:50},
  {cat:'Meeting',n:'Small Huddle Rooms',qty:4,area:12},
  {cat:'Support',n:'Break Room',qty:1,area:35},
  {cat:'Support',n:'Storage / Print',qty:2,area:15},
];
function addRow(){program.push({cat:'Work',n:'New Space',qty:1,area:20});renderProg();}
function addCat(){const c=prompt('Category name:','New Category');if(c){program.push({cat:c,n:'Space',qty:1,area:20});renderProg();}}
function renderProg(){
  document.getElementById('program').innerHTML=`<table class="tbl">
    <tr><th>CATEGORY</th><th>SPACE</th><th style="text-align:right;">QTY</th><th style="text-align:right;">UNIT AREA</th><th style="text-align:right;">TOTAL</th></tr>
    ${program.map((r,i)=>`<tr>
      <td><input value="${r.cat}" oninput="program[${i}].cat=this.value;calc()" style="padding:5px 8px;"></td>
      <td><input value="${r.n}" oninput="program[${i}].n=this.value" style="padding:5px 8px;"></td>
      <td style="text-align:right;"><input type="number" value="${r.qty}" min="1" oninput="program[${i}].qty=+this.value;calc()" style="padding:5px 8px;width:55px;text-align:right;"></td>
      <td style="text-align:right;"><input type="number" value="${r.area}" min="1" step="0.5" oninput="program[${i}].area=+this.value;calc()" style="padding:5px 8px;width:75px;text-align:right;"></td>
      <td style="text-align:right;color:var(--acc);font-weight:600;">${(r.qty*r.area).toFixed(1)}</td>
    </tr>`).join('')}</table>`;
  calc();
}
function calc(){
  const unit=document.getElementById('unit').value;
  const u=unit==='sf'?'SF':'m²';
  const net=program.reduce((a,r)=>a+r.qty*r.area,0);
  const gross=net*1.25;
  const cats={};
  program.forEach(r=>{cats[r.cat]=(cats[r.cat]||0)+r.qty*r.area;});
  document.getElementById('total-net').textContent=net.toFixed(0)+' '+u;
  document.getElementById('total-gross').textContent=gross.toFixed(0)+' '+u;
  document.getElementById('num-cats').textContent=Object.keys(cats).length;
  document.getElementById('cat-summary').innerHTML=Object.entries(cats).map(([k,v])=>`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:4px;">
      <span style="width:140px;font-size:12px;color:var(--mu);">${k}</span>
      <div style="flex:1;background:rgba(255,255,255,.04);border-radius:3px;height:8px;">
        <div style="width:${(v/net*100).toFixed(0)}%;height:100%;background:var(--acc);border-radius:3px;"></div>
      </div>
      <span style="font-size:12px;color:var(--mu);width:100px;text-align:right;">${v.toFixed(0)} ${u} (${(v/net*100).toFixed(0)}%)</span>
    </div>`).join('');
}
renderProg();</script></body></html>
