<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid System Builder - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Grid System Builder</h1><p class="sub">Design — Column Grids with Gutters and Margins</p><div class="card"><h3>Grid Settings</h3><div class="g2"><div><label>Container Width (px)</label><input type="number" id="cw" value="1200"></div><div><label>Columns</label><input type="number" id="cols" value="12" min="1" max="24"></div><div><label>Gutter (px)</label><input type="number" id="gut" value="24"></div><div><label>Margin (px)</label><input type="number" id="mar" value="48"></div></div><button onclick="calc()">Build Grid</button></div><div id="out"></div></div><script>function calc(){const cw=+document.getElementById('cw').value;const cols=+document.getElementById('cols').value;const gut=+document.getElementById('gut').value;const mar=+document.getElementById('mar').value;const usable=cw-2*mar;const colW=(usable-(cols-1)*gut)/cols;const pct=(colW/cw*100).toFixed(2);const scale=[1,2,3,4,6,8,12].filter(n=>n<=cols);let html=`<div class="card"><h3>Grid Specs</h3><p style="font-size:.88rem;margin-bottom:.75rem">Container: ${cw}px | Usable: ${usable}px | Column: ${colW.toFixed(1)}px (${pct}%)</p>`;html+='<div style="display:flex;gap:'+gut+'px;margin-bottom:1rem;padding:0 '+mar+'px">';for(let i=0;i<Math.min(cols,12);i++){html+=`<div style="flex:1;background:var(--acc);opacity:.3;height:32px;border-radius:3px"></div>`;}html+='</div>';html+='<p style="font-size:.8rem;color:var(--mu);margin-bottom:.5rem">Common spans</p><div style="display:flex;flex-wrap:wrap;gap:.4rem">';scale.forEach(n=>{const w=(colW*n+gut*(n-1)).toFixed(0);html+=`<div style="background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:5px;padding:.3rem .6rem;font-size:.82rem">${n} col = ${w}px</div>`;});html+='</div></div>';document.getElementById('out').innerHTML=html;}</script></body></html>
