<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e5e5e5;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:24px 16px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.sub{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:600;color:#f59e0b;margin-bottom:14px}
label{display:block;font-size:.8rem;color:#aaa;margin-bottom:4px;margin-top:10px}
input,select,textarea{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e5e5e5;padding:8px 10px;font-size:.9rem}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.event-form{background:#1a1a1a;border-radius:8px;padding:14px;margin-bottom:10px}
.btn{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.85rem;border:none}
.btn-add{background:#f59e0b;color:#000;font-weight:700}
.btn-clear{background:#1a1a1a;border:1px solid #555;color:#aaa}
.tl-wrap{overflow-x:auto;padding:10px 0}
.timeline{position:relative;min-height:80px;padding:20px 0}
.tl-line{position:absolute;left:0;right:0;top:50%;height:3px;background:#333;border-radius:2px}
.tl-events{display:flex;align-items:flex-start;gap:0;position:relative;min-height:120px}
.tl-event{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tl-dot{width:14px;height:14px;border-radius:50%;border:3px solid #0d0d0d;margin:0 auto;position:relative;z-index:2}
.tl-label{font-size:.72rem;max-width:80px;text-align:center;margin-top:6px;line-height:1.3}
.tl-date{font-size:.68rem;color:#888;margin-top:2px}
.tl-above .tl-label{margin-top:0;margin-bottom:6px;order:-1}
.tl-above .tl-date{order:-2}
.tl-event:hover .tl-dot{transform:scale(1.4)}
.cat-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;margin-bottom:4px}
.del-btn{background:none;border:none;color:#555;cursor:pointer;font-size:.9rem;margin-left:6px}
.del-btn:hover{color:#ef4444}
.event-list{margin-top:10px}
.ev-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a1a1a;border-radius:6px;margin-bottom:6px;font-size:.82rem}
.ev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ev-info{flex:1}
.ev-title{font-weight:600}
.ev-date{color:#888;font-size:.75rem}
</style>
</head>
<body>
<h1>Timeline Builder</h1>
<p class="sub">Create visual historical or project timelines</p>

<div class="card">
  <h2>Add Event</h2>
  <div class="event-form">
    <div class="row2">
      <div><label>Event date</label><input type="date" id="evDate"></div>
      <div><label>Category</label>
        <select id="evCat">
          <option value="History">History</option>
          <option value="Tech">Technology</option>
          <option value="Politics">Politics</option>
          <option value="Science">Science</option>
          <option value="Culture">Culture</option>
          <option value="Project">Project</option>
          <option value="Personal">Personal</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <label>Event title</label>
    <input type="text" id="evTitle" placeholder="Event name...">
    <label>Description (optional)</label>
    <textarea id="evDesc" style="min-height:50px" placeholder="Brief description..."></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-add" onclick="addEvent()">Add Event</button>
      <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>Timeline</h2>
  <div class="tl-wrap">
    <div class="timeline" id="timeline">
      <div class="tl-line"></div>
      <div class="tl-events" id="tlEvents"></div>
    </div>
  </div>
  <div class="event-list" id="eventList"></div>
</div>

<script>
const CAT_COLORS={
  History:  '#f59e0b',
  Tech:     '#3b82f6',
  Politics: '#ef4444',
  Science:  '#22c55e',
  Culture:  '#8b5cf6',
  Project:  '#14b8a6',
  Personal: '#f97316',
  Other:    '#888',
};
let events=[];
// Pre-load some sample events
const SAMPLES=[
  {date:'1969-07-20',title:'Moon Landing',cat:'History',desc:'Apollo 11 lands on the Moon'},
  {date:'1989-11-09',title:'Berlin Wall Falls',cat:'Politics',desc:'End of the Cold War era'},
  {date:'1991-08-06',title:'World Wide Web',cat:'Tech',desc:'Tim Berners-Lee publishes WWW'},
  {date:'2001-09-11',title:'9/11 Attacks',cat:'History',desc:'Attacks on the United States'},
  {date:'2007-06-29',title:'iPhone Launch',cat:'Tech',desc:'First iPhone released by Apple'},
  {date:'2020-03-11',title:'COVID Pandemic',cat:'Science',desc:'WHO declares global pandemic'},
];
SAMPLES.forEach(s=>events.push({...s,id:Math.random().toString(36).slice(2)}));
function addEvent(){
  const date=document.getElementById('evDate').value;
  const title=document.getElementById('evTitle').value.trim();
  const cat=document.getElementById('evCat').value;
  const desc=document.getElementById('evDesc').value.trim();
  if(!date||!title)return;
  events.push({id:Math.random().toString(36).slice(2),date,title,cat,desc});
  document.getElementById('evTitle').value='';
  document.getElementById('evDesc').value='';
  render();
}
function removeEvent(id){events=events.filter(e=>e.id!==id);render();}
function clearAll(){events=[];render();}
function render(){
  const sorted=[...events].sort((a,b)=>a.date<b.date?-1:1);
  if(sorted.length===0){
    document.getElementById('tlEvents').innerHTML='<div style="color:#555;font-size:.82rem;padding:20px 0 0 0">No events yet.</div>';
    document.getElementById('eventList').innerHTML='';
    return;
  }
  const minT=new Date(sorted[0].date).getTime();
  const maxT=new Date(sorted[sorted.length-1].date).getTime();
  const span=maxT-minT||1;
  let tlHtml='';
  const tW=Math.max(600,sorted.length*100);
  document.getElementById('timeline').style.width=tW+'px';
  sorted.forEach((ev,i)=>{
    const t=new Date(ev.date).getTime();
    const pct=span>0?(t-minT)/span*90+5:50;
    const above=i%2===0;
    const col=CAT_COLORS[ev.cat]||'#888';
    const d=new Date(ev.date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
    tlHtml+=`<div class="tl-event ${above?'':'tl-above'}" style="left:${pct}%;top:${above?'50%':'auto'};bottom:${above?'auto':'50%'};transform:translateX(-50%)">
      <div class="tl-dot" style="background:${col}"></div>
      <div class="tl-label" style="color:#e5e5e5">${ev.title}</div>
      <div class="tl-date">${d}</div>
    </div>`;
  });
  document.getElementById('tlEvents').innerHTML=tlHtml;
  document.getElementById('timeline').style.position='relative';

  // List
  let listHtml='';
  sorted.forEach(ev=>{
    const col=CAT_COLORS[ev.cat]||'#888';
    const d=new Date(ev.date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
    listHtml+=`<div class="ev-item">
      <div class="ev-dot" style="background:${col}"></div>
      <div class="ev-info">
        <div class="ev-title">${ev.title} <span class="cat-chip" style="background:${col}22;color:${col}">${ev.cat}</span></div>
        <div class="ev-date">${d}${ev.desc?' — '+ev.desc:''}</div>
      </div>
      <button class="del-btn" onclick="removeEvent('${ev.id}')">✕</button>
    </div>`;
  });
  document.getElementById('eventList').innerHTML=listHtml;
}
// Set default date to today
document.getElementById('evDate').valueAsDate=new Date();
render();
</script>
</body>
</html>
