<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISO 19650 Compliance Checklist — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#38bdf8;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
btn,button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.pass{background:rgba(34,197,94,.12);color:#4ade80;}
.fail{background:rgba(248,113,113,.12);color:#f87171;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;}
</style></head>
<body><div class="wrap">
<a class="back" href="/tools/">← Library</a>
<h1>ISO 19650 Compliance Checklist</h1><p class="sub">BIM — Interactive information management checklist across project stages</p>
<div class="card">
  <label>PROJECT STAGE</label>
  <select id="stage" onchange="loadStage()">
    <option value="appt">Appointment (pre-contract)</option>
    <option value="mob">Mobilization</option>
    <option value="prod">Production</option>
    <option value="delivery">Delivery & Closeout</option>
  </select>
</div>
<div class="card" id="checklist-card">
  <div id="checklist"></div>
  <div class="g3" style="margin-top:16px;">
    <div class="res"><div class="rl">COMPLETE</div><div class="rv" id="pct-done">—</div></div>
    <div class="res"><div class="rl">ITEMS DONE</div><div class="rv" id="items-done">—</div></div>
    <div class="res"><div class="rl">STATUS</div><div class="rv" id="status" style="font-size:14px;">—</div></div>
  </div>
  <div class="note" id="note"></div>
</div>
</div><script>const STAGES={
  appt:[
    {s:'EIR',i:'Exchange Information Requirements issued to team'},
    {s:'BEP Pre',i:'Pre-contract BIM Execution Plan submitted'},
    {s:'CDE',i:'Common Data Environment defined and accessible'},
    {s:'Roles',i:'Information Manager and BIM leads assigned'},
    {s:'Standards',i:'Project BIM Standards document agreed'},
    {s:'MIDP',i:'Master Information Delivery Plan (MIDP) created'},
  ],
  mob:[
    {s:'CDE Setup',i:'CDE folder structure and naming convention live'},
    {s:'BEP Post',i:'Post-contract BEP finalized and issued'},
    {s:'TIDP',i:'Task Information Delivery Plans issued per discipline'},
    {s:'Training',i:'Team trained on CDE protocols and naming standard'},
    {s:'Templates',i:'Title block, sheet, and family templates distributed'},
    {s:'Clash',i:'Coordination workflow and clash tolerance agreed'},
  ],
  prod:[
    {s:'Naming',i:'All containers follow ISO 19650 naming convention'},
    {s:'Status',i:'Container statuses used correctly (WIP/S0/S1/S2/S3)'},
    {s:'Reviews',i:'Information review cycle in place per MIDP schedule'},
    {s:'Clash',i:'Regular clash detection sessions conducted and logged'},
    {s:'Change',i:'Change control process followed for all revisions'},
    {s:'Archive',i:'Superseded information archived, not deleted'},
    {s:'LOD',i:'Model LOD matches contracted requirements per phase'},
  ],
  delivery:[
    {s:'As-Built',i:'As-built information updated and verified'},
    {s:'COBie',i:'COBie data extracted and validated if required'},
    {s:'Archive',i:'Full project archive in CDE with correct status codes'},
    {s:'O&M',i:'O&M manuals linked to model elements if applicable'},
    {s:'Handover',i:'Client handover package prepared and signed off'},
    {s:'Lessons',i:'Lessons learned captured in project closeout report'},
  ]
};
const checked={};
function loadStage(){
  const s=document.getElementById('stage').value;
  const items=STAGES[s];
  document.getElementById('checklist').innerHTML=items.map((it,i)=>`
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);">
      <input type="checkbox" id="chk-${s}-${i}" onchange="tally()" style="width:16px;height:16px;accent-color:var(--acc);cursor:pointer;flex-shrink:0;">
      <div>
        <span style="font-size:12px;font-weight:600;color:var(--acc);margin-right:8px;">${it.s}</span>
        <span style="font-size:13px;color:var(--tx);">${it.i}</span>
      </div>
    </div>`).join('');
  tally();
}
function tally(){
  const s=document.getElementById('stage').value;
  const items=STAGES[s];
  const done=items.filter((_,i)=>document.getElementById('chk-'+s+'-'+i)?.checked).length;
  const pct=Math.round(done/items.length*100);
  const status=pct===100?'Compliant ✓':pct>=75?'Almost Ready':pct>=50?'In Progress':'Not Started';
  document.getElementById('pct-done').textContent=pct+'%';
  document.getElementById('items-done').textContent=done+'/'+items.length;
  document.getElementById('status').textContent=status;
  document.getElementById('note').textContent=`ISO 19650-2 stage: ${document.getElementById('stage').options[document.getElementById('stage').selectedIndex].text}. ${done}/${items.length} items complete. ${pct<100?'Outstanding: '+(items.length-done)+' items. Address before stage gate.':'All items confirmed — stage gate ready.'}`;
}
loadStage();</script></body></html>
