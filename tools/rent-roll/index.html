<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Roll Builder - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#c8a96e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Rent Roll Builder</h1><p class="sub">Real Estate & Development — Property Income Schedule</p><div class="card"><h3>Add Tenant</h3><div class="g2"><div><label>Tenant Name</label><input type="text" id="tn" placeholder="Tenant Co."></div><div><label>Suite</label><input type="text" id="su" placeholder="101"></div><div><label>SF</label><input type="number" id="sf" value="2000"></div><div><label>Rent $/SF/yr</label><input type="number" id="rsf" value="24"></div><div><label>Start</label><input type="date" id="st"></div><div><label>Expiration</label><input type="date" id="ex"></div></div><button onclick="add()">Add Tenant</button><button onclick="clr()" style="background:rgba(255,255,255,.1);color:var(--tx);margin-left:.5rem">Clear</button></div><div class="card"><h3>Rent Roll</h3><div id="rd"><p style="color:var(--mu);font-size:.85rem">No tenants added yet.</p></div></div></div><script>let roll=[];function add(){const t={n:document.getElementById('tn').value||'Tenant',s:document.getElementById('su').value||'-',sf:+document.getElementById('sf').value||0,rsf:+document.getElementById('rsf').value||0,st:document.getElementById('st').value,ex:document.getElementById('ex').value};t.ann=t.sf*t.rsf;roll.push(t);render();}function clr(){roll=[];render();}function render(){if(!roll.length){document.getElementById('rd').innerHTML='<p style="color:var(--mu);font-size:.85rem">No tenants added yet.</p>';return;}const tsf=roll.reduce((a,r)=>a+r.sf,0);const tann=roll.reduce((a,r)=>a+r.ann,0);let h='<table class="tbl"><tr><th>Tenant</th><th>Suite</th><th>SF</th><th>$/SF</th><th>Annual</th><th>Exp.</th></tr>';roll.forEach(r=>{h+=`<tr><td>${r.n}</td><td>${r.s}</td><td>${r.sf.toLocaleString()}</td><td>$${r.rsf}</td><td>$${Math.round(r.ann).toLocaleString()}</td><td>${r.ex||'-'}</td></tr>`;});h+=`<tr style="font-weight:600"><td>TOTAL</td><td>-</td><td>${tsf.toLocaleString()}</td><td>$${tsf?(tann/tsf).toFixed(2):0}</td><td>$${Math.round(tann).toLocaleString()}</td><td>-</td></tr></table>`;document.getElementById('rd').innerHTML=h;}</script></body></html>
