<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire Sprinkler Density Checker — XLMX</title>
<style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#22d3ee;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>Fire Sprinkler Density Checker</h1><p class="sub">Engineering — Verify density against NFPA 13 hazard requirements</p>
<div class="card">
  <div class="g2">
    <div>
      <label>HAZARD CLASSIFICATION</label>
      <select id="haz" onchange="calc()">
        <option value="loh">Light Hazard — Offices, schools, restaurants</option>
        <option value="oh1">Ordinary Hazard Group 1 — Parking, laundries</option>
        <option value="oh2">Ordinary Hazard Group 2 — Wood shops, auto service</option>
        <option value="eh">Extra Hazard Group 1 — Flammable liquids</option>
        <option value="eh2">Extra Hazard Group 2 — Flammable aerosols</option>
      </select>
    </div>
    <div><label>DESIGN AREA (m²)</label><input type="number" id="darea" value="139" oninput="calc()"></div>
  </div>
  <div class="g2">
    <div><label>SPRINKLER SPACING (m × m)</label><input type="number" id="spacing" value="4.6" step="0.1" oninput="calc()"></div>
    <div><label>RESIDUAL PRESSURE (psi)</label><input type="number" id="psi" value="30" oninput="calc()"></div>
  </div>
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">REQ. DENSITY</div><div class="rv" id="req-d">—</div><div class="rs">gpm/ft²</div></div>
    <div class="res"><div class="rl">HEADS IN AREA</div><div class="rv" id="heads">—</div></div>
    <div class="res"><div class="rl">DESIGN FLOW</div><div class="rv" id="flow">—</div><div class="rs">gpm</div></div>
  </div>
  <div class="g2" style="margin-top:12px;">
    <div class="res"><div class="rl">MAX SPACING CHECK</div><div class="rv" id="sp-check" style="font-size:16px;">—</div></div>
    <div class="res"><div class="rl">K-FACTOR (min est.)</div><div class="rv" id="kfact">—</div></div>
  </div>
  <div class="note" id="note"></div>
</div>
</div><script>// NFPA 13 density / area curves — representative points
const HAZ={
  loh:{dens:0.10,maxArea:1500,maxSpacing:225,name:'Light Hazard'},
  oh1:{dens:0.15,maxArea:1500,maxSpacing:130,name:'Ordinary Hazard Gp 1'},
  oh2:{dens:0.20,maxArea:1500,maxSpacing:130,name:'Ordinary Hazard Gp 2'},
  eh:{dens:0.30,maxArea:2500,maxSpacing:100,name:'Extra Hazard Gp 1'},
  eh2:{dens:0.40,maxArea:2500,maxSpacing:100,name:'Extra Hazard Gp 2'},
};
function calc(){
  const h=document.getElementById('haz').value;
  const darea=+document.getElementById('darea').value;
  const spacing=+document.getElementById('spacing').value;
  const psi=+document.getElementById('psi').value;
  const hd=HAZ[h];
  const dareaFt2=darea*10.764;
  const spacingFt2=(spacing*3.281)**2;
  const heads=Math.ceil(dareaFt2/spacingFt2);
  const flow=hd.dens*dareaFt2;
  const spOk=spacingFt2<=hd.maxSpacing;
  // K = Q / sqrt(P)
  const qPerHead=flow/heads;
  const k=(qPerHead/Math.sqrt(psi)).toFixed(1);
  document.getElementById('req-d').textContent=hd.dens;
  document.getElementById('heads').textContent=heads;
  document.getElementById('flow').textContent=flow.toFixed(0);
  document.getElementById('sp-check').textContent=spOk?'OK ✓':'Too Wide ✗';
  document.getElementById('sp-check').style.color=spOk?'var(--acc)':'#f87171';
  document.getElementById('kfact').textContent='K-'+k;
  document.getElementById('note').textContent=`${hd.name}. Design area: ${darea}m² (${dareaFt2.toFixed(0)}ft²). Density: ${hd.dens} gpm/ft². Total flow: ${flow.toFixed(0)} gpm over ${heads} heads. K-factor estimate: K-${k} at ${psi} psi. Verify with NFPA 13 hydraulic calculation — remote area method. Max spacing NFPA 13: ${hd.maxSpacing} ft² (${(hd.maxSpacing/10.764).toFixed(1)}m²).`;
}
calc();</script></body></html>
