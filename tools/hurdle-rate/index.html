<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hurdle Rate Checker - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#c8a96e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Hurdle Rate Checker</h1><p class="sub">Real Estate & Development — Deal Qualification Gate</p><div class="card"><h3>Deal Metrics</h3><div class="g2"><div><label>Projected IRR (%)</label><input type="number" id="irr" value="18" step="0.5"></div><div><label>Hurdle IRR (%)</label><input type="number" id="hirr" value="15" step="0.5"></div><div><label>Equity Multiple</label><input type="number" id="em" value="2.1" step="0.1"></div><div><label>Min Equity Multiple</label><input type="number" id="hem" value="1.8" step="0.1"></div><div><label>Cash-on-Cash (%)</label><input type="number" id="coc" value="8" step="0.5"></div><div><label>Min CoC (%)</label><input type="number" id="hcoc" value="7" step="0.5"></div></div><button onclick="calc()">Check Hurdles</button></div><div class="card"><h3>Verdict</h3><div id="vd"></div></div></div><script>function calc(){const tests=[{l:'IRR',v:+document.getElementById('irr').value,h:+document.getElementById('hirr').value,u:'%'},{l:'Equity Multiple',v:+document.getElementById('em').value,h:+document.getElementById('hem').value,u:'x'},{l:'Cash-on-Cash',v:+document.getElementById('coc').value,h:+document.getElementById('hcoc').value,u:'%'}];let html='<table class="tbl"><tr><th>Metric</th><th>Hurdle</th><th>Projected</th><th>Result</th></tr>';let pass=true;tests.forEach(t=>{const ok=t.v>=t.h;if(!ok)pass=false;html+=`<tr><td>${t.l}</td><td>${t.h}${t.u}</td><td>${t.v}${t.u}</td><td class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</td></tr>`;});html+='</table><div class="note" style="border-color:'+(pass?'#22c55e':'#ef4444')+'"><b>'+(pass?'DEAL CLEARS ALL HURDLES':'DEAL FAILS HURDLE TEST')+'</b></div>';document.getElementById('vd').innerHTML=html;}</script></body></html>
