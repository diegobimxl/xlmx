<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave Energy Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#0ea5e9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Wave Energy Calculator</h1>
  <p class="sub">Oceanography — Wave power, energy flux, and resource potential</p>
  <div class="card">
    <div class="grid2">
      <div>
        <label>SIGNIFICANT WAVE HEIGHT Hₛ (m)</label>
        <input type="number" id="Hs" value="2.5" step="0.1" oninput="calc()">
      </div>
      <div>
        <label>PEAK WAVE PERIOD Tₚ (s)</label>
        <input type="number" id="Tp" value="10" step="0.5" oninput="calc()">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>WATER DEPTH d (m)</label>
        <input type="number" id="depth" value="50" oninput="calc()">
      </div>
      <div>
        <label>COASTLINE LENGTH (km)</label>
        <input type="number" id="coast" value="10" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">WAVE POWER J (kW/m)</div>
        <div class="r-val" id="J">—</div>
      </div>
      <div class="result">
        <div class="r-label">WAVELENGTH λ (m)</div>
        <div class="r-val" id="wl">—</div>
      </div>
      <div class="result">
        <div class="r-label">TOTAL RESOURCE (MW)</div>
        <div class="r-val" id="total">—</div>
        <div class="r-sub">along coastline</div>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function calc(){
  const Hs=+document.getElementById('Hs').value;
  const Tp=+document.getElementById('Tp').value;
  const d=+document.getElementById('depth').value;
  const coast=+document.getElementById('coast').value;
  const rho=1025, g=9.81;
  // Deep water approximation: J = rho*g^2*Hs^2*Tp / (64*pi)
  const J=(rho*g*g*Hs*Hs*Tp)/(64*Math.PI)/1000; // kW/m
  // Wavelength (deep water): lambda = g*Tp^2 / (2*pi)
  const lambda=(g*Tp*Tp)/(2*Math.PI);
  // Check deep/shallow
  const kd=2*Math.PI*d/lambda;
  const shallow=kd<Math.PI/10;
  const total=J*coast*1000/1000; // MW
  document.getElementById('J').textContent=J.toFixed(2);
  document.getElementById('wl').textContent=lambda.toFixed(1);
  document.getElementById('total').textContent=total.toFixed(1);
  const regime=kd<0.3?'Shallow water':kd>3?'Deep water':'Transitional';
  document.getElementById('note').textContent=`${regime} (kd=${kd.toFixed(2)}). Wave power J = ρg²Hₛ²Tₚ/(64π) = ${J.toFixed(2)} kW/m. ${coast} km coastline → ${total.toFixed(1)} MW theoretical resource. Global wave energy resource ~2 TW. Capture efficiency of converters typically 25–40%.`;
}
calc();
</script>
</body>
</html>
