<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Agenda Builder - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#9ca3af}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Meeting Agenda Builder</h1><p class="sub">General Productivity — Timed Topics with Presenter Blocks</p><div class="card"><h3>Meeting Details</h3><div class="g2"><div><label>Meeting Title</label><input type="text" id="mt" placeholder="BIM Coordination Review"></div><div><label>Date and Time</label><input type="datetime-local" id="dt"></div><div><label>Location / Link</label><input type="text" id="loc" placeholder="ACC Meeting Room / Zoom"></div><div><label>Total Duration (min)</label><input type="number" id="tot" value="60"></div></div></div><div class="card"><h3>Agenda Items</h3><div id="items"><div class="g3" style="margin-bottom:.5rem"><input placeholder="Topic" class="ti"><input type="number" placeholder="Min" class="tm" value="10"><input placeholder="Presenter" class="tp"></div></div><button onclick="addItem()" style="background:rgba(255,255,255,.1);color:var(--tx)">+ Add Item</button><button onclick="gen()" style="margin-left:.5rem">Build Agenda</button></div><div id="out"></div></div><script>function addItem(){const d=document.getElementById('items');const r=document.createElement('div');r.className='g3';r.style.marginBottom='.5rem';r.innerHTML='<input placeholder="Topic" class="ti"><input type="number" placeholder="Min" class="tm" value="10"><input placeholder="Presenter" class="tp">';d.appendChild(r);}function gen(){const mt=document.getElementById('mt').value||'Meeting';const dt=document.getElementById('dt').value||'TBD';const loc=document.getElementById('loc').value||'TBD';const tot=+document.getElementById('tot').value||60;const tis=[...document.querySelectorAll('.ti')].map(i=>i.value);const tms=[...document.querySelectorAll('.tm')].map(i=>+i.value||0);const tps=[...document.querySelectorAll('.tp')].map(i=>i.value);let rows='';let running=0;tis.forEach((ti,i)=>{if(!ti)return;running+=tms[i];rows+=`<tr><td>${ti}</td><td>${tms[i]} min</td><td>${tps[i]||'—'}</td></tr>`;});const used=tms.reduce((a,b)=>a+b,0);const remain=tot-used;document.getElementById('out').innerHTML=`<div class="card"><h3>${mt}</h3><p style="font-size:.85rem;color:var(--mu);margin-bottom:.75rem">${dt} | ${loc} | ${tot} min total</p><table class="tbl"><tr><th>Topic</th><th>Time</th><th>Presenter</th></tr>${rows}</table><p class="note">Time used: ${used} min | Remaining buffer: ${remain} min</p></div>`;}</script></body></html>
