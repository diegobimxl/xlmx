<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAR & Density Calculator — XLMX</title><style>:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a78bfa;}
*{box-sizing:border-box;margin:0;padding:0;}body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:780px;margin:0 auto;}h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.rv{font-size:24px;font-weight:700;color:var(--acc);}
.rs{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:10px;}
button{padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;margin-top:12px;}
button:hover{opacity:.85;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.pass{background:rgba(34,197,94,.12);color:#4ade80;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.fail{background:rgba(248,113,113,.12);color:#f87171;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.warn{background:rgba(251,191,36,.12);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}</style></head>
<body><div class="wrap"><a class="back" href="/tools/">← Library</a>
<h1>FAR & Density Calculator</h1><p class="sub">Architecture — FAR, density, and allowable buildout from site data</p><div class="card">
  <div class="g2">
    <div><label>SITE AREA (m²)</label><input type="number" id="site" value="5000" oninput="calc()"></div>
    <div><label>ALLOWED FAR</label><input type="number" id="far" value="2.5" step="0.1" oninput="calc()"></div>
  </div>
  <div class="g2">
    <div><label>PROPOSED GFA (m²)</label><input type="number" id="gfa" value="10000" oninput="calc()"></div>
    <div><label>NUMBER OF UNITS (residential)</label><input type="number" id="units" value="80" oninput="calc()"></div>
  </div>
  <div class="g2">
    <div><label>MAX BUILDING COVERAGE (%)</label><input type="number" id="cov" value="60" oninput="calc()"></div>
    <div><label>FLOOR HEIGHT (m)</label><input type="number" id="fh" value="3.5" step="0.1" oninput="calc()"></div>
  </div>
</div>
<div class="card">
  <div class="g3">
    <div class="res"><div class="rl">ALLOWED GFA</div><div class="rv" id="allowed">—</div><div class="rs">m²</div></div>
    <div class="res"><div class="rl">PROPOSED FAR</div><div class="rv" id="prop-far">—</div></div>
    <div class="res"><div class="rl">FAR STATUS</div><div class="rv" id="far-status" style="font-size:16px;">—</div></div>
  </div>
  <div class="g3" style="margin-top:12px;">
    <div class="res"><div class="rl">DENSITY (u/ha)</div><div class="rv" id="density">—</div></div>
    <div class="res"><div class="rl">COVERAGE</div><div class="rv" id="coverage">—</div></div>
    <div class="res"><div class="rl">EST. FLOORS</div><div class="rv" id="floors">—</div></div>
  </div>
  <div class="note" id="note"></div>
</div></div>
<script>function calc(){
  const site=+document.getElementById('site').value;
  const far=+document.getElementById('far').value;
  const gfa=+document.getElementById('gfa').value;
  const units=+document.getElementById('units').value;
  const maxCov=+document.getElementById('cov').value/100;
  const fh=+document.getElementById('fh').value;
  const allowed=site*far;
  const propFar=(gfa/site).toFixed(3);
  const pass=gfa<=allowed;
  const density=(units/(site/10000)).toFixed(0);
  const footprint=site*maxCov;
  const coverage=(gfa/site/far*100).toFixed(1);
  const estFloors=Math.ceil(gfa/footprint);
  document.getElementById('allowed').textContent=allowed.toFixed(0);
  document.getElementById('prop-far').textContent=propFar;
  document.getElementById('far-status').textContent=pass?'Compliant ✓':'Exceeds FAR ✗';
  document.getElementById('far-status').style.color=pass?'var(--acc)':'#f87171';
  document.getElementById('density').textContent=density;
  document.getElementById('coverage').textContent=coverage+'%';
  document.getElementById('floors').textContent=estFloors;
  document.getElementById('note').textContent=`Site: ${(site/10000).toFixed(2)} ha. Allowed GFA: ${allowed.toFixed(0)} m² (FAR ${far}). Proposed: ${gfa.toFixed(0)} m² (FAR ${propFar}). ${pass?'Compliant.':'Over by '+(gfa-allowed).toFixed(0)+' m² — reduce program or seek variance.'} Density: ${density} u/ha. Est. ${estFloors} floors at ${maxCov*100}% coverage.`;
}
calc();</script></body></html>
