<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatigue Life Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Fatigue Life Calculator</h1>
  <p class="sub">Materials Science — S-N curve, Miner's rule, and cycle-to-failure estimate</p>
  <div class="card">
    <div class="grid2">
      <div>
        <label>ULTIMATE TENSILE STRENGTH Sᵤ (MPa)</label>
        <input type="number" id="Su" value="500" oninput="calc()">
      </div>
      <div>
        <label>STRESS AMPLITUDE σₐ (MPa)</label>
        <input type="number" id="Sa" value="200" oninput="calc()">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label>MEAN STRESS σₘ (MPa)</label>
        <input type="number" id="Sm" value="50" oninput="calc()">
      </div>
      <div>
        <label>SURFACE FINISH FACTOR Kₐ</label>
        <input type="number" id="Ka" value="0.9" step="0.01" min="0.1" max="1" oninput="calc()">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="result">
        <div class="r-label">ENDURANCE LIMIT Sₑ</div>
        <div class="r-val" id="Se">—</div>
        <div class="r-sub">MPa</div>
      </div>
      <div class="result">
        <div class="r-label">MODIFIED Sₑ'</div>
        <div class="r-val" id="Sem">—</div>
        <div class="r-sub">MPa (with factors)</div>
      </div>
      <div class="result">
        <div class="r-label">CYCLES TO FAILURE Nf</div>
        <div class="r-val" id="Nf">—</div>
      </div>
    </div>
    <div class="result" style="margin-top:12px;">
      <div class="r-label">GOODMAN SAFETY FACTOR</div>
      <div class="r-val" id="SF">—</div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
function calc(){
  const Su=+document.getElementById('Su').value;
  const Sa=+document.getElementById('Sa').value;
  const Sm=+document.getElementById('Sm').value;
  const Ka=+document.getElementById('Ka').value;
  // Endurance limit (steel approximation: 0.5*Su for Su<=1400 MPa)
  const Se0=Su<=1400?0.5*Su:700;
  // Size factor kb=0.9, reliability kc=0.897 (90%), temp kd=1
  const Sem=Se0*Ka*0.9*0.897;
  // Goodman: Sa/Sem + Sm/Su = 1/SF
  const SF=1/(Sa/Sem+Sm/Su);
  // S-N for steel: log(N) = (log(0.9*Su)-log(Se0))/(log(1e3)-log(1e6)) * (log(Sa)-log(Se0)) + log(1e6)
  // Simplified Basquin: N=(Sa/C)^(1/b), use C=0.9*Su at N=1000, b=-0.085
  let Nf;
  const C=0.9*Su;
  const b=-0.085;
  if(Sa>=Sem){Nf=Math.pow(Sa/C,1/b);}else{Nf=Infinity;}
  const NfStr=Nf===Infinity?'∞ (below endurance)':Nf>1e9?'> 1 billion':Math.round(Nf).toLocaleString();
  document.getElementById('Se').textContent=Se0.toFixed(0);
  document.getElementById('Sem').textContent=Sem.toFixed(0);
  document.getElementById('Nf').textContent=NfStr;
  document.getElementById('SF').textContent=SF.toFixed(2);
  const safe=SF>=2?'Safe (SF≥2)':SF>=1.5?'Acceptable':SF>=1?'Marginal — review':'Failure expected';
  document.getElementById('note').textContent=`Modified Goodman criterion. SF=${SF.toFixed(2)}: ${safe}. Endurance limit ${Se0.toFixed(0)} MPa (0.5·Sᵤ). Modified Sₑ'=${Sem.toFixed(0)} MPa with surface Ka=${Ka}, size×reliability factors. Basquin exponent b=−0.085 (steel).`;
}
calc();
</script>
</body>
</html>
