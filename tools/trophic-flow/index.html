<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trophic Flow Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#84cc16;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
btn,button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Trophic Flow Calculator</h1>
  <p class="sub">Ecology — Energy transfer efficiency across trophic levels</p>
  <div class="card">
    <label>PRIMARY PRODUCTION (kcal/m²/yr)</label>
    <input type="number" id="pp" value="8000" oninput="calc()">
    <label>TROPHIC EFFICIENCY (%)</label>
    <input type="number" id="eff" value="10" min="1" max="30" oninput="calc()">
    <label>NUMBER OF TROPHIC LEVELS</label>
    <input type="number" id="levels" value="5" min="2" max="8" oninput="calc()">
  </div>
  <div class="card" id="out"></div>
  <div class="card">
    <div class="note">Lindeman's 10% rule: only ~10% of energy transfers between trophic levels. Actual values range 5–20%. This explains why large carnivores are rare — the energy pyramid collapses rapidly toward the apex.</div>
  </div>
</div>
<script>
const NAMES=["Primary Producers","Primary Consumers","Secondary Consumers","Tertiary Consumers","Apex Predators","Level 6","Level 7","Level 8"];
function calc(){
  const pp=+document.getElementById('pp').value;
  const eff=+document.getElementById('eff').value/100;
  const n=+document.getElementById('levels').value;
  const out=document.getElementById('out');
  let html='<table style="width:100%;border-collapse:collapse;font-size:13px;">';
  html+='<tr><th style="text-align:left;color:var(--mu);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--bd);">LEVEL</th><th style="text-align:right;color:var(--mu);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--bd);">ENERGY (kcal/m²/yr)</th><th style="text-align:right;color:var(--mu);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--bd);">% OF BASE</th><th style="text-align:right;color:var(--mu);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--bd);">TRANSFER LOSS</th></tr>';
  let e=pp;
  for(let i=0;i<n;i++){
    const pct=((e/pp)*100).toFixed(4);
    const loss=i<n-1?(e*(1-eff)).toFixed(1):'—';
    const bar=Math.max((e/pp)*200,1);
    html+=`<tr><td style="padding:8px;"><span style="color:var(--acc);font-weight:600;">${NAMES[i]||'Level '+(i+1)}</span></td><td style="text-align:right;padding:8px;">${e.toLocaleString(undefined,{maximumFractionDigits:1})}</td><td style="text-align:right;padding:8px;color:var(--mu);">${pct}%</td><td style="text-align:right;padding:8px;color:var(--mu);">${loss==='—'?'—':'-'+Number(loss).toLocaleString()}</td></tr>`;
    e=e*eff;
  }
  html+='</table>';
  out.innerHTML=html;
}
calc();
</script>
</body>
</html>
