<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibonacci Sequence Visualizer - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Fibonacci Sequence Visualizer</h1><p class="sub">Design — Golden Spiral and Fibonacci Proportions</p><div class="card"><h3>Settings</h3><div class="g2"><div><label>Number of Terms</label><input type="number" id="n" value="10" min="3" max="15"></div><div><label>Base Unit (px)</label><input type="number" id="unit" value="8"></div></div><button onclick="draw()">Visualize</button></div><div id="out"></div></div><script>function draw(){const n=Math.min(15,+document.getElementById('n').value||10);const unit=+document.getElementById('unit').value||8;let fib=[1,1];for(let i=2;i<n;i++)fib.push(fib[i-1]+fib[i-2]);const ratios=fib.map((v,i)=>i>0?(v/fib[i-1]).toFixed(4):'—');const colors=['#f472b6','#818cf8','#22d3ee','#c4b5fd','#fb923c','#22c55e','#fbbf24','#60a5fa','#34d399','#f87171'];let table='<table style="width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:1rem"><tr><th style="text-align:left;padding:.3rem .5rem;color:var(--mu);border-bottom:1px solid var(--bd)">n</th><th style="text-align:left;padding:.3rem .5rem;color:var(--mu);border-bottom:1px solid var(--bd)">Value</th><th style="text-align:left;padding:.3rem .5rem;color:var(--mu);border-bottom:1px solid var(--bd)">Ratio to prev</th></tr>';fib.forEach((v,i)=>{table+=`<tr><td style="padding:.25rem .5rem">${i+1}</td><td style="padding:.25rem .5rem">${v}</td><td style="padding:.25rem .5rem;color:var(--mu)">${ratios[i]}</td></tr>`;});table+='</table>';let bars='<div style="display:flex;align-items:flex-end;gap:4px;height:120px;margin-bottom:1rem">';const max=fib[fib.length-1];fib.forEach((v,i)=>{const h=Math.max(4,Math.round(v/max*120));bars+=`<div title="${v}" style="flex:1;height:${h}px;background:${colors[i%10]};border-radius:3px 3px 0 0;opacity:.8"></div>`;});bars+='</div>';document.getElementById('out').innerHTML='<div class="card"><h3>Fibonacci Sequence</h3>'+bars+table+'<p class="note">Ratio converges to the Golden Ratio &#x3c6; &#x2248; 1.61803</p></div>';}draw();</script></body></html>
