<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay Application Review Checklist - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#94a3b8}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Pay Application Review Checklist</h1><p class="sub">Legal — Structured Review Before Processing Payment</p><div class="card"><h3>Pay App Review</h3><div id="pac"></div></div></div><script>const items=[['Cover Page','AIA G702 or equivalent cover sheet included'],['Cover Page','Correct application number and date'],['Cover Page','Contract sum matches executed contract'],['Continuation Sheet','G703 continuation sheet attached'],['Continuation Sheet','All scheduled values match approved SOV'],['Continuation Sheet','% complete per item is reasonable vs. schedule'],['Lien Waivers','Conditional lien waiver for this pay app amount'],['Lien Waivers','Unconditional waiver for prior pay app amount'],['Retainage','Retainage calculation correct per contract'],['Documentation','Supporting invoices attached where required'],['Documentation','Stored materials documented if claimed'],['Approval','Project manager field verification of % complete'],['Approval','Architect certification if required by contract']];let chk={};function render(){const cats=[...new Set(items.map(i=>i[0]))];let h='';cats.forEach(cat=>{h+=`<p style="font-size:.8rem;text-transform:uppercase;color:var(--acc);margin:.6rem 0 .3rem">${cat}</p>`;items.filter(i=>i[0]===cat).forEach(it=>{const k=it[1];const v=chk[k]||'none';h+=`<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid var(--bd)"><span style="flex:1;font-size:.88rem;${v==='ok'?'opacity:.5;text-decoration:line-through':''}">${it[1]}</span><button onclick="mark('${k.replace(/'/g,"\\'")}','ok')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='ok'?'#22c55e':'rgba(255,255,255,.08)'};color:${v==='ok'?'#000':'var(--tx)'};margin-top:0">OK</button><button onclick="mark('${k.replace(/'/g,"\\'")}','flag')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='flag'?'#ef4444':'rgba(255,255,255,.08)'};color:${v==='flag'?'#fff':'var(--tx)'};margin-top:0">Flag</button></div>`;});});const ok=Object.values(chk).filter(v=>v==='ok').length;const flags=Object.values(chk).filter(v=>v==='flag').length;h+=`<p class="note">${ok} clear, ${flags} flagged of ${items.length} items</p>`;document.getElementById('pac').innerHTML=h;}function mark(k,v){chk[k]=chk[k]===v?'none':v;render();}render();</script></body></html>
