<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoichiometry Calculator — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a855f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Stoichiometry Calculator</h1>
  <p class="sub">Chemistry — Mole ratios, limiting reagent, and yield calculation</p>
  <div class="card">
    <label>BALANCED EQUATION — enter coefficients and molar masses</label>
    <div id="reagents">
      <div style="display:grid;grid-template-columns:80px 1fr 120px 100px;gap:8px;align-items:center;margin-bottom:8px;font-size:11px;color:var(--mu);">
        <span>COEFF</span><span>NAME</span><span>MOLAR MASS (g/mol)</span><span>AMOUNT (g)</span>
      </div>
    </div>
    <div id="r-inputs"></div>
    <div style="display:grid;grid-template-columns:80px 1fr 120px 100px;gap:8px;align-items:center;margin:12px 0 8px;font-size:11px;color:var(--mu);">
      <span>COEFF</span><span>PRODUCT</span><span>MOLAR MASS (g/mol)</span><span></span>
    </div>
    <div id="p-input">
      <div style="display:grid;grid-template-columns:80px 1fr 120px 100px;gap:8px;align-items:center;margin-bottom:8px;">
        <input type="number" id="pc" value="1" min="1" oninput="calc()" style="padding:8px;">
        <input type="text" id="pn" value="Product" oninput="calc()" style="padding:8px;">
        <input type="number" id="pm" value="18.015" step="0.001" oninput="calc()" style="padding:8px;">
        <div></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="grid2">
      <div class="result">
        <div class="r-label">LIMITING REAGENT</div>
        <div class="r-val" id="lim" style="font-size:16px;">—</div>
      </div>
      <div class="result">
        <div class="r-label">THEORETICAL YIELD</div>
        <div class="r-val" id="yield">—</div>
        <div class="r-sub">grams of product</div>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const REAGENTS=[{c:1,n:'Reagent A',m:2.016,g:5},{c:1,n:'Reagent B',m:32.065,g:10}];
function buildInputs(){
  const cont=document.getElementById('r-inputs');
  cont.innerHTML=REAGENTS.map((r,i)=>`
    <div style="display:grid;grid-template-columns:80px 1fr 120px 100px;gap:8px;align-items:center;margin-bottom:8px;">
      <input type="number" value="${r.c}" min="1" oninput="REAGENTS[${i}].c=+this.value;calc()" style="padding:8px;">
      <input type="text" value="${r.n}" oninput="REAGENTS[${i}].n=this.value;calc()" style="padding:8px;">
      <input type="number" value="${r.m}" step="0.001" oninput="REAGENTS[${i}].m=+this.value;calc()" style="padding:8px;">
      <input type="number" value="${r.g}" step="0.01" oninput="REAGENTS[${i}].g=+this.value;calc()" style="padding:8px;">
    </div>`).join('');
}
function calc(){
  const pc=+document.getElementById('pc').value;
  const pm=+document.getElementById('pm').value;
  const pn=document.getElementById('pn').value;
  const moles=REAGENTS.map(r=>r.g/(r.m*r.c));
  const limiting_idx=moles.indexOf(Math.min(...moles));
  const lim_mol=moles[limiting_idx];
  const yieldG=lim_mol*pc*pm;
  document.getElementById('lim').textContent=REAGENTS[limiting_idx].n;
  document.getElementById('yield').textContent=yieldG.toFixed(3)+' g';
  const details=REAGENTS.map((r,i)=>`${r.n}: ${r.g}g ÷ (${r.c}×${r.m}) = ${moles[i].toFixed(4)} mol${i===limiting_idx?' ← LIMITING':''}`).join('; ');
  document.getElementById('note').textContent=`Mol ratios: ${details}. Theoretical yield of ${pn}: ${yieldG.toFixed(3)} g. To find % yield: divide actual yield by this value × 100.`;
}
buildInputs();
calc();
</script>
</body>
</html>
