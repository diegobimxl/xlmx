<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source Credibility Checker — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f97316;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.r-sub{font-size:11px;color:var(--mu);margin-top:2px;}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
.note{font-size:12px;color:var(--mu);line-height:1.7;padding:12px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;margin-top:12px;}
btn,button{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--acc);color:#000;font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;}
button:hover{opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">← Library</a>
  <h1>Source Credibility Checker</h1>
  <p class="sub">Journalism — Evaluate and score a source for credibility</p>
  <div class="card">
    <label>SOURCE NAME / PUBLICATION</label>
    <input type="text" id="sname" placeholder="e.g. The Economist, anonymous blog, press release" oninput="calc()">
    <div style="margin-top:16px;font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px;">RATE EACH CRITERION (1 = Poor · 5 = Excellent)</div>
    <div id="criteria"></div>
  </div>
  <div class="card">
    <div class="grid2">
      <div class="result">
        <div class="r-label">CREDIBILITY SCORE</div>
        <div class="r-val" id="score">—</div>
        <div class="r-sub">out of 100</div>
      </div>
      <div class="result">
        <div class="r-label">TIER</div>
        <div class="r-val" id="tier" style="font-size:16px;">—</div>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const CRITERIA=[
  {id:'acc',label:'Accuracy — verifiable facts, corrections policy'},
  {id:'auth',label:'Authority — named author, credentials, byline'},
  {id:'bias',label:'Bias — neutral language, balanced perspectives'},
  {id:'trans',label:'Transparency — sources cited, methodology disclosed'},
  {id:'ind',label:'Independence — no conflicts of interest, editorial separation'},
  {id:'cur',label:'Currency — recent, updated, relevant timeframe'},
];
function buildCriteria(){
  const cont=document.getElementById('criteria');
  cont.innerHTML=CRITERIA.map(c=>`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <span style="flex:1;font-size:12px;color:var(--mu);">${c.label}</span>
      <div style="display:flex;gap:4px;">${[1,2,3,4,5].map(n=>`<button onclick="setScore('${c.id}',${n})" id="b-${c.id}-${n}" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:none;color:var(--mu);cursor:pointer;font-size:12px;">${n}</button>`).join('')}</div>
    </div>`).join('');
  CRITERIA.forEach(c=>setScore(c.id,3));
}
const scores={};
function setScore(id,v){
  scores[id]=v;
  [1,2,3,4,5].forEach(n=>{
    const b=document.getElementById('b-'+id+'-'+n);
    if(b){b.style.background=n<=v?'var(--acc)':'none';b.style.color=n<=v?'#000':'var(--mu)';}
  });
  calc();
}
function calc(){
  const vals=Object.values(scores);
  if(!vals.length)return;
  const avg=vals.reduce((a,b)=>a+b,0)/CRITERIA.length;
  const s=Math.round((avg/5)*100);
  const tier=s>=80?'Tier 1 — High Reliability':s>=60?'Tier 2 — Generally Reliable':s>=40?'Tier 3 — Use with Caution':'Tier 4 — Verify Independently';
  document.getElementById('score').textContent=s;
  document.getElementById('tier').textContent=tier.split('—')[0].trim();
  document.getElementById('note').textContent=tier+'. Score: '+s+'/100. Weakest dimension: '+CRITERIA.reduce((a,c)=>((scores[c.id]||3)<(scores[a.id]||3)?c:a)).label.split('—')[0].trim()+'. Strongest: '+CRITERIA.reduce((a,c)=>((scores[c.id]||3)>(scores[a.id]||3)?c:a)).label.split('—')[0].trim()+'.';
}
buildCriteria();
</script>
</body>
</html>
