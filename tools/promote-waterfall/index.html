<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promote & Waterfall Calculator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#c8a96e}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Promote & Waterfall Calculator</h1><p class="sub">Real Estate & Development — GP/LP Distribution Model</p><div class="card"><h3>Structure</h3><div class="g2"><div><label>Total Equity ($)</label><input type="number" id="eq" value="2000000"></div><div><label>GP Equity (%)</label><input type="number" id="gp" value="10"></div><div><label>Total Profit ($)</label><input type="number" id="prf" value="800000"></div><div><label>Pref Return (%)</label><input type="number" id="pref" value="8" step="0.5"></div><div><label>GP Promote (%)</label><input type="number" id="promo" value="20" step="5"></div></div><button onclick="calc()">Model Waterfall</button></div><div class="card"><h3>Distribution</h3><div id="wr"></div></div></div><script>function fmt(n){return'$'+Math.round(n).toLocaleString();}function calc(){const eq=+document.getElementById('eq').value;const gp=+document.getElementById('gp').value/100;const prf=+document.getElementById('prf').value;const pref=+document.getElementById('pref').value/100;const promo=+document.getElementById('promo').value/100;const lpEq=eq*(1-gp);const gpEq=eq*gp;const prefAmt=lpEq*pref;let rem=prf;let lp=0,gpa=0;const roe=Math.min(rem,eq);rem-=roe;lp+=roe*(1-gp);gpa+=roe*gp;const prd=Math.min(rem,prefAmt);rem-=prd;lp+=prd;const lpSplit=rem*(1-promo);const gpSplit=rem*promo;lp+=lpSplit;gpa+=gpSplit;const mult=lpEq?(lp+lpEq)/lpEq:0;document.getElementById('wr').innerHTML=`<table class="tbl"><tr><th>Tier</th><th>LP</th><th>GP</th></tr><tr><td>Return of Equity</td><td>${fmt(roe*(1-gp))}</td><td>${fmt(roe*gp)}</td></tr><tr><td>Pref Return</td><td>${fmt(prd)}</td><td>-</td></tr><tr><td>Promote Split</td><td>${fmt(lpSplit)}</td><td>${fmt(gpSplit)}</td></tr><tr style="font-weight:600"><td>TOTAL</td><td>${fmt(lp)}</td><td>${fmt(gpa)}</td></tr></table><p class="note">LP Equity Multiple: ${mult.toFixed(2)}x</p>`;}</script></body></html>
