<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drywall Estimator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#fb923c}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Drywall Estimator</h1><p class="sub">Construction — Sheets, Compound and Screws</p><div class="card"><h3>Room Dimensions</h3><div class="g3"><div><label>Wall Length (ft)</label><input type="number" id="wl" value="120"></div><div><label>Wall Height (ft)</label><input type="number" id="wh" value="9"></div><div><label>Ceiling Area (SF)</label><input type="number" id="ca" value="400"></div></div><div class="g2"><div><label>Door/Window Deductions (SF)</label><input type="number" id="ded" value="80"></div><div><label>Waste Factor (%)</label><input type="number" id="wf" value="10"></div></div><button onclick="calc()">Estimate</button></div><div class="card"><h3>Materials</h3><div class="g3"><div class="res"><div class="rl">4x8 Sheets</div><div class="rv" id="sh">-</div></div><div class="res"><div class="rl">Joint Compound (gal)</div><div class="rv" id="jc">-</div></div><div class="res"><div class="rl">Screws (lbs)</div><div class="rv" id="sc">-</div></div></div></div></div><script>function calc(){const wl=+document.getElementById('wl').value;const wh=+document.getElementById('wh').value;const ca=+document.getElementById('ca').value;const ded=+document.getElementById('ded').value;const wf=+document.getElementById('wf').value/100;const wallSF=wl*wh-ded;const totalSF=(wallSF+ca)*(1+wf);const sheets=Math.ceil(totalSF/32);const jc=Math.ceil(totalSF/400);const screws=(totalSF/100*1).toFixed(1);document.getElementById('sh').textContent=sheets;document.getElementById('jc').textContent=jc;document.getElementById('sc').textContent=screws;}</script></body></html>
