<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typography Scale Generator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Typography Scale Generator</h1><p class="sub">Design — Modular Type Scales for Consistent Hierarchy</p><div class="card"><h3>Scale Settings</h3><div class="g2"><div><label>Base Size (px)</label><input type="number" id="base" value="16"></div><div><label>Scale Ratio</label><select id="ratio"><option value="1.067">Minor Second (1.067)</option><option value="1.125">Major Second (1.125)</option><option value="1.200" selected>Minor Third (1.200)</option><option value="1.250">Major Third (1.250)</option><option value="1.333">Perfect Fourth (1.333)</option><option value="1.414">Augmented Fourth (1.414)</option><option value="1.500">Perfect Fifth (1.500)</option><option value="1.618">Golden Ratio (1.618)</option></select></div></div><button onclick="gen()">Generate Scale</button></div><div id="out"></div></div><script>function gen(){const base=+document.getElementById('base').value||16;const r=+document.getElementById('ratio').value;const steps=[{name:'xs',exp:-2},{name:'sm',exp:-1},{name:'base',exp:0},{name:'lg',exp:1},{name:'xl',exp:2},{name:'2xl',exp:3},{name:'3xl',exp:4},{name:'4xl',exp:5}];let h='<div class="card"><h3>Type Scale</h3>';steps.forEach(s=>{const size=(base*Math.pow(r,s.exp)).toFixed(2);const rem=(size/base).toFixed(3);h+=`<div style="display:flex;align-items:baseline;gap:1rem;margin-bottom:.5rem;border-bottom:1px solid var(--bd);padding-bottom:.4rem"><span style="width:40px;font-size:.75rem;color:var(--mu)">${s.name}</span><span style="font-size:${size}px;line-height:1.2;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">Aa</span><span style="font-size:.78rem;color:var(--mu);white-space:nowrap">${size}px / ${rem}rem</span></div>`;});h+='</div>';document.getElementById('out').innerHTML=h;}</script></body></html>
