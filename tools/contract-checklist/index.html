<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract Terms Checklist - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#94a3b8}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}.tbl th{text-align:left;padding:.4rem .6rem;color:var(--mu);border-bottom:1px solid var(--bd)}.tbl td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04)}.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Contract Terms Checklist</h1><p class="sub">Legal — Critical Terms Before Signing AEC Agreements</p><div class="card"><h3>Contract Review</h3><div id="cl"></div></div></div><script>const items=[['Scope','Scope of work clearly defined and attached'],['Scope','Deliverables listed with format and LOD specified'],['Scope','Exclusions explicitly stated'],['Fee','Fee amount and payment schedule defined'],['Fee','Invoice timing and net payment terms stated'],['Fee','Additional services procedure defined'],['Schedule','Project schedule or milestone dates included'],['Schedule','Owner-caused delay clause present'],['Liability','Professional liability cap specified'],['Liability','Consequential damages waiver included'],['Liability','Indemnification clause reviewed and balanced'],['IP','Intellectual property and ownership of deliverables defined'],['IP','License to use BIM models stated'],['Termination','Termination for convenience clause present'],['Termination','Payment on termination defined'],['Dispute','Dispute resolution method specified (arbitration/mediation)'],['Dispute','Governing law and jurisdiction stated']];let chk={};function render(){const cats=[...new Set(items.map(i=>i[0]))];let h='';cats.forEach(cat=>{h+=`<div style="margin-bottom:.75rem"><p style="font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.4rem">${cat}</p>`;items.filter(i=>i[0]===cat).forEach(it=>{const k=it[1];const v=chk[k]||'none';h+=`<div style="display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--bd)"><span style="font-size:.88rem;flex:1;${v==='ok'?'text-decoration:line-through;opacity:.5':''}">${it[1]}</span><button onclick="mark('${k.replace(/'/g,"\\'")}','ok')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='ok'?'#22c55e':'rgba(255,255,255,.08)'};color:${v==='ok'?'#000':'var(--tx)'};margin-top:0">OK</button><button onclick="mark('${k.replace(/'/g,"\\'")}','miss')" style="padding:.15rem .5rem;font-size:.75rem;background:${v==='miss'?'#ef4444':'rgba(255,255,255,.08)'};color:${v==='miss'?'#fff':'var(--tx)'};margin-top:0">Missing</button></div>`;});h+='</div>';});const ok=Object.values(chk).filter(v=>v==='ok').length;const miss=Object.values(chk).filter(v=>v==='miss').length;h+=`<p class="note">${ok} OK, ${miss} missing of ${items.length} items reviewed</p>`;document.getElementById('cl').innerHTML=h;}function mark(k,v){chk[k]=chk[k]===v?'none':v;render();}render();</script></body></html>
