<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Pattern Puzzle - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#facc15}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Tile Pattern Puzzle</h1><p class="sub">Leisure — Match Tile Patterns — A Relaxing Geometry Puzzle</p><div class="card"><h3>Tile Pattern Puzzle</h3><p style="font-size:.85rem;color:var(--mu);margin-bottom:.75rem">Click tiles to rotate them and complete the pattern.</p><div id="tp"></div></div></div><script>const SIZE=4;let grid=[],target=[],moves=0;const SHAPES=['┼','┤','├','┬','┴','─','│','╋'];function newGame(){moves=0;target=Array.from({length:SIZE*SIZE},()=>Math.floor(Math.random()*SHAPES.length));grid=target.map(v=>(v+Math.floor(Math.random()*3)+1)%SHAPES.length);render();}function rotate(i){grid[i]=(grid[i]+1)%SHAPES.length;moves++;render();}function render(){const solved=grid.every((v,i)=>v===target[i]);let html=`<div style="display:inline-grid;grid-template-columns:repeat(${SIZE},1fr);gap:4px;margin-bottom:.75rem">`;grid.forEach((v,i)=>{const ok=v===target[i];html+=`<div onclick="rotate(${i})" style="width:52px;height:52px;background:${ok?'rgba(250,204,21,.15)':'rgba(255,255,255,.05)'};border:1px solid ${ok?'var(--acc)':'var(--bd)'};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none">${SHAPES[v]}</div>`;});html+=`</div>`;html+=`<p style="font-size:.85rem;color:var(--mu)">Moves: ${moves} | ${solved?'<span class="pass">Puzzle complete!</span>':'Rotate tiles to match the target pattern.'}</p>`;if(solved)html+='<button onclick="newGame()" style="margin-top:.5rem">New Puzzle</button>';document.getElementById('tp').innerHTML=html;}newGame();</script></body></html>
