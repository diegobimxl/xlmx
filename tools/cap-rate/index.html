<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cap Rate Calculator | XLMX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px}
.back{color:#c8a96e;text-decoration:none;font-size:13px}.topbar h1{font-size:15px;font-weight:600;color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
.desc{color:#888;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.box{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:20px;margin-bottom:14px}
.box h2{font-size:11px;font-weight:600;color:#c8a96e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:11px}label{font-size:11px;color:#888;display:block;margin-bottom:3px}
input,select{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;color:#e8e8e8;font-size:13px;padding:8px 10px;width:100%}
input:focus,select:focus{outline:none;border-color:#c8a96e}
.btn{background:#c8a96e;color:#000;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.btn:hover{background:#d4b87a}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:12px}
.klabel{font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase}
.kval{font-size:18px;font-weight:700;color:#c8a96e}
.kval.grn{color:#34d399}.kval.red{color:#f87171}.kval.sky{color:#60a5fa}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 8px;font-size:10px;color:#888;border-bottom:1px solid #222;text-transform:uppercase;font-weight:500}
td{padding:5px 8px;border-bottom:1px solid #161616;font-size:12px}
tr:hover td{background:#151515}
.note{font-size:11px;color:#666;margin-top:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="topbar"><a href="/tools/" class="back">&#8592; Tools</a><h1>Cap Rate Calculator</h1></div>
<div class="wrap">
<p class="desc">Net Operating Income ÷ property value. Instantly benchmark any acquisition.</p>
<div class="grid">
<div>
<div class="box"><h2>Inputs</h2>
<div class="field"><label>Gross Rental Income ($/yr)</label><input id="gri" type="number" placeholder="120000"></div>
<div class="field"><label>Vacancy Rate (%)</label><input id="vac" type="number" placeholder="5" value="5"></div>
<div class="field"><label>Operating Expenses ($/yr)</label><input id="exp" type="number" placeholder="30000"></div>
<div class="field"><label>Property Value ($)</label><input id="val" type="number" placeholder="1500000"></div>
<button class="btn" onclick="calc()">Calculate</button>
</div></div>
<div>
<div class="box"><h2>Results</h2>
<div class="kpi" id="kpi"><p style="color:#555;font-size:12px">Enter inputs and calculate.</p></div>
<div id="bench"></div>
</div></div></div>
<script>
function fm(n){return"$"+n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})}
function fp(n){return n.toFixed(2)+"%"}
function calc(){
var gri=+document.getElementById("gri").value||0;
var vac=+document.getElementById("vac").value/100||0.05;
var exp=+document.getElementById("exp").value||0;
var val=+document.getElementById("val").value||1;
var egi=gri*(1-vac);
var noi=egi-exp;
var cap=noi/val*100;
var grm=val/(gri||1);
document.getElementById("kpi").innerHTML=
'<div class="kcard"><div class="klabel">EGI</div><div class="kval sky">'+fm(egi)+'</div></div>'+
'<div class="kcard"><div class="klabel">NOI</div><div class="kval grn">'+fm(noi)+'</div></div>'+
'<div class="kcard"><div class="klabel">Cap Rate</div><div class="kval">'+fp(cap)+'</div></div>'+
'<div class="kcard"><div class="klabel">GRM</div><div class="kval sky">'+grm.toFixed(1)+'x</div></div>'+
'<div class="kcard"><div class="klabel">Expense Ratio</div><div class="kval red">'+fp(exp/(egi||1)*100)+'</div></div>';
var bench=cap<4?"Below market (core/trophy)":cap<6?"Market rate (stabilized)":cap<8?"Above market (value-add)":"High yield (risk premium)";
document.getElementById("bench").innerHTML='<p class="note">Benchmark: <strong style="color:#c8a96e">'+bench+'</strong></p>';
}
</script></div></body></html>
