<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Palette Generator - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Color Palette Generator</h1><p class="sub">Design — Complementary, Analogous and Triadic Palettes</p><div class="card"><h3>Base Color</h3><div class="g2"><div><label>Base Hue</label><input type="color" id="base" value="#f472b6" style="height:44px;padding:.25rem"></div><div><label>Scheme</label><select id="scheme"><option value="comp">Complementary</option><option value="ana">Analogous</option><option value="tri">Triadic</option><option value="split">Split Complementary</option><option value="mono">Monochromatic</option></select></div></div><button onclick="gen()">Generate Palette</button></div><div id="out"></div></div><script>function hexToHsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);}function gen(){const[h,s,l]=hexToHsl(document.getElementById('base').value);const sc=document.getElementById('scheme').value;let hues=[];if(sc==='comp')hues=[[h,s,l],[(h+180)%360,s,l]];else if(sc==='ana')hues=[[h,s,l],[(h+30)%360,s,l],[(h-30+360)%360,s,l]];else if(sc==='tri')hues=[[h,s,l],[(h+120)%360,s,l],[(h+240)%360,s,l]];else if(sc==='split')hues=[[h,s,l],[(h+150)%360,s,l],[(h+210)%360,s,l]];else hues=[[h,s,l],[h,s,l-20],[h,s,l-40],[h,s,l+20],[h,s,l+15]].filter(([hh,ss,ll])=>ll>=0&&ll<=100);let html='<div class="card"><h3>Palette</h3><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem">';hues.forEach(([hh,ss,ll])=>{const hex=hslToHex(hh,ss,ll);html+=`<div style="text-align:center"><div style="width:80px;height:80px;background:${hex};border-radius:8px;margin-bottom:.3rem"></div><p style="font-size:.75rem;color:var(--mu)">${hex}</p><p style="font-size:.72rem;color:var(--mu)">${hh}&deg; ${ss}% ${ll}%</p></div>`;});html+='</div></div>';document.getElementById('out').innerHTML=html;}</script></body></html>
