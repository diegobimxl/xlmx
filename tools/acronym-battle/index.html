<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEC Acronym Battle - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#facc15}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>AEC Acronym Battle</h1><p class="sub">Leisure — How Many AEC Acronyms Can You Decode in 60 Seconds?</p><div class="card"><h3>AEC Acronym Battle</h3><div id="ab"></div></div></div><script>const acronyms=[['BIM','Building Information Modeling'],['RFI','Request for Information'],['LOD','Level of Development'],['VDC','Virtual Design and Construction'],['CDE','Common Data Environment'],['GMP','Guaranteed Maximum Price'],['LEED','Leadership in Energy and Environmental Design'],['AHJ','Authority Having Jurisdiction'],['IFC','Industry Foundation Classes'],['SOV','Schedule of Values'],['NTP','Notice to Proceed'],['PCO','Potential Change Order'],['ASI','Architect Supplemental Instructions'],['OAC','Owner Architect Contractor'],['CM','Construction Manager'],['DD','Design Development'],['SD','Schematic Design'],['CD','Construction Documents'],['CA','Construction Administration'],['MEP','Mechanical Electrical Plumbing'],['FAR','Floor Area Ratio'],['ADA','Americans with Disabilities Act'],['IBC','International Building Code'],['ISO','International Organization for Standardization'],['ACC','Autodesk Construction Cloud']];let timer,score=0,idx=0,running=false,timeLeft=60;function start(){score=0;idx=0;timeLeft=60;running=true;nextQ();}function nextQ(){if(!running)return;const a=acronyms[idx%acronyms.length];document.getElementById('ab').innerHTML=`<p style="font-size:2rem;font-weight:800;color:var(--acc);margin-bottom:.5rem">${a[0]}</p><input type="text" id="ans" placeholder="Type full form..." autofocus style="margin-bottom:.5rem"><button onclick="submit()">Submit</button><p style="font-size:.85rem;color:var(--mu);margin-top:.5rem">Score: ${score} | Time: <span id="tl">${timeLeft}</span>s</p>`;document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});timer=setInterval(()=>{timeLeft--;document.getElementById('tl').textContent=timeLeft;if(timeLeft<=0){clearInterval(timer);running=false;end();}},1000);}function submit(){clearInterval(timer);const ans=document.getElementById('ans').value.trim().toLowerCase();const correct=acronyms[idx%acronyms.length][1].toLowerCase();const ok=ans.includes(correct.split(' ')[0])&&ans.split(' ').length>=2;if(ok)score++;idx++;if(running&&timeLeft>0)nextQ();}function end(){document.getElementById('ab').innerHTML=`<p style="font-size:1.3rem;font-weight:700">Final Score: ${score} / ${idx}</p><p style="color:var(--mu);font-size:.85rem;margin:.5rem 0">You decoded ${score} acronyms in 60 seconds.</p><button onclick="start()">Play Again</button>`;}document.getElementById('ab').innerHTML='<button onclick="start()">Start Game</button><p style="color:var(--mu);font-size:.85rem;margin-top:.5rem">Decode AEC acronyms as fast as you can — 60 seconds on the clock.</p>';</script></body></html>
