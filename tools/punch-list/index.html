<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punch List Builder | XLMX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100vh}
.topbar{background:#111;border-bottom:1px solid #222;padding:12px 20px;display:flex;align-items:center;gap:16px}
.back{color:#c8a96e;text-decoration:none;font-size:13px}.topbar h1{font-size:15px;font-weight:600;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px}
.desc{color:#888;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.box{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:20px;margin-bottom:14px}
.box h2{font-size:11px;font-weight:600;color:#c8a96e;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:11px}label{font-size:11px;color:#888;display:block;margin-bottom:3px}
input,select,textarea{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;color:#e8e8e8;font-size:13px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#c8a96e}
.btn{background:#c8a96e;color:#000;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:#d4b87a}.btn.sm{padding:5px 12px;font-size:11px}
.btn.red{background:#f87171;color:#000}.btn.ghost{background:#1e1e1e;color:#e8e8e8;border:1px solid #333}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:12px}
.klabel{font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase}
.kval{font-size:18px;font-weight:700;color:#c8a96e}
.kval.grn{color:#34d399}.kval.red{color:#f87171}.kval.sky{color:#60a5fa}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:7px 8px;font-size:10px;color:#888;border-bottom:1px solid #222;text-transform:uppercase;font-weight:500;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #161616;font-size:12px;vertical-align:top}
tr:hover td{background:#151515}
.note{font-size:11px;color:#666;margin-top:8px}
.tag{display:inline-block;background:#1e1e1e;border:1px solid #333;border-radius:4px;padding:2px 7px;font-size:10px;color:#888;margin:2px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="topbar"><a href="/tools/" class="back">&#8592; Tools</a><h1>Punch List Builder</h1></div>
<div class="wrap"><p class="desc">Create, sort by priority, and export a project punch list with location and assignee.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
<button class="btn" onclick="addRow()">+ Add Item</button>
<button class="btn ghost" onclick="exportCSV()">Export CSV</button>
<button class="btn ghost" onclick="sortItems()">Sort by Priority</button>
<span style="color:#888;font-size:12px;margin-left:auto;align-self:center" id="sum"></span>
</div>
<div style="overflow-x:auto">
<table>
<thead><tr><th>#</th><th>Description</th><th>Location</th><th>Priority</th><th>Assignee</th><th>Due</th><th>Status</th><th></th></tr></thead>
<tbody id="tbody"></tbody>
</table></div>
<script>
var rows=[];var n=1;
var PRI=["Critical","High","Medium","Low"];
var STAT=["Open","In Progress","Complete","Verified"];
var PCOL={"Critical":"#f87171","High":"#fb923c","Medium":"#fbbf24","Low":"#34d399"};
function addRow(){rows.push({n:n++,desc:"",loc:"",pri:"High",who:"",due:"",status:"Open"});render();}
function render(){
var tb=document.getElementById("tbody");
tb.innerHTML=rows.map(function(r,i){
return'<tr>'+
'<td style="color:#888">'+r.n+'</td>'+
'<td><input value="'+r.desc+'" style="min-width:200px" onchange="rows['+i+'].desc=this.value"></td>'+
'<td><input value="'+r.loc+'" style="width:110px" onchange="rows['+i+'].loc=this.value"></td>'+
'<td><select onchange="rows['+i+'].pri=this.value;render()">'+PRI.map(function(p){return'<option style="color:'+PCOL[p]+'"'+(p===r.pri?" selected":"")+'>'+p+'</option>';}).join("")+'</select></td>'+
'<td><input value="'+r.who+'" style="width:100px" onchange="rows['+i+'].who=this.value"></td>'+
'<td><input type="date" value="'+r.due+'" style="width:130px" onchange="rows['+i+'].due=this.value"></td>'+
'<td><select onchange="rows['+i+'].status=this.value;render()">'+STAT.map(function(s){return'<option'+(s===r.status?" selected":"")+'>'+s+'</option>';}).join("")+'</select></td>'+
'<td><button class="btn red sm" onclick="rows.splice('+i+',1);render()">✕</button></td>'+
'</tr>';
}).join("");
var done=rows.filter(function(r){return r.status==="Complete"||r.status==="Verified";}).length;
document.getElementById("sum").textContent=rows.length+" items | "+done+" complete";
}
function sortItems(){var ord={Critical:0,High:1,Medium:2,Low:3};rows.sort(function(a,b){return ord[a.pri]-ord[b.pri];});render();}
function exportCSV(){
var hdr="#,Description,Location,Priority,Assignee,Due,Status
";
var body=rows.map(function(r){return[r.n,'"'+r.desc+'"',r.loc,r.pri,r.who,r.due,r.status].join(",");}).join("
");
var blob=new Blob([hdr+body],{type:"text/csv"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="punch_list.csv";a.click();
}
addRow();addRow();
</script></div></body></html>
