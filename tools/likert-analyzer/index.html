<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Likert Scale Analyzer — XLMX</title>
<style>
:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#a78bfa;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;padding:32px 24px;}
.wrap{max-width:700px;margin:0 auto;}
h1{font-size:20px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.sub{color:var(--mu);font-size:13px;margin-bottom:28px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.05em;margin-bottom:6px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--acc);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.result{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px;}
.r-label{font-size:11px;color:var(--mu);letter-spacing:.05em;margin-bottom:4px;}
.r-val{font-size:26px;font-weight:700;color:var(--acc);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bd);}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;text-decoration:none;margin-bottom:24px;}
a.back:hover{color:var(--tx);}
canvas{display:block;width:100%;}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.q-title{font-size:14px;font-weight:600;color:var(--tx);}
.btn-sm{background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.3);border-radius:6px;padding:5px 12px;color:var(--acc);font-size:12px;cursor:pointer;}
.btn-sm:hover{background:rgba(167,139,250,.25);}
.q-block{background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;}
.stat-item{flex:1;min-width:80px;}
.stat-val{font-size:18px;font-weight:700;color:var(--acc);}
.stat-lbl{font-size:11px;color:var(--mu);}
.bar-wrap{margin-top:10px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bar-num{font-size:12px;color:var(--mu);width:14px;text-align:right;}
.bar-track{flex:1;height:16px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--acc);transition:width .3s;}
.bar-pct{font-size:12px;color:var(--mu);width:36px;text-align:right;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/tools/">&#8592; All Tools</a>
  <h1>Likert Scale Analyzer</h1>
  <p class="sub">Sociology — Analyze 1–5 scale survey responses</p>

  <div class="card">
    <div class="q-header">
      <span class="q-title">Questions</span>
      <button class="btn-sm" onclick="addQuestion()">+ Add Question</button>
    </div>
    <div id="questions"></div>
  </div>
</div>

<script>
let qCount=0;
function addQuestion(name='',data=''){
  qCount++;
  const id=qCount;
  const div=document.createElement('div');
  div.className='q-block';
  div.id='q'+id;
  div.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <input type="text" placeholder="Question label" value="${name}" style="width:auto;flex:1;margin-right:8px;padding:6px 10px;font-size:13px;" oninput="calcQ(${id})">
      ${id>1?`<button class="btn-sm" onclick="removeQ(${id})" style="color:#ef4444;border-color:rgba(239,68,68,.3);">Remove</button>`:''}
    </div>
    <label style="margin-top:0;">RATINGS (comma-separated, 1-5 scale)</label>
    <textarea id="ta${id}" rows="2" placeholder="e.g. 4,3,5,2,4,5,3,4,4,3,2,5,4" oninput="calcQ(${id})">${data}</textarea>
    <div id="out${id}"></div>
  `;
  document.getElementById('questions').appendChild(div);
  calcQ(id);
}

function removeQ(id){document.getElementById('q'+id).remove();}

function calcQ(id){
  const raw=document.getElementById('ta'+id).value;
  const nums=raw.split(/[\s,]+/).map(v=>parseInt(v)).filter(v=>!isNaN(v)&&v>=1&&v<=5);
  const out=document.getElementById('out'+id);
  if(nums.length<2){out.innerHTML='<div style="color:var(--mu);font-size:12px;margin-top:8px;">Enter at least 2 ratings.</div>';return;}

  const counts=[0,0,0,0,0];
  nums.forEach(v=>counts[v-1]++);
  const n=nums.length;
  const mean=nums.reduce((a,b)=>a+b,0)/n;
  const sorted=[...nums].sort((a,b)=>a-b);
  const median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)];
  let mode=1,maxC=0;
  counts.forEach((c,i)=>{if(c>maxC){maxC=c;mode=i+1;}});
  const variance=nums.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n;
  const std=Math.sqrt(variance);
  const agree=(counts[3]+counts[4])/n*100;
  const disagree=(counts[0]+counts[1])/n*100;
  const neutral=counts[2]/n*100;

  const bars=counts.map((c,i)=>{
    const lbl=['Strongly Disagree','Disagree','Neutral','Agree','Strongly Agree'][i];
    const pct=(c/n*100).toFixed(1);
    return `<div class="bar-row">
      <div class="bar-num">${i+1}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
      <div class="bar-pct">${pct}%</div>
      <div style="font-size:11px;color:var(--mu);width:120px;">${lbl} (${c})</div>
    </div>`;
  }).join('');

  out.innerHTML=`
    <div class="bar-wrap">${bars}</div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-val">${mean.toFixed(2)}</div><div class="stat-lbl">Mean</div></div>
      <div class="stat-item"><div class="stat-val">${median.toFixed(1)}</div><div class="stat-lbl">Median</div></div>
      <div class="stat-item"><div class="stat-val">${mode}</div><div class="stat-lbl">Mode</div></div>
      <div class="stat-item"><div class="stat-val">${std.toFixed(2)}</div><div class="stat-lbl">Std Dev</div></div>
      <div class="stat-item"><div class="stat-val" style="color:#22d3ee;">${agree.toFixed(0)}%</div><div class="stat-lbl">Agreement (4+5)</div></div>
      <div class="stat-item"><div class="stat-val" style="color:#ef4444;">${disagree.toFixed(0)}%</div><div class="stat-lbl">Disagreement (1+2)</div></div>
      <div class="stat-item"><div class="stat-val" style="color:var(--mu);">${neutral.toFixed(0)}%</div><div class="stat-lbl">Neutral (3)</div></div>
      <div class="stat-item"><div class="stat-val">${n}</div><div class="stat-lbl">Responses</div></div>
    </div>`;
}

addQuestion('Overall Satisfaction','5,4,4,3,5,5,4,2,4,4,3,5,4,3,4');
</script>
</body>
</html>
