<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coordinate Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e5e5e5;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:24px 16px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.sub{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:600;color:#22c55e;margin-bottom:14px}
label{display:block;font-size:.8rem;color:#aaa;margin-bottom:4px;margin-top:10px}
input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e5e5e5;padding:8px 10px;font-size:.9rem;font-family:monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:8px;background:#1a1a1a;border:1px solid #333;border-radius:6px;text-align:center;cursor:pointer;font-size:.82rem;transition:all .2s}
.tab.active{background:#22c55e;border-color:#22c55e;color:#000;font-weight:700}
.pane{display:none}.pane.active{display:block}
.result-card{background:#1a1a1a;border-radius:8px;padding:14px;margin-bottom:8px}
.result-card .label{font-size:.75rem;color:#888;margin-bottom:6px}
.result-card .value{font-family:monospace;font-size:.95rem;color:#22c55e;word-break:break-all}
.copy-btn{float:right;background:none;border:1px solid #333;color:#888;border-radius:4px;padding:2px 8px;font-size:.72rem;cursor:pointer}
.copy-btn:hover{border-color:#22c55e;color:#22c55e}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th{text-align:left;color:#888;padding:6px 8px;border-bottom:1px solid #222}
td{padding:6px 8px;border-bottom:1px solid #1a1a1a;font-family:monospace}
</style>
</head>
<body>
<h1>Coordinate Converter</h1>
<p class="sub">Convert between DD, DMS, DDM, UTM, MGRS and ECEF formats</p>

<div class="card">
  <h2>Input Format</h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('dd')">DD</div>
    <div class="tab" onclick="switchTab('dms')">DMS</div>
    <div class="tab" onclick="switchTab('utm')">UTM</div>
  </div>

  <div class="pane active" id="pane-dd">
    <div class="row2">
      <div><label>Latitude (°) — N positive</label><input type="number" id="dd_lat" value="19.4326" step="any" oninput="fromDD()"></div>
      <div><label>Longitude (°) — E positive</label><input type="number" id="dd_lon" value="-99.1332" step="any" oninput="fromDD()"></div>
    </div>
  </div>

  <div class="pane" id="pane-dms">
    <div class="row2">
      <div>
        <label>Latitude</label>
        <div style="display:flex;gap:4px">
          <input type="number" id="lat_d" value="19" style="width:50px" oninput="fromDMS()">
          <input type="number" id="lat_m" value="25" style="width:50px" oninput="fromDMS()">
          <input type="number" id="lat_s" value="57.6" step="any" style="flex:1" oninput="fromDMS()">
          <select id="lat_dir" style="width:50px" onchange="fromDMS()"><option>N</option><option>S</option></select>
        </div>
      </div>
      <div>
        <label>Longitude</label>
        <div style="display:flex;gap:4px">
          <input type="number" id="lon_d" value="99" style="width:50px" oninput="fromDMS()">
          <input type="number" id="lon_m" value="7" style="width:50px" oninput="fromDMS()">
          <input type="number" id="lon_s" value="59.5" step="any" style="flex:1" oninput="fromDMS()">
          <select id="lon_dir" style="width:50px" onchange="fromDMS()"><option>W</option><option>E</option></select>
        </div>
      </div>
    </div>
  </div>

  <div class="pane" id="pane-utm">
    <div class="row2">
      <div><label>Zone (1–60)</label><input type="number" id="utm_zone" value="14" min="1" max="60" oninput="fromUTM()"></div>
      <div><label>Band (C–X)</label><input type="text" id="utm_band" value="Q" maxlength="1" oninput="fromUTM()"></div>
    </div>
    <div class="row2">
      <div><label>Easting (m)</label><input type="number" id="utm_e" value="484400" oninput="fromUTM()"></div>
      <div><label>Northing (m)</label><input type="number" id="utm_n" value="2150000" oninput="fromUTM()"></div>
    </div>
  </div>
</div>

<div class="card">
  <h2>All Formats</h2>
  <div id="results"></div>
</div>

<script>
let _lat=19.4326,_lon=-99.1332;
function switchTab(t){
  ['dd','dms','utm'].forEach(x=>{
    document.querySelector(`.tab:nth-child(${['dd','dms','utm'].indexOf(x)+1})`).classList.toggle('active',x===t);
    document.getElementById('pane-'+x).classList.toggle('active',x===t);
  });
  if(t==='dd'){fromDD();}else if(t==='dms'){fromDMS();}else{fromUTM();}
}
// Fix tab toggle by index — redo using named approach
document.querySelectorAll('.tab').forEach((el,i)=>{
  el.onclick=()=>switchTab(['dd','dms','utm'][i]);
});
function fromDD(){
  _lat=parseFloat(document.getElementById('dd_lat').value)||0;
  _lon=parseFloat(document.getElementById('dd_lon').value)||0;
  showResults();
}
function fromDMS(){
  const ld=parseFloat(document.getElementById('lat_d').value)||0;
  const lm=parseFloat(document.getElementById('lat_m').value)||0;
  const ls=parseFloat(document.getElementById('lat_s').value)||0;
  const ldir=document.getElementById('lat_dir').value;
  const od=parseFloat(document.getElementById('lon_d').value)||0;
  const om=parseFloat(document.getElementById('lon_m').value)||0;
  const os=parseFloat(document.getElementById('lon_s').value)||0;
  const odir=document.getElementById('lon_dir').value;
  _lat=(ld+lm/60+ls/3600)*(ldir==='S'?-1:1);
  _lon=(od+om/60+os/3600)*(odir==='W'?-1:1);
  showResults();
}
function toDMS(dec,isLat){
  const d=Math.abs(dec)|0;
  const mf=(Math.abs(dec)-d)*60;
  const m=mf|0;
  const s=((mf-m)*60).toFixed(4);
  const dir=isLat?(dec>=0?'N':'S'):(dec>=0?'E':'W');
  return`${d}° ${m}' ${s}" ${dir}`;
}
function toDDM(dec,isLat){
  const d=Math.abs(dec)|0;
  const m=((Math.abs(dec)-d)*60).toFixed(6);
  const dir=isLat?(dec>=0?'N':'S'):(dec>=0?'E':'W');
  return`${d}° ${m}' ${dir}`;
}
// UTM conversion (WGS84 simplified)
function toUTM(lat,lon){
  const a=6378137,f=1/298.257223563,b=a*(1-f);
  const e2=1-(b/a)**2,e2p=e2/(1-e2);
  const zone=Math.floor((lon+180)/6)+1;
  const lon0=(zone-1)*6-180+3;
  const k0=0.9996;
  const N0=lat<0?10000000:0;
  const E0=500000;
  const phi=lat*Math.PI/180,lam=(lon-lon0)*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(phi)**2);
  const T=Math.tan(phi)**2,C=e2p*Math.cos(phi)**2;
  const A=Math.cos(phi)*lam;
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const M=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*phi
    -(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*phi)
    +(15*e2**2/256+45*e2**3/1024)*Math.sin(4*phi)
    -(35*e2**3/3072)*Math.sin(6*phi));
  const E=E0+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T**2+72*C-58*e2p)*A**5/120);
  const north=N0+k0*(M+N*Math.tan(phi)*(A**2/2+(5-T+9*C+4*C**2)*A**4/24+(61-58*T+T**2+600*C-330*e2p)*A**6/720));
  const bands='CDEFGHJKLMNPQRSTUVWX';
  const bi=Math.floor((lat+80)/8);
  const band=bands[Math.min(19,Math.max(0,bi))];
  return{zone,band,E:Math.round(E),N:Math.round(north),str:`${zone}${band} ${Math.round(E)}E ${Math.round(north)}N`};
}
function fromUTM(){
  // Simplified inverse UTM
  const zone=parseInt(document.getElementById('utm_zone').value)||14;
  const band=document.getElementById('utm_band').value.toUpperCase()||'Q';
  const E=parseFloat(document.getElementById('utm_e').value)||500000;
  const N=parseFloat(document.getElementById('utm_n').value)||0;
  const isSouth='CDEFGHJKLM'.includes(band);
  const lon0=(zone-1)*6-180+3;
  const a=6378137,f=1/298.257223563,b=a*(1-f);
  const e2=1-(b/a)**2,e2p=e2/(1-e2);
  const k0=0.9996,E0=500000,N0=isSouth?10000000:0;
  const M=(N-N0)/k0;
  const mu=M/(a*(1-e2/4-3*e2**2/64-5*e2**3/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const phi1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1**2/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const Np=a/Math.sqrt(1-e2*Math.sin(phi1)**2);
  const T=Math.tan(phi1)**2,C=e2p*Math.cos(phi1)**2;
  const R=a*(1-e2)/(1-e2*Math.sin(phi1)**2)**1.5;
  const D=(E-E0)/(Np*k0);
  _lat=(phi1-(Np*Math.tan(phi1)/R)*(D**2/2-(5+3*T+10*C-4*C**2-9*e2p)*D**4/24+(61+90*T+298*C+45*T**2-252*e2p-3*C**2)*D**6/720))*180/Math.PI;
  _lon=lon0+((D-(1+2*T+C)*D**3/6+(5-2*C+28*T-3*C**2+8*e2p+24*T**2)*D**5/120)/Math.cos(phi1))*180/Math.PI;
  showResults();
}
function showResults(){
  const utm=toUTM(_lat,_lon);
  // ECEF
  const a=6378137,f=1/298.257223563;
  const e2=2*f-f**2;
  const phi=_lat*Math.PI/180,lam=_lon*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(phi)**2);
  const X=(N)*Math.cos(phi)*Math.cos(lam);
  const Y=(N)*Math.cos(phi)*Math.sin(lam);
  const Z=(N*(1-e2))*Math.sin(phi);
  const results=[
    {label:'Decimal Degrees (DD)',value:`${_lat.toFixed(7)}, ${_lon.toFixed(7)}`},
    {label:'Degrees Minutes Seconds (DMS)',value:`${toDMS(_lat,true)}, ${toDMS(_lon,false)}`},
    {label:'Degrees Decimal Minutes (DDM)',value:`${toDDM(_lat,true)}, ${toDDM(_lon,false)}`},
    {label:'UTM (WGS84)',value:utm.str},
    {label:'ECEF (m)',value:`X: ${X.toFixed(2)}, Y: ${Y.toFixed(2)}, Z: ${Z.toFixed(2)}`},
    {label:'Google Maps link',value:`https://maps.google.com/?q=${_lat.toFixed(6)},${_lon.toFixed(6)}`},
  ];
  document.getElementById('results').innerHTML=results.map(r=>`
    <div class="result-card">
      <div class="label">${r.label} <button class="copy-btn" onclick="navigator.clipboard.writeText('${r.value.replace(/'/g,"\\'")}')">Copy</button></div>
      <div class="value">${r.value}</div>
    </div>`).join('');
}
fromDD();
</script>
</body>
</html>
