<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestalt Principles Reference - XLMX</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#030307;--sf:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);--tx:#e2e8f0;--mu:#6b7280;--acc:#f472b6}body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif;min-height:100vh;padding:2rem 1rem}.wrap{max-width:720px;margin:0 auto}.back{color:var(--acc);text-decoration:none;font-size:.85rem}.back:hover{opacity:1}h1{font-size:1.6rem;font-weight:700;margin:.5rem 0 .25rem}.sub{color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.25rem;margin-bottom:1rem}.card h3{font-size:.8rem;text-transform:uppercase;color:var(--acc);margin-bottom:.75rem}label{display:block;font-size:.82rem;color:var(--mu);margin:.4rem 0 .2rem}input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:6px;padding:.5rem .7rem;color:var(--tx);font-size:.9rem}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:.55rem 1.2rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.75rem}button:hover{opacity:.88}.res{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}.rl{font-size:.8rem;color:var(--mu);text-transform:uppercase;margin-bottom:.4rem}.rv{font-size:1.5rem;font-weight:700;color:var(--acc)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.note{background:rgba(255,255,255,.03);border-left:3px solid var(--acc);padding:.6rem .9rem;font-size:.85rem;color:var(--mu);margin-top:.75rem}</style></head><body><div class="wrap"><a class="back" href="/tools/">&#8592; Library</a><h1>Gestalt Principles Reference</h1><p class="sub">Design — Visual Perception Laws for Layout and Composition</p><div class="card"><h3>Gestalt Principles</h3><div id="gp"></div></div></div><script>const principles=[{name:'Proximity',def:'Elements close together are perceived as a group.',use:'Group related form fields, navigation items, and data columns.'},
{name:'Similarity',def:'Elements that look alike are seen as related.',use:'Use consistent color, shape, or size to signal belonging.'},
{name:'Continuity',def:'The eye follows smooth curves and lines over abrupt changes.',use:'Align elements along a grid axis; use continuous lines in flow diagrams.'},
{name:'Closure',def:'The mind completes incomplete shapes or forms.',use:'Use partial borders, open shapes, or icon outlines to suggest complete forms.'},
{name:'Figure/Ground',def:'The eye separates objects (figure) from their background (ground).',use:'Ensure contrast between interactive elements and background.'},
{name:'Common Fate',def:'Elements moving in the same direction are perceived as a group.',use:'Animate related items together in transitions.'},
{name:'Symmetry',def:'Symmetric layouts feel stable and orderly.',use:'Center important content; use mirrored layouts for comparisons.'},
{name:'Prägnanz',def:'The mind prefers the simplest, most stable interpretation.',use:'Reduce visual complexity; remove decorative elements that add no meaning.'}];
document.getElementById('gp').innerHTML=principles.map(p=>`<div style="padding:.6rem 0;border-bottom:1px solid var(--bd)"><p style="font-weight:600;margin-bottom:.2rem">${p.name}</p><p style="font-size:.85rem;color:var(--mu);margin-bottom:.2rem">${p.def}</p><p style="font-size:.82rem;color:var(--acc)">${p.use}</p></div>`).join('');</script></body></html>
